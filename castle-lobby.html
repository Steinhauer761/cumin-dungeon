<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070403"><title>CumIN Dungeon — Grand Lobby</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,700;1,400;1,700&family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--black:#070403;--gold:#d7a35a;--gold2:#f3cf8a;--cream:#f4eadc;--muted:#ad9b89;--red:#8f1f29;--serif:'Cormorant Garamond',Georgia,serif;--sans:'Inter',system-ui,sans-serif}
*{box-sizing:border-box;margin:0}body{background:radial-gradient(circle at 50% 10%,#43200e 0,#120905 32%,#050302 75%);color:var(--cream);font-family:var(--sans);min-height:100vh}
.lobby{padding:28px 20px 90px;overflow:hidden}
.top{max-width:1180px;margin:auto;display:flex;justify-content:space-between;align-items:center}
.wordmark{font:700 28px var(--serif);font-style:italic}.wordmark strong{color:var(--gold);font-style:normal}
.pill{border:1px solid #8b6036;background:#100905aa;padding:8px 14px;border-radius:999px;color:var(--gold2);font-size:11px;letter-spacing:.16em;text-transform:uppercase}
.hero{max-width:1180px;margin:32px auto 0;text-align:center}
.eyebrow{font-size:10px;letter-spacing:.35em;text-transform:uppercase;color:var(--gold);font-weight:800}
.hero h1{font:700 clamp(36px,7vw,72px)/.95 var(--serif);font-style:italic;margin:10px 0;color:#f6ead8;text-shadow:0 5px 30px #000}
.hero h1 em{color:#bd303a;font-style:italic}
.hero p{max-width:600px;margin:14px auto;color:var(--muted);font-size:.8rem;line-height:1.7}

/* Nav Row */
.nav-row{max-width:1180px;margin:32px auto;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.nav-pill{padding:10px 20px;border:1px solid rgba(213,154,75,0.2);border-radius:10px;background:rgba(18,9,5,0.6);color:var(--cream);font-size:.7rem;font-weight:700;text-decoration:none;transition:all .15s}
.nav-pill:hover{border-color:var(--gold);background:rgba(213,154,75,0.06);color:var(--gold2)}
.nav-pill.active{border-color:var(--gold);color:var(--gold2)}

/* Category Grid */
.categories{max-width:1180px;margin:20px auto}
.section-title{text-align:center;margin:40px 0 20px;font:700 clamp(28px,4vw,38px) var(--serif);font-style:italic;color:var(--cream)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.card{position:relative;overflow:hidden;border:1px solid rgba(109,71,37,0.4);border-radius:14px;background:linear-gradient(145deg,#21120a,#0b0604);box-shadow:0 16px 40px rgba(0,0,0,0.4);cursor:pointer;transition:all .2s;text-decoration:none;color:inherit;display:flex;flex-direction:column;min-height:180px}
.card:hover{transform:translateY(-4px);border-color:var(--gold)}
.card .art{position:absolute;inset:0;opacity:.2;background-size:cover;background-position:center}
.card-content{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center}
.card-icon{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;border:1px solid rgba(213,154,75,0.3);background:rgba(16,7,6,0.8);box-shadow:0 0 20px rgba(0,0,0,0.5);font-size:1.8rem;margin-bottom:12px}
.card-content strong{font:700 1.1rem var(--serif);font-style:italic;display:block}
.card-content small{margin-top:4px;color:var(--muted);font-size:.6rem;letter-spacing:.08em;text-transform:uppercase}
.card-badge{position:absolute;top:10px;right:10px;padding:3px 8px;border-radius:100px;font-size:.42rem;font-weight:800;letter-spacing:.06em}
.card-badge.live{background:rgba(230,57,70,0.85);color:white}
.card-badge.vip{background:rgba(213,154,75,0.15);border:1px solid rgba(213,154,75,0.3);color:var(--gold2)}

.footer{max-width:900px;margin:50px auto 0;text-align:center;color:#8e7c6b;font-size:11px;line-height:1.7}
.footer a{color:var(--gold);text-decoration:none}

@media(max-width:600px){.grid{grid-template-columns:1fr 1fr;gap:10px}.card{min-height:150px}.card-icon{width:50px;height:50px;font-size:1.4rem}.card-content strong{font-size:.9rem}}
</style>
</head>
<body>
<main class="lobby">
<header class="top">
  <div class="wordmark"><strong>CumIN</strong> Dungeon</div>
  <div class="pill">Grand Lobby · 18+</div>
</header>

<section class="hero">
  <div class="eyebrow">The Castle Entrance</div>
  <h1>Welcome to the <em>Dungeon</em></h1>
  <p>Choose a room, explore the casino, or discover performers live now.</p>
</section>

<nav class="nav-row">
  <a href="/discover.html" class="nav-pill">Discover</a>
  <a href="/casino.html" class="nav-pill">Casino</a>
  <a href="/hall.html" class="nav-pill">Grand Hall</a>
  <a href="/lovense.html" class="nav-pill">Shop</a>
</nav>

<section class="categories">
  <h2 class="section-title">Choose a Category</h2>
  <div class="grid" id="grid"></div>
</section>

<p class="footer">CumIN Dungeon · 18+ Private Venue · <a href="/terms.html">Terms</a> · <a href="/privacy.html">Privacy</a> · <a href="/2257.html">2257</a></p>
</main>

<script src="https://cdn.ably.com/lib/ably.min-1.js"></script>
<script src="/public/js/chat.js"></script>
<script>
var CATEGORIES = [
  { name: 'Women', icon: '\ud83c\udf39', desc: 'Live female performers', href: '/discover.html?category=women', badge: 'live' },
  { name: 'Men', icon: '\ud83d\udc51', desc: 'Male performers live', href: '/discover.html?category=men', badge: null },
  { name: 'Couples', icon: '\ud83d\udc8d', desc: 'Watch together, play together', href: '/discover.html?category=couples', badge: 'live' },
  { name: 'Trans', icon: '\ud83c\udf08', desc: 'Bold, expressive, electric', href: '/discover.html?category=trans', badge: 'live' },
  { name: 'LGBTQ+', icon: '\ud83c\udff3\ufe0f', desc: 'All identities welcome', href: '/discover.html?category=lgbtq', badge: null },
  { name: 'Fetish & Kink', icon: '\u26d3\ufe0f', desc: 'Consensual, intense, unleashed', href: '/discover.html?category=fetish', badge: null },
  { name: 'Solo', icon: '\u2728', desc: 'One-on-one performances', href: '/discover.html?category=solo', badge: null },
  { name: 'VIP Rooms', icon: '\ud83d\udd12', desc: 'Very Intimate Pleasure', href: '/discover.html?category=vip', badge: 'vip' },
];

var grid = document.getElementById('grid');
CATEGORIES.forEach(function(cat) {
  var a = document.createElement('a');
  a.className = 'card';
  a.href = cat.href;
  a.innerHTML = '<div class="card-content">' +
    '<div class="card-icon">' + cat.icon + '</div>' +
    '<strong>' + cat.name + '</strong>' +
    '<small>' + cat.desc + '</small>' +
    '</div>' +
    (cat.badge ? '<span class="card-badge ' + cat.badge + '">' + cat.badge.toUpperCase() + '</span>' : '');
  grid.appendChild(a);
});
</script>
<script src="/public/js/admin-bar.js"></script>
</body>
</html>
