<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#050304">
<title>Casino | CumIN Dungeon</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,700&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#050304;--surface:#0c0908;--surface-2:#141010;--gold:#d59a4b;--gold-light:#f5c77e;--gold-dim:#8b6230;--cream:#f5eee4;--muted:#7a6e64;--red:#9f2330;--green:#4ade80;--line:rgba(190,137,77,.12);--serif:'Cormorant Garamond',Georgia,serif;--sans:'Inter',system-ui,sans-serif}
*{box-sizing:border-box;margin:0}body{background:var(--bg);color:var(--cream);font-family:var(--sans);min-height:100vh;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
.casino-nav{position:sticky;top:0;z-index:100;background:rgba(5,3,4,.92);backdrop-filter:blur(20px);border-bottom:1px solid var(--line);padding:0 16px}
.casino-nav-inner{max-width:1280px;margin:auto;height:56px;display:flex;align-items:center;justify-content:space-between}
.casino-brand{font:700 1.1rem var(--serif);color:var(--gold-light)}
.casino-balance{display:flex;align-items:center;gap:8px;padding:6px 14px;border:1px solid var(--line);border-radius:100px;background:rgba(0,0,0,.4)}
.casino-balance .bal-icon{width:18px;height:18px;border-radius:50%;background:linear-gradient(135deg,var(--gold),#a06b28);display:grid;place-items:center;font-size:.5rem;font-weight:900;color:#1a0d07}
.casino-balance .bal-amount{font-size:.78rem;font-weight:800;color:var(--gold-light);font-variant-numeric:tabular-nums}
.back-btn{padding:6px 12px;border:1px solid var(--line);border-radius:6px;font-size:.65rem;font-weight:700;color:var(--muted)}
.back-btn:hover{border-color:var(--gold);color:var(--cream)}
.cat-tabs{padding:12px 16px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.cat-tabs-inner{max-width:1280px;margin:auto;display:flex;gap:6px;min-width:max-content}
.cat-tab{padding:8px 16px;border-radius:100px;font-size:.68rem;font-weight:700;color:var(--muted);border:1px solid transparent;transition:all .15s;white-space:nowrap}
.cat-tab:hover{color:var(--cream);border-color:var(--line)}
.cat-tab.active{background:rgba(213,154,75,.1);border-color:var(--gold-dim);color:var(--gold-light)}
.casino-main{max-width:1280px;margin:auto;padding:24px 16px 100px}
.featured{margin-bottom:40px}
.featured-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.featured-card{position:relative;height:220px;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:var(--surface);transition:transform .2s,border-color .2s,box-shadow .2s;display:block}
.featured-card:hover{transform:translateY(-3px);border-color:var(--gold-dim);box-shadow:0 20px 60px rgba(0,0,0,.5)}
.featured-card .fc-bg{position:absolute;inset:0;background:linear-gradient(135deg,#1a0d07,#0a0604);opacity:.9}
.featured-card .fc-glow{position:absolute;top:-30%;right:-20%;width:60%;height:80%;border-radius:50%;filter:blur(60px);opacity:.15}
.featured-card .fc-content{position:absolute;inset:0;padding:24px;display:flex;flex-direction:column;justify-content:flex-end}
.featured-card .fc-badge{font-size:.5rem;font-weight:800;letter-spacing:.15em;text-transform:uppercase;color:var(--gold);margin-bottom:auto;align-self:flex-start;padding:4px 10px;border:1px solid var(--gold-dim);border-radius:100px}
.featured-card .fc-title{font:700 1.6rem var(--serif);font-style:italic;margin-bottom:4px}
.featured-card .fc-desc{font-size:.68rem;color:var(--muted);line-height:1.4}
.featured-card .fc-play{margin-top:12px;padding:10px 24px;border-radius:8px;background:linear-gradient(135deg,var(--gold-light),#a06b28);color:#1a0d07;font-size:.7rem;font-weight:800;align-self:flex-start;box-shadow:0 4px 16px rgba(213,154,75,.3)}
.section{margin-bottom:36px}
.section-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.section-title{font:700 1.2rem var(--serif);font-style:italic}
.game-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.game-tile{position:relative;aspect-ratio:4/5;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--surface);transition:transform .18s,border-color .18s,box-shadow .18s;display:block}
.game-tile:hover{transform:translateY(-3px) scale(1.02);border-color:var(--gold-dim);box-shadow:0 12px 40px rgba(0,0,0,.4)}
.game-tile .gt-art{position:absolute;inset:0;background:linear-gradient(180deg,var(--surface-2),var(--bg));display:grid;place-items:center}
.game-tile .gt-icon{font-size:2.5rem;opacity:.3}
.game-tile .gt-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(5,3,4,.95) 0%,rgba(5,3,4,.3) 60%,transparent 100%)}
.game-tile .gt-info{position:absolute;bottom:0;left:0;right:0;padding:12px}
.game-tile .gt-name{font:600 .82rem var(--serif);font-style:italic;margin-bottom:2px}
.game-tile .gt-meta{font-size:.52rem;color:var(--muted);font-weight:600}
.game-tile .gt-badge{position:absolute;top:8px;right:8px;font-size:.45rem;font-weight:800;padding:3px 7px;border-radius:4px;background:var(--red);letter-spacing:.06em;text-transform:uppercase}
.game-tile .gt-badge.new{background:#1a7a3a}
.game-tile .gt-badge.hot{background:var(--red)}
.game-tile .gt-badge.jackpot{background:linear-gradient(135deg,var(--gold),#a06b28);color:#1a0d07}
.mobile-nav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:100;background:rgba(5,3,4,.95);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:8px 0 env(safe-area-inset-bottom,8px)}
.mobile-nav-inner{display:flex;justify-content:space-around;align-items:center}
.mobile-nav-item{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 12px;font-size:.5rem;font-weight:700;color:var(--muted);transition:color .15s}
.mobile-nav-item.active{color:var(--gold-light)}
.mobile-nav-item .mn-icon{font-size:1.2rem}
@media(max-width:768px){.mobile-nav{display:block}.casino-main{padding-bottom:120px}.featured-grid{grid-template-columns:1fr}.featured-card{height:180px}.game-grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}}
@media(max-width:400px){.game-grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>

<div class="cat-tabs"><div class="cat-tabs-inner"><button class="cat-tab active" data-cat="all">All Games</button><button class="cat-tab" data-cat="slots">Slots</button><button class="cat-tab" data-cat="table">Table Games</button><button class="cat-tab" data-cat="poker">Poker</button><button class="cat-tab" data-cat="keno">Keno</button><button class="cat-tab" data-cat="jackpot">Jackpots</button></div></div>

</main>

  {id:'dragon-fortune',name:'Dragon Fortune',cat:'slots',desc:'5-Reel, 25-Line, Expanding Wilds',href:'/games/slots.html',badge:'new',icon:'\ud83d\udc09'},
