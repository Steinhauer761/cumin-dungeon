<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grand Hall | CumIN Dungeon</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,700&family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root { --bg:#0a0604; --surface:#141010; --gold:#d59a4b; --gold-light:#f5c77e; --cream:#f5eee4; --muted:#a6998b; --line:rgba(190,137,77,.18); --serif:'Cormorant Garamond',Georgia,serif; --sans:'Inter',system-ui,sans-serif; }
* { box-sizing:border-box; margin:0; }
body { background:var(--bg); color:var(--cream); font-family:var(--sans); font-size:15px; line-height:1.5; }
button { font:inherit; color:inherit; cursor:pointer; }
a { color:inherit; text-decoration:none; }
.hall-hero { position:relative; height:280px; overflow:hidden; }
.hall-hero img { width:100%; height:100%; object-fit:cover; animation:hallZoom 25s ease-in-out infinite alternate; }
@keyframes hallZoom { from{transform:scale(1)} to{transform:scale(1.06) translateY(-2%)} }
.hall-hero-overlay { position:absolute; inset:0; background:linear-gradient(to bottom, rgba(10,6,4,.2), rgba(10,6,4,.95)); display:flex; align-items:flex-end; padding:24px 32px; }
.hall-hero-overlay h1 { font-family:var(--serif); font-size:2.2rem; font-style:italic; }
.hall-layout { display:grid; grid-template-columns:1fr 340px; min-height:calc(100vh - 280px); }
.hall-main { padding:24px; overflow-y:auto; }
.btn-back { padding:10px 14px; border:1px solid var(--line); border-radius:8px; background:transparent; font-size:.72rem; font-weight:700; display:inline-block; margin-bottom:16px; }
.btn-back:hover { border-color:var(--gold); }
.section-title { font-family:var(--serif); font-size:1.35rem; margin-bottom:12px; font-style:italic; }
.section-divider { border:none; border-top:1px solid var(--line); margin:32px 0; }

/* Room Grid */
.rooms-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:12px; margin-bottom:8px; }
.room-card { min-height:140px; border:1px solid var(--line); border-radius:14px; overflow:hidden; position:relative; transition:transform .15s,border-color .15s; display:block; }
.room-card:hover { transform:translateY(-2px); border-color:var(--gold); }
.room-card img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:.4; }
.room-card .room-content { position:relative; padding:16px; display:flex; flex-direction:column; height:100%; min-height:140px; }
.room-card h3 { font-family:var(--serif); font-size:1.05rem; font-style:italic; margin-bottom:4px; }
.room-card p { font-size:.65rem; color:var(--muted); margin-bottom:auto; }
.room-card .viewers { font-size:.6rem; color:var(--gold); font-weight:700; }

/* Casino Grid */
.games-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:12px; }
.game-card { min-height:160px; border:1px solid var(--line); border-radius:14px; overflow:hidden; position:relative; transition:transform .15s,border-color .15s; display:block; cursor:pointer; }
.game-card:hover { transform:translateY(-2px); border-color:var(--gold); }
.game-card img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:.3; }
.game-card .game-content { position:relative; padding:18px; display:flex; flex-direction:column; height:100%; min-height:160px; }
.game-card h3 { font-family:var(--serif); font-size:1.15rem; font-style:italic; margin-bottom:5px; }
.game-card p { font-size:.7rem; color:var(--muted); line-height:1.45; margin-bottom:auto; }
.game-card .bet-range { font-size:.6rem; color:var(--gold); font-weight:700; }

/* Casino transition overlay */
.casino-transition { position:fixed; inset:0; z-index:9999; background:#000; display:none; align-items:center; justify-content:center; }
.casino-transition.active { display:flex; }
.casino-transition video { width:100%; height:100%; object-fit:cover; }

/* Chat */
.hall-chat { display:grid; grid-template-rows:auto 1fr auto; border-left:1px solid var(--line); background:var(--surface); }
.hall-chat-header { padding:14px 16px; border-bottom:1px solid var(--line); }
.hall-chat-header h3 { font-size:.82rem; font-weight:700; }
.hall-chat-header p { font-size:.6rem; color:var(--muted); margin-top:2px; }
.hall-messages { padding:12px 16px; overflow-y:auto; display:flex; flex-direction:column; gap:8px; }
.chat-msg { display:grid; grid-template-columns:24px 1fr; gap:8px; }
.chat-avatar { width:24px; height:24px; border-radius:50%; background:rgba(213,154,75,.15); display:grid; place-items:center; font-size:.55rem; font-weight:800; color:var(--gold); }
.chat-msg p { font-size:.72rem; color:#b8ada3; }
.chat-msg strong { color:var(--cream); }
.hall-chat-input { display:grid; grid-template-columns:1fr auto; gap:8px; padding:12px 16px; border-top:1px solid var(--line); }
.hall-chat-input input { padding:10px 12px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--cream); font-size:.75rem; }
.hall-chat-input button { padding:10px 16px; border:none; border-radius:8px; background:var(--gold); color:var(--bg); font-weight:800; font-size:.72rem; }
@media (max-width:768px) { .hall-layout{grid-template-columns:1fr;} .hall-chat{height:300px;} .hall-hero{height:200px;} }
</style>
</head>
<body>

<!-- Casino Transition Video Overlay -->
<div class="casino-transition" id="casino-transition">
  <video id="casino-transition-video" muted playsinline></video>
</div>

<div class="hall-hero">
  <img id="hall-hero-img" src="" alt="The Grand Hall">
  <div class="hall-hero-overlay"><h1>The Grand Hall</h1></div>
</div>
<div class="hall-layout">
  <main class="hall-main">
    <a href="/" class="btn-back">← Back to Lobby</a>

    <!-- ROOMS SECTION -->
    <h2 class="section-title">Rooms</h2>
    <div class="rooms-grid" id="rooms-grid"></div>

    <hr class="section-divider">

    <!-- GRAND HALL + CASINO (separated) -->
    <h2 class="section-title">Casino Floor</h2>
    <div class="games-grid" id="casino-grid"></div>
  </main>

  <aside class="hall-chat">
    <div class="hall-chat-header"><h3>Grand Hall Chat</h3><p>Everyone's welcome.</p></div>
    <div class="hall-messages" id="hall-messages"></div>
    <form class="hall-chat-input" id="hall-chat-form">
      <input id="hall-chat-input" maxlength="200" placeholder="Say something..." autocomplete="off">
      <button type="submit">Send</button>
    </form>
  </aside>
</div>

<script src="/js/room-art-map.js"></script>
<script src="https://cdn.ably.com/lib/ably.min-1.js"></script>
<script src="/js/chat.js"></script>
<script src="/js/transitions.js"></script>
<script>
var guestId = 'Guest_' + Math.random().toString(36).slice(2,7);

// Set Grand Hall hero from art map
document.getElementById('hall-hero-img').src = window.ROOM_ART['grand-hall'];

// Rooms
var ROOMS = [
  { id:'velvet-room', name:'Velvet Room', desc:'Open lounge with verified host', viewers:184 },
  { id:'tangled-throne', name:'Tangled Throne', desc:'Couples room, get twisted together', viewers:92 },
  { id:'pink-silk', name:'Pink Silk', desc:'Young performers 18-21', viewers:131 },
  { id:'devils-playground', name:"Devil's Playground", desc:'Fetish and kink, no limits', viewers:47 },
  { id:'back-room', name:'Back Room', desc:'Gay social and live', viewers:68 },
  { id:'haleys-halo', name:"Haley's Halo", desc:'She looks innocent but she is not', viewers:156 },
  { id:'trans-kinks', name:'Trans Kinks', desc:'Trans performers and open play', viewers:74 },
];

var roomsGrid = document.getElementById('rooms-grid');
ROOMS.forEach(function(room) {
  var card = document.createElement('a');
  card.className = 'room-card';
  card.href = '/room.html?id=' + room.id;
  card.innerHTML = '<img src="' + (window.ROOM_ART[room.id] || '') + '" alt=""><div class="room-content"><h3>' + room.name + '</h3><p>' + room.desc + '</p><span class="viewers">' + room.viewers + ' watching</span></div>';
  roomsGrid.appendChild(card);
});

// Casino Games
var CASINO_GAMES = [
  { name:'Dungeon Slots', desc:'Spin the reels. Match symbols. Win big.', art:'casino-slots', href:'/games/slots.html' },
  { name:'Strip Blackjack', desc:'Beat the dealer to 21.', art:'casino-blackjack', href:'/games/blackjack.html' },
  { name:'High or Low', desc:'Guess the next card. Build your streak.', art:'casino-highlow', href:'/games/highlow.html' },
  { name:"Devil's Dice", desc:'Predict the roll.', art:'casino-dice', href:'/games/dice.html' },
  { name:'Sin Roulette', desc:'Pick your number or color.', art:'casino-roulette', href:'/games/roulette.html' },
  { name:'Kink Wheel', desc:'Spin the wheel. Land on a prize.', art:'casino-kinkwheel', href:'/games/kinkwheel.html' },
];

var casinoGrid = document.getElementById('casino-grid');
CASINO_GAMES.forEach(function(game) {
  var card = document.createElement('div');
  card.className = 'game-card';
  card.innerHTML = '<img src="' + (window.ROOM_ART[game.art] || '') + '" alt=""><div class="game-content"><h3>' + game.name + '</h3><p>' + game.desc + '</p></div>';
  card.onclick = function() { playCasinoTransition(game.href); };
  casinoGrid.appendChild(card);
});

// Casino transition: play video then navigate
function playCasinoTransition(href) {
  var overlay = document.getElementById('casino-transition');
  var video = document.getElementById('casino-transition-video');
  video.src = window.CASINO_TRANSITION_VIDEO;
  overlay.classList.add('active');
  video.play();
  video.onended = function() {
    window.location.href = href;
  };
  // Fallback: if video fails or takes too long, navigate after 4s
  setTimeout(function() { window.location.href = href; }, 4000);
}

// Chat
if (window.DungeonChat && window.Ably) { DungeonChat.init('grand-hall', guestId, document.getElementById('hall-messages'), null); }
document.getElementById('hall-chat-form').addEventListener('submit', function(e) {
  e.preventDefault();
  var input = document.getElementById('hall-chat-input');
  var msg = input.value.trim();
  if (!msg) return;
  if (window.DungeonChat && DungeonChat.channel) DungeonChat.send(msg);
  else { var div = document.createElement('div'); div.className = 'chat-msg'; div.innerHTML = '<span class="chat-avatar">' + guestId[0].toUpperCase() + '</span><p><strong>' + guestId + ':</strong> ' + msg + '</p>'; document.getElementById('hall-messages').appendChild(div); }
  input.value = '';
});
</script>
</body>
</html>
