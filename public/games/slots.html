<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Inferno Reels | CumIN Dungeon</title><style>
:root{--bg:#070303;--panel:#130908;--gold:#f5c77e;--gold2:#a86422;--cream:#fff4e8;--muted:#9b8275;--red:#d93425;--line:rgba(245,199,126,.2)}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 20%,#42100a,#070303 58%);color:var(--cream);font-family:Inter,system-ui,sans-serif}.app{width:min(620px,100%);margin:auto;padding:12px;min-height:100vh}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.back{color:var(--muted);text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:8px 11px;font-size:12px}.brand{font-family:Georgia,serif;font-style:italic;color:var(--gold)}h1{text-align:center;font:700 38px Georgia,serif;font-style:italic;color:var(--gold);margin:8px 0 2px}.sub{text-align:center;color:var(--muted);font-size:11px;letter-spacing:.14em;text-transform:uppercase}.machine{margin-top:14px;padding:14px;border:1px solid var(--line);border-radius:20px;background:linear-gradient(180deg,#21100c,#0d0706);box-shadow:0 30px 90px #000;position:relative}.reels{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;padding:8px;background:#030202;border:2px solid #8c4c1c;border-radius:15px;overflow:hidden}.reel{height:300px;background:#eee4d7;border-radius:9px;overflow:hidden;position:relative;box-shadow:inset 0 0 20px #000}.strip{position:absolute;top:0;left:0;width:100%;transition:transform 1.15s cubic-bezier(.12,.8,.15,1)}.symbol{height:100px;display:grid;place-items:center;font-size:54px;color:#2a110c;background:linear-gradient(180deg,#fffaf2,#ded0bd);border-bottom:1px solid #b8a791}.symbol:nth-child(odd){background:linear-gradient(180deg,#f8eee2,#d5c5b0)}.symbol.seven{color:#c72e22;font-weight:900}.winline{position:absolute;left:0;right:0;top:50%;height:100px;transform:translateY(-50%);border-top:3px solid var(--gold);border-bottom:3px solid var(--gold);background:rgba(245,199,126,.08);pointer-events:none;z-index:3}.controls{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;margin-top:14px}.bet{display:flex;align-items:center;justify-content:center;gap:8px}.bet button,.spin{border:1px solid var(--line);background:#1b0c09;color:var(--cream);border-radius:9px;padding:11px 15px;font-weight:800}.spin{width:82px;height:82px;border-radius:50%;background:linear-gradient(160deg,#ffe19d,#a86422);color:#1b0904;border:2px solid var(--gold);font-size:12px;box-shadow:0 8px 30px #8f3b1f66}.spin:disabled{opacity:.4}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:12px}.stat{background:#090504;border:1px solid var(--line);border-radius:10px;padding:9px;text-align:center}.stat small{display:block;color:var(--muted);font-size:9px;text-transform:uppercase}.stat b{color:var(--gold);font-size:18px}.result{text-align:center;min-height:34px;padding-top:8px;font-weight:800}.result.win{color:#70ef8b}.result.big{color:#ffe08c;font-size:22px}.meter{margin-top:10px;border:1px solid var(--line);border-radius:10px;padding:10px;background:#090504}.meterline{height:8px;background:#24110c;border-radius:99px;overflow:hidden;margin-top:6px}.meterfill{height:100%;width:0;background:linear-gradient(90deg,#d93425,#ffd05b);transition:width .25s}.free{display:none;margin-top:10px;padding:11px;text-align:center;border:1px solid var(--gold);border-radius:10px;background:#3b170d;color:#ffe08c;font-weight:800}.free.on{display:block}@media(max-width:500px){.reel{height:225px}.symbol{height:75px;font-size:40px}.winline{height:75px}.controls{gap:5px}.spin{width:66px;height:66px}}
</style></head><body><main class="app"><div class="top"><a class="back" href="/hall.html">← Hall</a><span class="brand">CumIN Dungeon</span></div><h1>Inferno Reels</h1><div class="sub">5 reels · 3 rows · wild fireballs · bonus spins</div><section class="machine"><div class="reels" id="reels"></div><div class="winline"></div><div class="result" id="result">Ready to spin</div><div class="controls"><div class="bet"><button id="minus">−</button><b id="bet">10</b><button id="plus">+</button></div><button class="spin" id="spin">SPIN</button><div></div></div><div class="stats"><div class="stat"><small>Balance</small><b id="balance">1000</b></div><div class="stat"><small>Win</small><b id="win">0</b></div><div class="stat"><small>Fireballs</small><b id="fire">0/10</b></div></div><div class="meter"><small>Fireball bonus meter</small><div class="meterline"><div class="meterfill" id="meter"></div></div></div><div class="free" id="free">20 FREE SPINS READY</div></section></main><script>
const symbols=[['🍒','cherry'],['💎','diamond'],['🔥','fire'],['👑','crown'],['7','seven'],['🍒','cherry'],['💎','diamond'],['🔥','fire'],['👑','crown']];const reelsEl=document.getElementById('reels'),balanceEl=document.getElementById('balance'),betEl=document.getElementById('bet'),winEl=document.getElementById('win'),fireEl=document.getElementById('fire'),meterEl=document.getElementById('meter'),result=document.getElementById('result'),freeEl=document.getElementById('free');let balance=1000,bet=10,fireballs=Number(localStorage.getItem('cumin_fireballs')||0),freeSpins=Number(localStorage.getItem('cumin_free_spins')||0),busy=false;const bets=[5,10,20,50,100];
function build(){reelsEl.innerHTML='';for(let c=0;c<5;c++){const r=document.createElement('div');r.className='reel';const s=document.createElement('div');s.className='strip';for(let i=0;i<16;i++){const x=symbols[i%symbols.length],d=document.createElement('div');d.className='symbol '+x[1];d.textContent=x[0];s.appendChild(d)}r.appendChild(s);reelsEl.appendChild(r)}}function pick(){const x=Math.random();if(x<.07)return['🔥','fire'];if(x<.18)return['7','seven'];if(x<.38)return['💎','diamond'];if(x<.58)return['👑','crown'];return['🍒','cherry']}function sync(){balanceEl.textContent=balance;betEl.textContent=bet;fireEl.textContent=(fireballs%10)+'/10';meterEl.style.width=(fireballs%10)*10+'%';freeEl.classList.toggle('on',freeSpins>0);localStorage.setItem('cumin_fireballs',fireballs);localStorage.setItem('cumin_free_spins',freeSpins)}
function spin(){if(busy||(!freeSpins&&balance<bet))return;busy=true;document.getElementById('spin').disabled=true;const cols=[];for(let c=0;c<5;c++){const reel=reelsEl.children[c],strip=reel.firstChild,vals=[];for(let r=0;r<3;r++)vals.push(pick());cols.push(vals);strip.innerHTML='';for(let i=0;i<18;i++){const v=vals[i%3],d=document.createElement('div');d.className='symbol '+v[1];d.textContent=v[0];strip.appendChild(d)}strip.style.transition='none';strip.style.transform='translateY(0)';void strip.offsetWidth;strip.style.transition='transform '+(1+c*.12)+'s cubic-bezier(.12,.8,.15,1)';strip.style.transform='translateY(-'+(1200+c*100)+'px)'}if(freeSpins>0)freeSpins--;else balance-=bet;sync();setTimeout(()=>{let fires=0;cols.flat().forEach(v=>{if(v[1]==='fire')fires++});fireballs+=fires;let payout=0;for(let r=0;r<3;r++){const row=cols.map(c=>c[r][1]),nonfire=row.filter(x=>x!=='fire');if(nonfire.length&&nonfire.every(x=>x===nonfire[0]))payout+=({cherry:3,diamond:8,crown:12,seven:25}[nonfire[0]]||2)*bet}if(fires>=2)payout+=fires*bet;if(fireballs>=10){fireballs-=10;freeSpins+=20;result.textContent='🔥 FIREBALL BONUS · 20 FREE SPINS!';result.className='result big'}else if(payout){balance+=payout;winEl.textContent=payout;result.textContent='WIN · +'+payout+' TOKENS';result.className='result win'}else{winEl.textContent='0';result.textContent='No win this spin';result.className='result'}sync();busy=false;document.getElementById('spin').disabled=false},1500)}document.getElementById('minus').onclick=()=>{let i=bets.indexOf(bet);bet=bets[Math.max(0,i-1)];sync()};document.getElementById('plus').onclick=()=>{let i=bets.indexOf(bet);bet=bets[Math.min(bets.length-1,i+1)];sync()};document.getElementById('spin').onclick=spin;build();sync();
</script></body></html>
