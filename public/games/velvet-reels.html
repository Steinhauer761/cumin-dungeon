<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Velvet Reels</title><style>body{margin:0;background:radial-gradient(circle,#32101d,#080305 65%);color:#fff;font-family:system-ui}.app{max-width:620px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between}.back{color:#b99a7c}.brand{color:#f5c77e;font:italic 18px Georgia}.h{text-align:center}.h h1{font:italic 700 42px Georgia;color:#f5c77e;margin:18px 0 2px}.sub{color:#a88d80;font-size:11px}.machine{margin-top:15px;padding:14px;border:1px solid #70475a;border-radius:18px;background:#15090f;box-shadow:0 30px 80px #000}.reels{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;background:#030202;padding:8px;border-radius:12px}.reel{height:270px;overflow:hidden;background:#eee2d2;border-radius:8px}.strip{transition:transform 1.2s cubic-bezier(.12,.8,.15,1)}.sym{height:90px;display:grid;place-items:center;font-size:46px;border-bottom:1px solid #c8b6a0;color:#251019}.line{position:absolute;left:14px;right:14px;top:50%;height:90px;transform:translateY(-50%);border-block:3px solid #f5c77e;pointer-events:none}.frame{position:relative}.controls{display:flex;justify-content:space-between;align-items:center;margin-top:14px}.controls button{padding:10px 14px;border-radius:9px;border:1px solid #70475a;background:#1b0b13;color:white}.spin{width:78px;height:78px;border-radius:50%!important;background:linear-gradient(#f5c77e,#9b5221)!important;color:#170a04!important;font-weight:900}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:12px}.stat{padding:9px;text-align:center;border:1px solid #70475a;border-radius:9px}.stat small{display:block;color:#a88d80;font-size:9px}.stat b{color:#f5c77e;font-size:17px}.result{text-align:center;min-height:28px;padding:8px;font-weight:800}@media(max-width:500px){.reel{height:210px}.sym{height:70px}.line{height:70px}.spin{width:64px;height:64px}}</style></head><body><main class="app"><div class="top"><a class="back" href="/hall.html">← Hall</a><span class="brand">CumIN Dungeon</span></div><section class="h"><h1>Velvet Reels</h1><div class="sub">Five reels · velvet symbols · fast play</div></section><section class="machine"><div class="frame"><div class="reels" id="reels"></div><div class="line"></div></div><div class="result" id="result">Ready</div><div class="controls"><div><button id="minus">−</button> <b id="bet">10</b> <button id="plus">+</button></div><button class="spin" id="spin">SPIN</button><span></span></div><div class="stats"><div class="stat"><small>Balance</small><b id="bal">1000</b></div><div class="stat"><small>Win</small><b id="win">0</b></div><div class="stat"><small>Mode</small><b>5×3</b></div></div></section></main><script>const syms=['🌹','💎','👑','🗝️','7','🍒','🖤'],R=document.getElementById('reels');let bal=1000,bet=10,busy=false;function build(){R.innerHTML='';for(let c=0;c<5;c++){let r=document.createElement('div');r.className='reel';let s=document.createElement('div');s.className='strip';for(let i=0;i<18;i++){let d=document.createElement('div');d.className='sym';d.textContent=syms[i%syms.length];s.appendChild(d)}r.appendChild(s);R.appendChild(r)}}function spin(){if(busy||bal<bet)return;busy=true;document.getElementById('spin').disabled=true;bal-=bet;document.getElementById('bal').textContent=bal;let out=[];for(let c=0;c<5;c++){let vals=[];for(let r=0;r<3;r++)vals.push(syms[Math.floor(Math.random()*syms.length)]);out.push(vals);let s=R.children[c].firstChild;s.innerHTML='';for(let i=0;i<18;i++){let d=document.createElement('div');d.className='sym';d.textContent=vals[i%3];s.appendChild(d)}s.style.transition='none';s.style.transform='translateY(0)';void s.offsetWidth;s.style.transition='transform '+(1+c*.12)+'s cubic-bezier(.12,.8,.15,1)';s.style.transform='translateY(-'+(900+c*90)+'px)'}setTimeout(()=>{let payout=0;for(let r=0;r<3;r++){let row=out.map(c=>c[r]);if(row.every(x=>x===row[0]))payout+=({ '🌹':5,'💎':10,'👑':15,'🗝️':20,'7':30,'🍒':4,'🖤':8}[row[0]]||2)*bet}if(payout){bal+=payout;document.getElementById('result').textContent='WIN · +'+payout;document.getElementById('win').textContent=payout}else document.getElementById('result').textContent='No win';document.getElementById('bal').textContent=bal;busy=false;document.getElementById('spin').disabled=false},1550)}document.getElementById('minus').onclick=()=>{bet=Math.max(5,bet-5);document.getElementById('bet').textContent=bet};document.getElementById('plus').onclick=()=>{bet=Math.min(100,bet+5);document.getElementById('bet').textContent=bet};document.getElementById('spin').onclick=spin;build();</script></body></html>
