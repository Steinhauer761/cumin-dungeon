<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Fireball Keno | CumIN Dungeon</title><style>:root{--bg:#070303;--panel:#140907;--gold:#f5c77e;--red:#e04428;--muted:#9b8275;--line:rgba(245,199,126,.2)}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 10%,#4a1309,#070303 62%);color:#fff4e8;font-family:Inter,system-ui,sans-serif}.app{width:min(650px,100%);margin:auto;padding:14px}.top{display:flex;justify-content:space-between}.back{color:var(--muted);text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:8px 11px;font-size:12px}.brand{color:var(--gold);font:italic 16px Georgia}.hero{text-align:center;margin:16px 0}.hero h1{font:700 42px Georgia;color:var(--gold);font-style:italic;margin:0}.hero p{color:var(--muted);font-size:11px}.board{padding:14px;border:1px solid var(--line);border-radius:18px;background:rgba(13,5,3,.88);box-shadow:0 30px 90px #000}.numbers{display:grid;grid-template-columns:repeat(8,1fr);gap:7px}.num{aspect-ratio:1;border:1px solid var(--line);border-radius:50%;background:#1a0b08;color:#fff0df;font-weight:800}.num.hit{background:linear-gradient(160deg,#ff9b36,#a91d12);box-shadow:0 0 22px #ff4b1a99;animation:pop .35s}.num.selected{border-color:var(--gold);background:#40200e}.num.fire{font-size:20px}@keyframes pop{50%{transform:scale(1.18)}}.bar{display:grid;grid-template-columns:1fr auto;gap:10px;margin-top:14px;align-items:center}.bet{display:flex;gap:7px;align-items:center}.bet button,.draw{padding:11px 15px;border:1px solid var(--line);border-radius:9px;background:#1a0b08;color:#fff4e8;font-weight:800}.draw{background:linear-gradient(160deg,#ffe19d,#a86422);color:#1b0904;border-color:var(--gold)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:12px}.stat{padding:9px;text-align:center;border:1px solid var(--line);border-radius:10px}.stat small{display:block;color:var(--muted);font-size:9px}.stat b{color:var(--gold);font-size:17px}.meter{margin-top:12px;padding:11px;border:1px solid var(--line);border-radius:10px}.meterline{height:9px;background:#27100b;border-radius:99px;overflow:hidden;margin-top:6px}.fill{height:100%;width:0;background:linear-gradient(90deg,#d93425,#ffd05b);transition:width .25s}.bonus{margin-top:12px;padding:13px;text-align:center;border:1px solid var(--gold);border-radius:11px;background:#42150c;color:#ffe08c;font-weight:900;display:none}.bonus.on{display:block}.result{text-align:center;min-height:34px;padding:10px 0;font-weight:800}.result.win{color:#70ef8b}.notice{text-align:center;color:#6f5d54;font-size:10px;margin-top:12px}@media(max-width:500px){.numbers{grid-template-columns:repeat(6,1fr)}.hero h1{font-size:34px}}</style></head><body><main class="app"><div class="top"><a class="back" href="/hall.html">← Hall</a><span class="brand">CumIN Dungeon</span></div><section class="hero"><h1>🔥 Fireball Keno</h1><p>Pick numbers · catch fireballs · every 10 fireballs unlocks 20 free spins</p></section><section class="board"><div class="numbers" id="numbers"></div><div class="result" id="result">Pick up to 10 numbers</div><div class="bar"><div class="bet"><button id="minus">−</button><b id="bet">10</b><button id="plus">+</button><span style="color:#9b8275;font-size:11px">tokens</span></div><button class="draw" id="draw">DRAW</button></div><div class="stats"><div class="stat"><small>Balance</small><b id="balance">1000</b></div><div class="stat"><small>Hits</small><b id="hits">0</b></div><div class="stat"><small>Fireballs</small><b id="fire">0/10</b></div></div><div class="meter"><small>Fireball bonus meter</small><div class="meterline"><div class="fill" id="fill"></div></div></div><div class="bonus" id="bonus">🔥 20 FREE SPINS UNLOCKED 🔥</div></section><div class="notice">Entertainment tokens only. No cash value.</div></main><script>
const ns=document.getElementById('numbers'),balanceEl=document.getElementById('balance'),hitsEl=document.getElementById('hits'),fireEl=document.getElementById('fire'),fill=document.getElementById('fill'),result=document.getElementById('result'),bonus=document.getElementById('bonus'),betEl=document.getElementById('bet');let selected=new Set(),balance=1000,bet=10,fireballs=Number(localStorage.getItem('cumin_fireballs')||0),freeSpins=Number(localStorage.getItem('cumin_keno_free')||0),busy=false;const bets=[5,10,20,50,100];for(let i=1;i<=40;i++){const b=document.createElement('button');b.className='num';b.textContent=i;b.onclick=()=>{if(busy)return;if(selected.has(i)){selected.delete(i);b.classList.remove('selected')}else if(selected.size<10){selected.add(i);b.classList.add('selected')}result.textContent=selected.size+' numbers selected'};ns.appendChild(b)}function sync(){balanceEl.textContent=balance;betEl.textContent=bet;fireEl.textContent=(fireballs%10)+'/10';fill.style.width=(fireballs%10)*10+'%';bonus.classList.toggle('on',freeSpins>0);localStorage.setItem('cumin_fireballs',fireballs);localStorage.setItem('cumin_keno_free',freeSpins)}function draw(){if(busy||selected.size<1||(!freeSpins&&balance<bet))return;busy=true;document.getElementById('draw').disabled=true;if(freeSpins)freeSpins--;else balance-=bet;document.querySelectorAll('.num').forEach(x=>x.classList.remove('hit','fire'));const picked=Array.from({length:10},()=>1+Math.floor(Math.random()*40));let hits=0,fires=0;picked.forEach((n,i)=>setTimeout(()=>{const el=ns.children[n-1];el.classList.add('hit');if(Math.random()<.28){el.classList.add('fire');fires++}if(selected.has(n))hits++;},i*110));setTimeout(()=>{fireballs+=fires;let payout=hits>=6?bet*25:hits>=5?bet*12:hits>=4?bet*5:hits>=3?bet*2:0;if(payout){balance+=payout;result.textContent='WIN · '+hits+' hits · +'+payout+' tokens';result.className='result win'}else{result.textContent=hits+' hits · no payout';result.className='result'}hitsEl.textContent=hits;if(fireballs>=10){fireballs-=10;freeSpins+=20;result.textContent='🔥 FIREBALL BONUS · 20 FREE SPINS!';result.className='result win'}sync();busy=false;document.getElementById('draw').disabled=false},1500)}document.getElementById('draw').onclick=draw;document.getElementById('minus').onclick=()=>{let i=bets.indexOf(bet);bet=bets[Math.max(0,i-1)];sync()};document.getElementById('plus').onclick=()=>{let i=bets.indexOf(bet);bet=bets[Math.min(bets.length-1,i+1)];sync()};sync();</script></body></html>
