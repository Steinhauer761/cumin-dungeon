<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Dragon Flight | CumIN Dungeon Casino</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,700;1,700&family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#050304;--surface:#0c0908;--surface-2:#141010;--gold:#d59a4b;--gold-light:#f5c77e;--gold-dim:#8b6230;--cream:#f5eee4;--muted:#7a6e64;--red:#e63946;--green:#4ade80;--line:rgba(190,137,77,.18);--serif:'Cormorant Garamond',Georgia,serif;--sans:'Inter',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--cream);font-family:var(--sans);font-size:14px;touch-action:manipulation}

/* Fullscreen layout */
.app{display:flex;flex-direction:column;height:100dvh;width:100vw;position:relative;overflow:hidden}

/* Header */
.hdr{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line);flex-shrink:0;z-index:10}
.hdr a{color:var(--muted);font-size:.7rem;font-weight:700;text-decoration:none}
.hdr .brand{font-family:var(--serif);font-style:italic;font-size:.9rem;color:var(--gold-light)}
.hdr .bal{font-size:.72rem;font-weight:800;color:var(--gold-light);font-variant-numeric:tabular-nums}

/* History bar */
.history{display:flex;gap:5px;padding:8px 16px;overflow-x:auto;flex-shrink:0;background:var(--surface)}
.history .pill{padding:3px 8px;border-radius:100px;font-size:.58rem;font-weight:800;white-space:nowrap}
.history .pill.low{background:rgba(74,222,128,.12);color:var(--green)}
.history .pill.mid{background:rgba(213,154,75,.12);color:var(--gold-light)}
.history .pill.high{background:rgba(230,57,70,.12);color:var(--red)}

/* Game canvas area */
.game-area{flex:1;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%}
.multiplier{position:absolute;font-size:clamp(3rem,15vw,6rem);font-weight:900;color:var(--cream);text-shadow:0 0 40px rgba(213,154,75,.4);z-index:2;transition:color .15s}
.multiplier.crashed{color:var(--red);text-shadow:0 0 40px rgba(230,57,70,.5)}
.multiplier.waiting{font-size:clamp(1.2rem,5vw,2rem);color:var(--muted)}
.plane{position:absolute;font-size:2rem;z-index:3;transition:transform .1s linear}

/* Controls */
.controls{flex-shrink:0;padding:12px 16px 16px;background:var(--surface);border-top:1px solid var(--line)}
.bet-panels{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.panel{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.panel .label{font-size:.55rem;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;text-align:center}
.bet-row{display:flex;align-items:center;justify-content:center;gap:8px}
.bet-row button{width:28px;height:28px;border-radius:6px;background:var(--surface);border:1px solid var(--line);color:var(--cream);font-weight:800;font-size:.8rem}
.bet-row .amount{font-size:.9rem;font-weight:800;color:var(--gold-light);min-width:50px;text-align:center;font-variant-numeric:tabular-nums}
.action-btn{width:100%;padding:12px;border:none;border-radius:10px;font-size:.78rem;font-weight:800;cursor:pointer;transition:all .15s}
.action-btn.bet{background:var(--green);color:#0a0604}
.action-btn.cashout{background:linear-gradient(135deg,var(--gold),#b8802e);color:#0a0604;animation:pulseBtn 1s ease-in-out infinite}
.action-btn.waiting{background:var(--surface);border:1px solid var(--line);color:var(--muted);cursor:not-allowed}
.action-btn.crashed{background:var(--red);color:white}
@keyframes pulseBtn{0%,100%{transform:scale(1)}50%{transform:scale(1.02)}}

/* Quick bets */
.quick-bets{display:flex;gap:4px;justify-content:center;flex-wrap:wrap}
.quick-bets button{padding:4px 8px;border-radius:5px;background:var(--surface);border:1px solid var(--line);color:var(--muted);font-size:.55rem;font-weight:700}
.quick-bets button:hover{border-color:var(--gold-dim);color:var(--gold-light)}

/* Fullscreen button */
.fs-btn{position:absolute;top:10px;right:10px;z-index:20;width:32px;height:32px;border-radius:6px;background:rgba(0,0,0,.6);border:1px solid var(--line);color:var(--cream);font-size:.9rem;display:grid;place-items:center;cursor:pointer}

/* FX */
.fx-layer{position:fixed;inset:0;pointer-events:none;z-index:100;overflow:hidden}
.coin{position:absolute;top:-20px;width:12px;height:12px;background:var(--gold);border-radius:50%;animation:coinFall var(--dur) ease-in forwards}
@keyframes coinFall{to{transform:translateY(110vh) rotate(720deg);opacity:0}}

/* Landscape optimization */
@media(orientation:landscape){.app{flex-direction:row;flex-wrap:wrap}.hdr{width:100%;height:auto}.history{width:100%}.game-area{flex:1;min-height:0}.controls{width:320px;height:calc(100% - 80px);overflow-y:auto;border-top:none;border-left:1px solid var(--line)}}
@media(max-height:500px){.history{display:none}.hdr{padding:6px 12px}}
</style>
</head>
<body>
<div class="app">
  <header class="hdr">
    <a href="/casino.html">← Casino</a>
    <span class="brand">Dragon Flight</span>
    <span class="bal" id="bal">1,000,000</span>
  </header>
  <div class="history" id="history"></div>
  <main class="game-area" id="gameArea">
    <canvas id="cv"></canvas>
    <div class="multiplier waiting" id="mult">Place your bet</div>
    <div class="plane" id="plane" style="display:none">🐉</div>
    <button class="fs-btn" id="fsBtn" title="Fullscreen">⛶</button>
  </main>
  <div class="controls">
    <div class="bet-panels">
      <div class="panel">
        <span class="label">Bet 1</span>
        <div class="bet-row">
          <button id="b1m">−</button>
          <span class="amount" id="b1a">10K</span>
          <button id="b1p">+</button>
        </div>
        <button class="action-btn bet" id="btn1">BET</button>
      </div>
      <div class="panel">
        <span class="label">Bet 2</span>
        <div class="bet-row">
          <button id="b2m">−</button>
          <span class="amount" id="b2a">10K</span>
          <button id="b2p">+</button>
        </div>
        <button class="action-btn bet" id="btn2">BET</button>
      </div>
    </div>
    <div class="quick-bets" style="margin-top:8px">
      <button data-bet="1000">1K</button>
      <button data-bet="5000">5K</button>
      <button data-bet="10000">10K</button>
      <button data-bet="50000">50K</button>
      <button data-bet="100000">100K</button>
    </div>
  </div>
</div>
<div class="fx-layer" id="fxL"></div>

<script>
(function(){
'use strict';

var CONFIG = {
  BETS: [1000,2000,5000,10000,25000,50000,100000,250000,500000],
  START_BALANCE: 1000000,
  HOUSE_EDGE: 0.04,
  MIN_CRASH: 1.0,
  MAX_DISPLAY: 9999.99
};

var fmtBet = function(n){ return n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?Math.round(n/1e3)+'K':n; };
var fmtMult = function(x){ return x>=100?x.toFixed(0)+'x':x.toFixed(2)+'x'; };

var balance = CONFIG.START_BALANCE;
var bet1 = 10000, bet2 = 10000;
var bet1Active = false, bet2Active = false;
var bet1Cashed = false, bet2Cashed = false;
var gameState = 'waiting'; // waiting, flying, crashed
var crashPoint = 1;
var currentMult = 1;
var startTime = 0;
var historyArr = [];
var animId = null;

// DOM
var cv = document.getElementById('cv');
var ctx = cv.getContext('2d');
var multEl = document.getElementById('mult');
var planeEl = document.getElementById('plane');
var balEl = document.getElementById('bal');
var btn1 = document.getElementById('btn1');
var btn2 = document.getElementById('btn2');
var b1a = document.getElementById('b1a');
var b2a = document.getElementById('b2a');
var histEl = document.getElementById('history');
var gameArea = document.getElementById('gameArea');

function resize(){
  cv.width = gameArea.offsetWidth * devicePixelRatio;
  cv.height = gameArea.offsetHeight * devicePixelRatio;
  ctx.scale(devicePixelRatio, devicePixelRatio);
}
window.addEventListener('resize', resize);
resize();

// Fullscreen
document.getElementById('fsBtn').onclick = function(){
  if(!document.fullscreenElement) document.documentElement.requestFullscreen().catch(function(){});
  else document.exitFullscreen();
};

// Audio
var SFX = (function(){
  var c;
  function g(){ if(!c) c=new(window.AudioContext||window.webkitAudioContext)(); if(c.state==='suspended')c.resume(); return c; }
  function tone(freq,type,dur,vol){
    var x=g(),o=x.createOscillator(),gn=x.createGain();
    o.type=type;o.frequency.value=freq;gn.gain.value=vol||.05;
    gn.gain.exponentialRampToValueAtTime(.001,x.currentTime+dur);
    o.connect(gn);gn.connect(x.destination);o.start();o.stop(x.currentTime+dur);
  }
  return {
    tick: function(){ tone(600,'sine',.03,.03); },
    cashout: function(){ tone(880,'sine',.15,.06); setTimeout(function(){tone(1100,'sine',.15,.05);},80); },
    crash: function(){ tone(200,'sawtooth',.4,.08); tone(100,'square',.5,.06); },
    takeoff: function(){ tone(440,'sine',.1,.04); }
  };
})();

// Game math
function genCrash(){
  var r = Math.random();
  if(r < CONFIG.HOUSE_EDGE) return 1.0;
  return 1 / (1 - r);
}

function getMultAtTime(t){
  return Math.pow(Math.E, 0.00006 * t * t + 0.001 * t);
}

// Bet controls
function cycleBet(current, dir){
  var idx = CONFIG.BETS.indexOf(current);
  if(idx === -1) idx = 3;
  idx += dir;
  if(idx < 0) idx = 0;
  if(idx >= CONFIG.BETS.length) idx = CONFIG.BETS.length - 1;
  return CONFIG.BETS[idx];
}

document.getElementById('b1m').onclick = function(){ bet1 = cycleBet(bet1,-1); b1a.textContent = fmtBet(bet1); };
document.getElementById('b1p').onclick = function(){ bet1 = cycleBet(bet1,1); b1a.textContent = fmtBet(bet1); };
document.getElementById('b2m').onclick = function(){ bet2 = cycleBet(bet2,-1); b2a.textContent = fmtBet(bet2); };
document.getElementById('b2p').onclick = function(){ bet2 = cycleBet(bet2,1); b2a.textContent = fmtBet(bet2); };
b1a.textContent = fmtBet(bet1);
b2a.textContent = fmtBet(bet2);

document.querySelectorAll('.quick-bets button').forEach(function(b){
  b.onclick = function(){ var v = parseInt(b.dataset.bet); bet1 = v; bet2 = v; b1a.textContent = fmtBet(v); b2a.textContent = fmtBet(v); };
});

// Actions
btn1.onclick = function(){
  if(gameState === 'waiting'){
    if(balance < bet1) return;
    balance -= bet1; bet1Active = true; bet1Cashed = false;
    btn1.className = 'action-btn waiting'; btn1.textContent = 'Waiting...';
    updateBal();
    tryStart();
  } else if(gameState === 'flying' && bet1Active && !bet1Cashed){
    cashOut(1);
  }
};
btn2.onclick = function(){
  if(gameState === 'waiting'){
    if(balance < bet2) return;
    balance -= bet2; bet2Active = true; bet2Cashed = false;
    btn2.className = 'action-btn waiting'; btn2.textContent = 'Waiting...';
    updateBal();
    tryStart();
  } else if(gameState === 'flying' && bet2Active && !bet2Cashed){
    cashOut(2);
  }
};

function cashOut(which){
  var win;
  if(which === 1){ win = Math.floor(bet1 * currentMult); balance += win; bet1Cashed = true; btn1.className='action-btn bet'; btn1.textContent=fmtBet(win)+' WON'; }
  if(which === 2){ win = Math.floor(bet2 * currentMult); balance += win; bet2Cashed = true; btn2.className='action-btn bet'; btn2.textContent=fmtBet(win)+' WON'; }
  SFX.cashout();
  updateBal();
  spawnCoins(Math.min(30, Math.floor(currentMult * 3)));
}

function tryStart(){
  if(gameState !== 'waiting') return;
  if(!bet1Active && !bet2Active) return;
  setTimeout(startRound, 1500 + Math.random() * 1500);
  multEl.className = 'multiplier waiting';
  multEl.textContent = 'Starting...';
}

function startRound(){
  gameState = 'flying';
  crashPoint = genCrash();
  currentMult = 1;
  startTime = performance.now();
  planeEl.style.display = 'block';
  multEl.className = 'multiplier';
  SFX.takeoff();
  if(bet1Active && !bet1Cashed){ btn1.className='action-btn cashout'; btn1.textContent='CASH OUT'; }
  if(bet2Active && !bet2Cashed){ btn2.className='action-btn cashout'; btn2.textContent='CASH OUT'; }
  animate();
}

function animate(){
  var elapsed = performance.now() - startTime;
  currentMult = getMultAtTime(elapsed / 50);
  if(currentMult >= crashPoint){
    crash();
    return;
  }
  multEl.textContent = fmtMult(currentMult);
  drawGraph(elapsed);
  positionPlane(elapsed);
  animId = requestAnimationFrame(animate);
}

function crash(){
  gameState = 'crashed';
  currentMult = crashPoint;
  multEl.textContent = fmtMult(crashPoint);
  multEl.className = 'multiplier crashed';
  planeEl.style.display = 'none';
  SFX.crash();

  if(bet1Active && !bet1Cashed){ btn1.className='action-btn crashed'; btn1.textContent='CRASHED'; }
  if(bet2Active && !bet2Cashed){ btn2.className='action-btn crashed'; btn2.textContent='CRASHED'; }

  historyArr.unshift(crashPoint);
  if(historyArr.length > 20) historyArr.pop();
  renderHistory();

  setTimeout(resetRound, 2500);
}

function resetRound(){
  gameState = 'waiting';
  bet1Active = false; bet2Active = false;
  bet1Cashed = false; bet2Cashed = false;
  btn1.className = 'action-btn bet'; btn1.textContent = 'BET';
  btn2.className = 'action-btn bet'; btn2.textContent = 'BET';
  multEl.className = 'multiplier waiting'; multEl.textContent = 'Place your bet';
  ctx.clearRect(0, 0, cv.width/devicePixelRatio, cv.height/devicePixelRatio);
  if(balance < 100) balance = CONFIG.START_BALANCE;
  updateBal();
}

function drawGraph(elapsed){
  var w = cv.width / devicePixelRatio;
  var h = cv.height / devicePixelRatio;
  ctx.clearRect(0, 0, w, h);

  // Grid lines
  ctx.strokeStyle = 'rgba(190,137,77,0.08)';
  ctx.lineWidth = 1;
  for(var i = 1; i < 5; i++){
    ctx.beginPath(); ctx.moveTo(0, h * i/5); ctx.lineTo(w, h * i/5); ctx.stroke();
  }

  // Curve
  ctx.beginPath();
  ctx.strokeStyle = currentMult < 2 ? '#4ade80' : currentMult < 10 ? '#f5c77e' : '#e63946';
  ctx.lineWidth = 3;
  ctx.shadowColor = ctx.strokeStyle;
  ctx.shadowBlur = 10;
  var points = Math.min(200, Math.floor(elapsed / 30));
  for(var p = 0; p <= points; p++){
    var t = (elapsed * p / points) / 50;
    var m = getMultAtTime(t);
    var x = (p / 200) * w * 0.85 + w * 0.08;
    var y = h - (Math.log(m) / Math.log(crashPoint + 1)) * h * 0.75 - h * 0.1;
    if(p === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.stroke();
  ctx.shadowBlur = 0;

  // Fill under curve
  ctx.lineTo((points/200) * w * 0.85 + w * 0.08, h);
  ctx.lineTo(w * 0.08, h);
  ctx.closePath();
  ctx.fillStyle = currentMult < 2 ? 'rgba(74,222,128,0.05)' : currentMult < 10 ? 'rgba(213,154,75,0.05)' : 'rgba(230,57,70,0.05)';
  ctx.fill();
}

function positionPlane(elapsed){
  var w = gameArea.offsetWidth;
  var h = gameArea.offsetHeight;
  var points = Math.min(200, Math.floor(elapsed / 30));
  var x = (points / 200) * w * 0.85 + w * 0.08;
  var m = currentMult;
  var y = h - (Math.log(m) / Math.log(crashPoint + 1)) * h * 0.75 - h * 0.1;
  planeEl.style.transform = 'translate(' + (x - 16) + 'px,' + (y - 16) + 'px) rotate(-15deg)';
}

function renderHistory(){
  histEl.innerHTML = '';
  historyArr.forEach(function(v){
    var cls = v < 2 ? 'low' : v < 10 ? 'mid' : 'high';
    histEl.innerHTML += '<span class="pill '+cls+'">'+fmtMult(v)+'</span>';
  });
}

function updateBal(){
  balEl.textContent = balance.toLocaleString();
}

function spawnCoins(n){
  var l=document.getElementById('fxL');
  for(var i=0;i<n;i++){
    var c=document.createElement('div');c.className='coin';
    c.style.left=(10+Math.random()*80)+'%';
    c.style.setProperty('--dur',(1.5+Math.random()*1.5)+'s');
    c.style.animationDelay=(Math.random()*.4)+'s';
    l.appendChild(c);setTimeout(function(el){return function(){el.remove()}}(c),3500);
  }
}

updateBal();
// Seed history
for(var i=0;i<10;i++) historyArr.push(parseFloat((genCrash()).toFixed(2)));
renderHistory();
})();
</script>
</body>
</html>
