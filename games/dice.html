<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Devil's Dice | CumIN Dungeon</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,700;1,400;1,700&family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root { --bg: #050304; --surface: #0c0908; --gold: #d59a4b; --gold-light: #f5c77e; --gold-dim: #8b6230; --cream: #f5eee4; --muted: #7a6e64; --red: #e63946; --green: #4ade80; --line: rgba(190,137,77,0.18); --serif: 'Cormorant Garamond', Georgia, serif; --sans: 'Inter', system-ui, sans-serif; }
* { box-sizing: border-box; margin: 0; }
body { background: var(--bg); color: var(--cream); font-family: var(--sans); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
body::before { content: ''; position: fixed; inset: 0; background: radial-gradient(ellipse at 50% 30%, rgba(159,35,48,0.06), transparent 50%); pointer-events: none; }
button { font: inherit; color: inherit; cursor: pointer; }
.back-btn { position: fixed; top: 12px; left: 12px; padding: 7px 12px; border: 1px solid var(--line); border-radius: 8px; background: rgba(5,3,4,0.9); font-size: 0.65rem; font-weight: 700; color: var(--cream); text-decoration: none; z-index: 50; }
.game-box { width: min(400px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: 24px; padding: 24px; box-shadow: 0 0 50px rgba(0,0,0,0.4); text-align: center; }
.game-box h1 { font-family: var(--serif); font-size: 1.9rem; font-style: italic; font-weight: 700; color: var(--gold-light); margin-bottom: 4px; }
.game-box > p { font-size: 0.6rem; color: var(--muted); margin-bottom: 16px; }
.info-bar { display: flex; justify-content: space-between; padding: 10px 14px; background: rgba(0,0,0,0.3); border-radius: 12px; margin-bottom: 20px; border: 1px solid var(--line); }
.info-bar .balance { font-size: 1.1rem; font-weight: 800; color: var(--gold-light); font-variant-numeric: tabular-nums; }
.info-bar .label { font-size: 0.5rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; }
.dice-area { display: flex; gap: 16px; justify-content: center; margin: 24px 0; }
.die { width: 72px; height: 72px; border-radius: 12px; background: #141010; border: 1px solid var(--line); display: grid; place-items: center; font-size: 2.2rem; font-weight: 900; box-shadow: 0 8px 20px rgba(0,0,0,0.3); transition: transform 0.3s; }
.die.rolling { animation: diceShake 0.4s ease-in-out; }
@keyframes diceShake { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-15deg) scale(0.9); } 75% { transform: rotate(15deg) scale(0.9); } }
.sum-display { font-family: var(--serif); font-size: 1.6rem; font-weight: 700; color: var(--cream); margin: 8px 0; }
.bet-row { display: flex; gap: 8px; justify-content: center; margin-bottom: 16px; }
.bet-chip { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); display: grid; place-items: center; font-size: 0.6rem; font-weight: 800; background: rgba(255,255,255,0.02); }
.bet-chip:hover { border-color: var(--gold); }
.bet-chip.active { border-color: var(--gold); background: rgba(213,154,75,0.12); color: var(--gold-light); }
.roll-btn { padding: 14px 32px; border: none; border-radius: 12px; background: linear-gradient(180deg, var(--gold-light), var(--gold-dim)); color: var(--bg); font-family: var(--serif); font-weight: 700; font-size: 1rem; font-style: italic; box-shadow: 0 4px 18px rgba(213,154,75,0.2); transition: transform 0.12s; }
.roll-btn:hover { transform: translateY(-2px); }
.roll-btn:disabled { opacity: 0.3; cursor: not-allowed; transform: none; }
.result { min-height: 40px; margin-top: 16px; }
.result-text { font-size: 0.85rem; font-weight: 700; padding: 8px 16px; border-radius: 10px; display: inline-block; animation: fadeIn 0.3s; }
.result-win { background: rgba(74,222,128,0.08); color: var(--green); border: 1px solid rgba(74,222,128,0.2); }
.result-lose { background: rgba(159,35,48,0.08); color: var(--red); border: 1px solid rgba(159,35,48,0.2); }
.rules { margin-top: 16px; padding: 12px; background: rgba(0,0,0,0.2); border-radius: 10px; border: 1px solid var(--line); font-size: 0.55rem; color: var(--muted); line-height: 1.6; text-align: left; }
.rules b { color: var(--cream); }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.notice { margin-top: 12px; font-size: 0.5rem; color: var(--muted); opacity: 0.6; }
</style>
</head>
<body>
<a href="/casino.html" class="back-btn">◂ Casino</a>
<div class="game-box">
  <h1>Devil's Dice</h1>
  <p>Roll the bones. Let fate decide.</p>
  <div class="info-bar">
    <div><span class="label">Balance</span><span class="balance" id="balance">0</span></div>
    <div><span class="label">Bet</span><span class="balance" id="bet-display">0</span></div>
  </div>
  <div class="dice-area"><div class="die" id="die1">?</div><div class="die" id="die2">?</div></div>
  <div class="sum-display" id="sum"></div>
  <div class="bet-row">
    <button class="bet-chip" data-val="1000">1K</button>
    <button class="bet-chip active" data-val="2500">2.5K</button>
    <button class="bet-chip" data-val="5000">5K</button>
    <button class="bet-chip" data-val="10000">10K</button>
  </div>
  <button class="roll-btn" id="roll-btn">Roll the Dice</button>
  <div class="result" id="result"></div>
  <div class="rules"><b>7 or 11:</b> Win 2x &nbsp; <b>Snake Eyes (1+1):</b> Win 5x &nbsp; <b>Anything else:</b> House takes it</div>
  <p class="notice">Entertainment tokens only. No cash value.</p>
</div>
<script src="/public/js/balance.js"></script>
<script>
var bet = 2500, rolling = false;
var DICE_FACES = ['\u2680','\u2681','\u2682','\u2683','\u2684','\u2685'];

function refreshBalance() { document.getElementById('balance').textContent = TokenBank.fmt(TokenBank.get()); document.getElementById('bet-display').textContent = TokenBank.fmt(bet); }
refreshBalance();

document.querySelectorAll('.bet-chip').forEach(function(c) { c.addEventListener('click', function() { document.querySelectorAll('.bet-chip').forEach(function(x) { x.classList.remove('active'); }); c.classList.add('active'); bet = parseInt(c.dataset.val); refreshBalance(); }); });

document.getElementById('roll-btn').addEventListener('click', function() {
  if (rolling || TokenBank.get() < bet) return;
  rolling = true;
  this.disabled = true;
  document.getElementById('result').innerHTML = '';
  TokenBank.subtract(bet);
  refreshBalance();

  var d1 = document.getElementById('die1'), d2 = document.getElementById('die2');
  d1.classList.add('rolling'); d2.classList.add('rolling');
  d1.textContent = '?'; d2.textContent = '?';
  document.getElementById('sum').textContent = '';

  var val1 = Math.floor(Math.random() * 6) + 1;
  var val2 = Math.floor(Math.random() * 6) + 1;

  setTimeout(function() {
    d1.classList.remove('rolling'); d2.classList.remove('rolling');
    d1.textContent = DICE_FACES[val1 - 1]; d2.textContent = DICE_FACES[val2 - 1];
    var sum = val1 + val2;
    document.getElementById('sum').textContent = 'Sum: ' + sum;

    var msg = '', cls = '';
    if (val1 === 1 && val2 === 1) { var win = bet * 5; TokenBank.add(win); msg = 'Snake Eyes! +' + TokenBank.fmt(win); cls = 'result-win'; }
    else if (sum === 7 || sum === 11) { var win = bet * 2; TokenBank.add(win); msg = 'Winner! +' + TokenBank.fmt(win); cls = 'result-win'; }
    else { msg = 'No luck. Lost ' + TokenBank.fmt(bet); cls = 'result-lose'; }

    refreshBalance();
    document.getElementById('result').innerHTML = '<span class="result-text ' + cls + '">' + msg + '</span>';
    rolling = false;
    document.getElementById('roll-btn').disabled = false;
  }, 800);
});
</script>
<script src="/public/js/admin-bar.js"></script>
</body>
</html>
