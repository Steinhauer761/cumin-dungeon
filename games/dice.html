ow:0 12px 30px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.8);border:2px solid #ddd;transition:transform .1s}.die.rolling{animation:diceRoll .08s linear infinite}@keyframes diceRoll{0%{transform:rotateX(0) rotateZ(0)}25%{transform:rotateX(90deg) rotateZ(45deg)}50%{transform:rotateX(180deg) rotateZ(90deg)}75%{transform:rotateX(270deg) rotateZ(135deg)}100%{transform:rotateX(360deg) rotateZ(180deg)}}.die.land{animation:diceLand .3s cubic-bezier(.16,1,.3,1)}@keyframes diceLand{0%{transform:scale(1.15) rotateZ(8deg)}50%{transform:scale(.95) rotateZ(-3deg)}100%{transform:scale(1) rotateZ(0)}}.shake{animation:shake .2s}@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}.sum-display{text-align:center;font-size:1.6rem;font-weight:900;color:var(--gold-light);min-height:36px;margin-bottom:6px}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}.choice{padding:12px 8px;border:1.5px solid var(--line);border-radius:10px;background:rgba(0,0,0,.3);text-align:center;cursor:pointer;transition:all .12s}.choice:hover{border-color:var(--gold)}.choice.active{border-color:var(--gold);background:rgba(213,154,75,.12);box-shadow:0 0 12px rgba(213,154,75,.15)}.choice .ch-name{display:block;font-size:.68rem;font-weight:800;color:var(--cream)}.choice .ch-mult{display:block;font-size:.55rem;color:var(--gold);margin-top:2px;font-weight:700}.info-bar{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:8px}.info-box{background:rgba(0,0,0,.6);border:1px solid var(--line);border-radius:10px;padding:7px;text-align:center;backdrop-filter:blur(4px)}.info-box .lbl{display:block;font-size:.46rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}.info-box .val{display:block;font-size:.95rem;font-weight:800;color:var(--gold-light);font-variant-numeric:tabular-nums}.win-msg{text-align:center;min-height:28px;display:grid;place-items:center;margin-top:4px}.win-msg span{fo le(.7);opacity:.6}}.notice{text-align:center;font-size:.48rem;color:rgba(122,110,100,.4);padding:8px 0}@media(max-width:380px){.die{width:72px;height:72px;font-size:2.2rem;border-radius:12px}.roll-btn{width:56px;height:56px}}</style></head><body><script src="/public/js/god-mode.js"></script><div class="app"><div class="header"><a href="/hall.html">&larr; Hall</a><span class="brand">CumIN Dungeon</span></div><div class="title-area"><h1>Devil's Dice</h1><p class="sub">Two Dice &middot; Predict the Roll &middot; No Limit</p></div><div class="dice-stage" id="stage"><div class="die" id="d1">&#9860;</div><div class="die" id="d2">&#9858;</div></div><div class="sum-display" id="sumD"></div><div class="choices" id="choices"></div><div class="info-bar"><div class="info-box"><span class="lbl">Balance</span><span class="val" id="bal">1M</span></div><div class="info-box"><span class="lbl">Bet</span><span class="val" id="tBet">1K</span></div><div class="info-box"><span class="lbl">Win</span><span class="val" id="lWin">0</span></div></div><div class="win-msg"><span id="wTxt"></span></div><div class="controls"><div class="bet-section"><div class="bet-lbl">Bet</div><div class="bet-ctrl"><button id="bD">&minus;</button><span class="bet-val" id="bV">1K</span><button id="bU">+</button></div></div><button class="roll-btn" id="rollBtn">ROLL</button><div></div></div><p class="notice">Entertainment tokens only. No cash value.</p></div><div class="fx-layer" id="fxL"></div><script>(()=>{'use strict';const CC=window.CUMIN_CASINO||{BETS:[100,500,1000,5000,10000,50000,100000],START_BALANCE:1000000,fmtBet:n=>n>=1e6?(n/1e6)+'M':n>=1e3?(n/1e3)+'K':n,godRefill:b=>b<100?1000000:b};const BETS=CC.BETS,fmtBet=CC.fmtBet;let betIdx=2,balance=CC.START_BALANCE,rolling=false,pick='over';const SFX=(()=>{let c;const g=()=>{if(!c)c=new(window.AudioContext||window.webkitAudioContext)();if(c.state==='suspended')c.resume();return c};const p=(f,t,d,v=.08)=>{try{const x=g(),o=x.createOscillator(),gn=x.createGain();o.type=t;o.frequency.setValueAtTime(f,x.currentTime);gn.gain.setValueAtTime(v,x.currentTime);gn.gain.exponentialRampToValueAtTime(.001,x.currentTime+d);o.connect(gn).connect(x.destination);o.start();o.stop(x.currentTime+d)}catch(e){}};return{roll(){p(200,'sawtooth',.04,.05)},land(){p(120,'sine',.1,.08)},win(){[0,60,120,180].forEach((d,i)=>setTimeout(()=>p(500+i*80,'sine',.15,.08),d))},big(){[0,80,160,240,320].forEach((d,i)=>setTimeout(()=>p(400+i*100,'triangle',.22,.1),d))}}})();const FACES=['\u2680','\u2681','\u2682','\u2683','\u2684','\u2685'];const CHOICES=[{key:'over',name:'Over 7',mult:1.9},{key:'under',name:'Under 7',mult:1.9},{key:'seven',name:'Exact 7',mult:5},{key:'double',name:'Doubles',mult:5},{key:'snake',name:'Snake Eyes',mult:25},{key:'box',name:'Boxcars',mult:25}];function buildChoices(){const ct=document.getElementById('choices');CHOICES.forEach(ch=>{const el=document.createElement('div');el.className='choice'+(ch.key===pick?' active':'');el.innerHTML=`<span class="ch-name">${ch.name}</span><span class="ch-mult">${ch.mult}x</span>`;el.onclick=()=>{if(rolling)return;pick=ch.key;document.querySelectorAll('.choice').forEach(c=>c.classList.remove('active'));el.classList.add('active')};ct.appendChild(el)})}async function roll(){const bet=BETS[betIdx];if(rolling||balance<bet)return;rolling=true;balance-=bet;hideWin();updateUI();document.getElementById('rollBtn').disabled=true;const d1=document.getElementById('d1'),d2=document.getElementById('d2');d1.classList.add('rolling');d2.classList.add('rolling');SFX.roll();for(let i=0;i<10;i++){d1.textContent=FACES[Math.floor(Math.random()*6)];d2.textContent=FACES[Math.floor(Math.random()*6)];await new Promise(r=>setTimeout(r,60))}const a=1+Math.floor(Math.random()*6),b=1+Math.floor(Math.random()*6),sum=a+b;d1.textContent=FACES[a-1];d2.textContent=FACES[b-1];d1.classList.remove('rolling');d2.classList.remove('rolling');d1.classList.add('land');d2.classList.add('land');SFX.land();setTimeout(()=>{d1.classList.remove('land');d2.classList.remove('land')},300);document.getElementById('sumD').textContent='Total: '+sum;const won=(pick==='over'&&sum>7)||(pick==='under'&&sum<7)||(pick==='seven'&&sum===7)||(pick==='double'&&a===b)||(pick==='snake'&&a===1&&b===1)||(pick==='box'&&a===6&&b===6);const mult=CHOICES.find(c=>c.key===pick).mult;if(won){const payout=Math.floor(bet*mult);balance+=payout;document.getElementById('lWin').textContent=fmtBet(payout-bet);if(mult>=10){showMsg('BIG WIN +'+fmtBet(payout),'big');SFX.big();spawnCoins(30);document.getElementById('stage').classList.add('shake');setTimeout(()=>document.getElementById('stage').classList.remove('shake'),200)}else{showMsg('WIN +'+fmtBet(payout),'win');SFX.win();spawnCoins(10)}}else{document.getElementById('lWin').textContent='0';showMsg('No win','lose')}balance=CC.godRefill(balance);updateUI();rolling=false;document.getElementById('rollBtn').disabled=false}function updateUI(){document.getElementById('bal').textContent=fmtBet(balance);document.getElementById('tBet').textContent=fmtBet(BETS[betIdx]);document.getElementById('bV').textContent=fmtBet(BETS[betIdx])}function hideWin(){const e=document.getElementById('wTxt');e.className='';e.textContent=''}function showMsg(t,type){const e=document.getElementById('wTxt');e.className='';setTimeout(()=>{e.textContent=t;e.className='active '+type},50)}function spawnCoins(n){const l=document.getElementById('fxL');for(let i=0;i<n;i++){const c=document.createElement('div');c.className='coin';c.style.left=(10+Math.random()*80)+'%';c.style.setProperty('--dur',(1.5+Math.random()*1.5)+'s');c.style.animationDelay=(Math.random()*.5)+'s';const sz=6+Math.random()*6;c.style.width=sz+'px';c.style.height=sz+'px';l.appendChild(c);setTimeout(()=>c.remove(),3500)}}document.getElementById('rollBtn').addEventListener('click',roll);document.getElementById('bD').addEventListener('click',()=>{if(!rolling&&betIdx>0){betIdx--;updateUI()}});document.getElementById('bU').addEventListener('click',()=>{if(!rolling&&betIdx<BETS.length-1){betIdx++;updateUI()}});document.addEventListener('keydown',e=>{if(e.code==='Space'&&!rolling){e.preventDefault();roll()}});document.addEventListener('touchstart',()=>{try{SFX.roll()}catch(e){}},{once:true});buildChoices();updateUI()})();</script></body></html>
