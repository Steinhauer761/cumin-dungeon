000,10000,50000,100000],START_BALANCE:1000000,fmtBet:n=>n>=1e6?(n/1e6)+'M':n>=1e3?(n/1e3)+'K':n,godRefill:b=>b<100?1000000:b};const CHIPS=CC.BETS,fmtBet=CC.fmtBet;let chipIdx=2,balance=CC.START_BALANCE,spinning=false,bets={};const SFX=(()=>{let c;const g=()=>{if(!c)c=new(window.AudioContext||window.webkitAudioContext)();if(c.state==='suspended')c.resume();return c};const p=(f,t,d,v=.08)=>{try{const x=g(),o=x.createOscillator(),gn=x.createGain();o.type=t;o.frequency.setValueAtTime(f,x.currentTime);gn.gain.setValueAtTime(v,x.currentTime);gn.gain.exponentialRampToValueAtTime(.001,x.currentTime+d);o.connect(gn).connect(x.destination);o.start();o.stop(x.currentTime+d)}catch(e){}};return{tick(){p(1200,'sine',.02,.04)},stop(){p(200,'sine',.12,.1)},win(){[0,60,120,180].forEach((d,i)=>setTimeout(()=>p(500+i*80,'sine',.15,.08),d))},big(){[0,80,160,240,320].forEach((d,i)=>setTimeout(()=>p(400+i*100,'triangle',.22,.1),d))}}})();const ORDER=[0,32,15,19,4,21,2,25,17,34,6,27,13,36,11,30,8,23,10,5,24,16,33,1,20,14,31,9,22,18,29,7,28,12,35,3,26];const REDS=new Set([1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36]);const POCKETS=37;const cv=document.getElementById('cv');const ctx=cv.getContext('2d');let W,H,cx,cy,radius,dpr;function resize(){const sec=cv.parentElement;dpr=Math.min(window.devicePixelRatio||1,2);W=sec.clientWidth;H=sec.clientHeight;cv.width=W*dpr;cv.height=H*dpr;cv.style.width=W+'px';cv.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0);cx=W/2;cy=H/2;radius=Math.min(W,H)/2-8}let wheelAngle=0,ballAngle=0,ballRadius=0,ballVisible=false;function drawWheel(){ctx.clearRect(0,0,W,H);const sa=Math.PI*2/POCKETS;ctx.save();ctx.translate(cx,cy);ctx.rotate(wheelAngle);ctx.beginPath();ctx.arc(0,0,radius,0,Math.PI*2);ctx.fillStyle='#1a0f0a';ctx.fill();ctx.strokeStyle='#8b6230';ctx.lineWidth=3;ctx.stroke();for(let i=0;i<POCKETS;i++){const a=i*sa-Math.PI/2;const num=ORDER[i];ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,radius*.88,a,a+sa);ctx.closePath();ctx.fillStyle=num===0?'#1a7a3a':REDS.has(num)?'#8b1a1a':'#1a1214';ctx.fill();ctx.strokeStyle='rgba(213,154,75,.2)';ctx.lineWidth=.5;ctx.stroke();const ta=a+sa/2,tr=radius*.72;ctx.save();ctx.translate(Math.cos(ta)*tr,Math.sin(ta)*tr);ctx.rotate(ta+Math.PI/2);ctx.fillStyle='#f5eee4';ctx.font=`bold ${radius*.06}px Inter,sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(num.toString(),0,0);ctx.restore()}ctx.beginPath();ctx.arc(0,0,radius*.35,0,Math.PI*2);ctx.fillStyle='#0a0604';ctx.fill();ctx.strokeStyle='#8b6230';ctx.lineWidth=2;ctx.stroke();ctx.beginPath();ctx.arc(0,0,radius*.12,0,Math.PI*2);ctx.fillStyle='#d59a4b';ctx.fill();ctx.restore();if(ballVisible){const bx=cx+Math.cos(ballAngle)*ballRadius,by=cy+Math.sin(ballAngle)*ballRadius;ctx.beginPath();ctx.arc(bx,by,5,0,Math.PI*2);ctx.fillStyle='#f5eee4';ctx.fill();ctx.shadowColor='rgba(245,238,228,.6)';ctx.shadowBlur=8;ctx.beginPath();ctx.arc(bx,by,5,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0}ctx.beginPath();ctx.moveTo(cx,cy-radius-6);ctx.lineTo(cx-6,cy-radius-16);ctx.lineTo(cx+6,cy-radius-16);ctx.closePath();ctx.fillStyle='#f5c77e';ctx.fill()}let animId=null,spinStart,spinDuration,targetAngle;function easeOutQuart(t){return 1-Math.pow(1-t,4)}function startSpin(){const totalBet=Object.values(bets).reduce((s,v)=>s+v,0);if(spinning||totalBet===0)return;if(balance<totalBet){return}spinning=true;document.getElementById('sBtn').disabled=true;document.getElementById('sBtn').classList.add('running');balance-=totalBet;updateUI();hideWin();document.getElementById('resNum').classList.remove('show');const resultIdx=Math.floor(Math.random()*POCKETS);const resultNum=ORDER[resultIdx];const sa=Math.PI*2/POCKETS;const fullSpins=5+Math.random()*3;targetAngle=wheelAngle+fullSpins*Math.PI*2+(Math.PI*2-resultIdx*sa-sa/2+Math.PI/2);spinDuration=4000+Math.random()*1500;spinStart=performance.now();ballVisible=true;ballAngle=Math.random()*Math.PI*2;ballRadius=radius*.82;if(animId)cancelAnimationFrame(animId);animId=requestAnimationFrame(spinTick);cv._result=resultNum}function spinTick(now){const t=Math.min(1,(now-spinStart)/spinDuration);const eased=easeOutQuart(t);const realWA=wheelAngle;wheelAngle=wheelAngle+(targetAngle-wheelAngle)*eased;const ballSpeed=(1-eased)*12+.2;ballAngle-=ballSpeed*.02;ballRadius=radius*(.82-(eased*.22));if(t>.6&&t<.98&&Math.random()<.08)SFX.tick();drawWheel();wheelAngle=realWA;if(t>=1){wheelAngle=targetAngle%(Math.PI*2);ballVisible=false;animId=null;drawWheel();SFX.stop();finishSpin();return}animId=requestAnimationFrame(spinTick)}function finishSpin(){const resultNum=cv._result;const resEl=document.getElementById('resNum');resEl.textContent=resultNum;resEl.style.color=resultNum===0?'#4ade80':REDS.has(resultNum)?'#ff6b6b':'#f5eee4';resEl.classList.add('show');let totalWin=0;for(const[key,amt]of Object.entries(bets)){const mult=evaluateBet(key,resultNum);if(mult>0)totalWin+=amt*mult}balance+=totalWin;balance=CC.godRefill(balance);updateUI();document.getElementById('lWin').textContent=fmtBet(totalWin);const totalBet=Object.values(bets).reduce((s,v)=>s+v,0);if(totalWin>0)showMsg('WIN +'+fmtBet(totalWin),totalWin>=totalBet*8?'big':'win');else showMsg('No win','lose');if(totalWin>=totalBet*8){spawnCoins(35);SFX.big()}else if(totalWin>0){spawnCoins(12);SFX.win()}spinning=false;document.getElementById('sBtn').disabled=false;document.getElementById('sBtn').classList.remove('running')}function evaluateBet(key,num){if(key.startsWith('n_')){return parseInt(key.slice(2))===num?36:0}if(num===0)return 0;switch(key){case'red':return REDS.has(num)?2:0;case'black':return!REDS.has(num)?2:0;case'odd':return num%2===1?2:0;case'even':return num%2===0?2:0;case'low':return num>=1&&num<=18?2:0;case'high':return num>=19?2:0;case'd1':return num<=12?3:0;case'd2':return num>=13&&num<=24?3:0;case'd3':return num>=25?3:0;case'c1':return num%3===1?3:0;case'c2':return num%3===2?3:0;case'c3':return num%3===0?3:0;default:return 0}}function buildFelt(){const felt=document.getElementById('felt');felt.innerHTML='';const zero=document.createElement('div');zero.className='cell green-num zero-cell';zero.textContent='0';zero.dataset.bet='n_0';zero.style.gridRow='1/4';zero.style.gridColumn='1';felt.appendChild(zero);for(let col=0;col<12;col++){for(let row=0;row<3;row++){const num=col*3+(3-row);const cell=document.createElement('div');cell.className='cell '+(REDS.has(num)?'red-num':'black-num');cell.textContent=num;cell.dataset.bet='n_'+num;cell.style.gridRow=(row+1).toString();cell.style.gridColumn=(col+2).toString();felt.appendChild(cell)}}[{key:'d1',label:'1-12',col:'2/6'},{key:'d2',label:'13-24',col:'6/10'},{key:'d3',label:'25-36',col:'10/14'}].forEach(b=>{const cell=document.createElement('div');cell.className='cell outside';cell.textContent=b.label;cell.dataset.bet=b.key;cell.style.gridRow='4';cell.style.gridColumn=b.col;felt.appendChild(cell)});[{key:'low',label:'1-18',col:'2/5'},{key:'even',label:'EVEN',col:'5/7'},{key:'red',label:'RED',col:'7/9'},{key:'black',label:'BLK',col:'9/11'},{key:'odd',label:'ODD',col:'11/13'},{key:'high',label:'19-36',col:'13/15'}].forEach(b=>{const cell=document.createElement('div');cell.className='cell outside';if(b.key==='red')cell.style.color='#ff8a8a';if(b.key==='black')cell.style.color='#ccc';cell.textContent=b.label;cell.dataset.bet=b.key;cell.style.gridRow='5';cell.style.gridColumn=b.col;felt.appendChild(cell)});felt.addEventListener('click',e=>{const cell=e.target.closest('.cell');if(!cell||spinning)return;const key=cell.dataset.bet;const chip=CHIPS[chipIdx];if(balance<chip)return;bets[key]=(bets[key]||0)+chip;cell.classList.add('selected');updateUI();SFX.tick()})}function updateUI(){document.getElementById('bal').textContent=fmtBet(balance);const total=Object.values(bets).reduce((s,v)=>s+v,0);document.getElementById('tBet').textContent=fmtBet(total);document.getElementById('bV').textContent=fmtBet(CHIPS[chipIdx])}function hideWin(){const e=document.getElementById('wTxt');e.className='';e.textContent=''}function showMsg(text,type){const e=document.getElementById('wTxt');e.className='';setTimeout(()=>{e.textContent=text;e.className='active '+type},50)}function spawnCoins(n){const l=document.getElementById('fxL');for(let i=0;i<n;i++){const c=document.createElement('div');c.className='coin';c.style.left=(10+Math.random()*80)+'%';c.style.setProperty('--dur',(1.5+Math.random()*1.5)+'s');c.style.animationDelay=(Math.random()*.5)+'s';const sz=6+Math.random()*6;c.style.width=sz+'px';c.style.height=sz+'px';l.appendChild(c);setTimeout(()=>c.remove(),3500)}}document.getElementById('sBtn').addEventListener('click',startSpin);document.getElementById('bD').addEventListener('click',()=>{if(!spinning&&chipIdx>0){chipIdx--;updateUI()}});document.getElementById('bU').addEventListener('click',()=>{if(!spinning&&chipIdx<CHIPS.length-1){chipIdx++;updateUI()}});document.getElementById('clr').addEventListener('click',()=>{if(spinning)return;const total=Object.values(bets).reduce((s,v)=>s+v,0);balance+=total;bets={};document.querySelectorAll('.cell.selected').forEach(c=>c.classList.remove('selected'));updateUI()});document.addEventListener('keydown',e=>{if(e.code==='Space'&&!spinning){e.preventDefault();startSpin()}});document.addEventListener('touchstart',()=>{try{SFX.tick()}catch(e){}},{once:true});resize();buildFelt();drawWheel();updateUI();window.addEventListener('resize',()=>{resize();drawWheel()})})();</script></body></html>
