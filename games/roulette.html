<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sin Roulette | CumIN Dungeon</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root { --bg: #09070c; --surface: #121218; --pink: #FF007F; --purple: #8A2BE2; --green: #39FF14; --gold: #e2b966; --cream: #f5edf6; --muted: #95869f; --line: rgba(255,255,255,0.08); --red: #ff4d7f; --serif: 'Cormorant Garamond', Georgia, serif; --sans: 'Inter', system-ui, sans-serif; }
* { box-sizing: border-box; margin: 0; }
body { background: radial-gradient(circle at top, rgba(138,43,226,0.14), transparent 30%), var(--bg); color: var(--cream); font-family: var(--sans); min-height: 100vh; padding: 20px; overflow-x: hidden; }
button { font: inherit; color: inherit; cursor: pointer; }
body::before { content: ''; position: fixed; inset: 0; background: radial-gradient(circle at 50% 25%, rgba(255,0,127,0.08), transparent 28%), radial-gradient(circle at 50% 80%, rgba(138,43,226,0.08), transparent 30%); pointer-events: none; }
.back-btn { position: fixed; top: 16px; left: 16px; padding: 8px 14px; border: 1px solid var(--line); border-radius: 10px; background: rgba(9,7,12,0.85); font-size: 0.68rem; font-weight: 700; color: var(--cream); text-decoration: none; z-index: 50; }
.back-btn:hover { border-color: var(--pink); }
.game-container { max-width: 600px; margin: 0 auto; padding-top: 50px; }
.game-header { text-align: center; margin-bottom: 20px; }
.game-header h1 { font-family: var(--serif); font-size: 2rem; font-style: italic; color: var(--cream); }
.game-header p { font-size: 0.68rem; color: var(--muted); margin-top: 4px; }
.token-bar { display: flex; justify-content: space-between; align-items: center; padding: 10px 16px; background: rgba(0,0,0,0.3); border-radius: 12px; margin-bottom: 16px; border: 1px solid var(--line); }
.token-bar .balance { font-size: 1.1rem; font-weight: 800; color: var(--gold); text-shadow: 0 0 10px rgba(255,0,127,0.24), 0 0 20px rgba(138,43,226,0.24); }
.token-bar .label { font-size: 0.6rem; color: var(--muted); }
.wheel-area { position: relative; width: 280px; height: 280px; margin: 0 auto 20px; }
.wheel { width: 100%; height: 100%; border-radius: 50%; position: relative; transition: transform 4s cubic-bezier(0.17, 0.67, 0.12, 0.99); border: 3px solid rgba(255,0,127,0.28); box-shadow: 0 0 36px rgba(255,0,127,0.12), 0 0 42px rgba(138,43,226,0.12); }
.wheel-pointer { position: absolute; top: -12px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 10px solid transparent; border-right: 10px solid transparent; border-top: 20px solid var(--pink); z-index: 10; filter: drop-shadow(0 2px 8px rgba(255,0,127,0.35)); }
.wheel canvas { width: 100%; height: 100%; border-radius: 50%; }
.bet-section { background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.015)); border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin-bottom: 16px; }
.bet-section h3 { font-family: var(--serif); font-size: 0.95rem; font-style: italic; color: var(--cream); margin-bottom: 10px; }
.bet-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; margin-bottom: 12px; }
.bet-num { padding: 8px 4px; border: 1px solid var(--line); border-radius: 8px; background: rgba(255,255,255,0.02); font-size: 0.65rem; font-weight: 700; text-align: center; transition: all 0.15s; }
.bet-num:hover { border-color: var(--pink); background: rgba(255,0,127,0.08); }
.bet-num.selected { background: linear-gradient(135deg, rgba(138,43,226,0.18), rgba(255,0,127,0.16)); color: var(--cream); border-color: rgba(255,0,127,0.35); }
.bet-num.red-num { color: var(--red); }
.bet-num.black-num { color: var(--cream); }
.bet-num.green-num { color: var(--green); }
.outside-bets { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 10px; }
.outside-btn { padding: 10px 8px; border: 1px solid var(--line); border-radius: 10px; background: rgba(255,255,255,0.02); font-size: 0.62rem; font-weight: 700; text-align: center; transition: all 0.15s; }
.outside-btn:hover { border-color: var(--pink); }
.outside-btn.selected { background: linear-gradient(135deg, rgba(138,43,226,0.18), rgba(255,0,127,0.16)); color: var(--cream); border-color: rgba(255,0,127,0.35); }
.controls { display: flex; gap: 10px; align-items: center; justify-content: center; margin-bottom: 16px; }
.chip-select { display: flex; gap: 6px; align-items: center; }
.chip { width: 36px; height: 36px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.1); display: grid; place-items: center; font-size: 0.6rem; font-weight: 800; transition: all 0.15s; background: rgba(255,255,255,0.03); }
.chip:hover { border-color: var(--pink); }
.chip.active { border-color: var(--pink); background: rgba(255,0,127,0.14); box-shadow: 0 0 10px rgba(255,0,127,0.18); }
.spin-btn { padding: 14px 32px; border: none; border-radius: 12px; background: linear-gradient(135deg, var(--purple), var(--pink)); color: #fff; font-weight: 800; font-size: 0.85rem; box-shadow: 0 0 22px rgba(255,0,127,0.2); transition: transform 0.15s; }
.spin-btn:hover { transform: translateY(-2px); }
.spin-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
.result { text-align: center; min-height: 50px; display: flex; align-items: center; justify-content: center; }
.result-text { font-size: 0.9rem; font-weight: 700; padding: 10px 20px; border-radius: 10px; animation: fadeIn 0.3s; }
.result-win { background: rgba(57,255,20,0.08); color: var(--green); border: 1px solid rgba(57,255,20,0.25); }
.result-lose { background: rgba(255,0,127,0.08); color: var(--pink); border: 1px solid rgba(255,0,127,0.22); }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>
<a href="/hall.html" class="back-btn">← Back to Hall</a>
<div class="game-container">
  <div class="game-header">
    <h1>Sin Roulette</h1>
    <p>Place your bets. The wheel decides your fate.</p>
  </div>
  <div class="token-bar">
    <div><span class="label">Balance</span><span class="balance" id="balance">500</span></div>
    <div><span class="label">Total Bet</span><span class="balance" id="total-bet">0</span></div>
  </div>
  <div class="wheel-area">
    <div class="wheel-pointer"></div>
    <div class="wheel"><canvas id="wheel-canvas" width="280" height="280"></canvas></div>
  </div>
  <div class="bet-section">
    <h3>Place Your Bets</h3>
    <div class="bet-grid" id="bet-grid"></div>
    <div class="outside-bets">
      <button class="outside-btn" data-bet="red">Red</button>
      <button class="outside-btn" data-bet="black">Black</button>
      <button class="outside-btn" data-bet="green">0</button>
      <button class="outside-btn" data-bet="odd">Odd</button>
      <button class="outside-btn" data-bet="even">Even</button>
      <button class="outside-btn" data-bet="low">1-18</button>
      <button class="outside-btn" data-bet="high">19-36</button>
      <button class="outside-btn" data-bet="col1">1st 12</button>
      <button class="outside-btn" data-bet="col2">2nd 12</button>
    </div>
  </div>
  <div class="controls">
    <div class="chip-select">
      <button class="chip active" data-val="5">5</button>
      <button class="chip" data-val="10">10</button>
      <button class="chip" data-val="25">25</button>
      <button class="chip" data-val="50">50</button>
    </div>
    <button class="spin-btn" id="spin-btn" disabled>SPIN</button>
    <button class="outside-btn" id="clear-btn">Clear</button>
  </div>
  <div class="result" id="result"></div>
</div>
<script>
const NUMBERS = [0,32,15,19,4,21,2,25,17,34,6,27,13,36,11,30,8,23,10,5,24,16,33,1,20,14,31,9,22,18,29,7,28,12,35,3,26];
const RED_NUMS = [1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36];
const BLACK_NUMS = [2,4,6,8,10,11,13,15,17,20,22,24,26,28,29,31,33,35];
let balance = 500;
let chipValue = 5;
let bets = {};
let spinning = false;
const balanceEl = document.getElementById('balance');
const totalBetEl = document.getElementById('total-bet');
const resultEl = document.getElementById('result');
const spinBtn = document.getElementById('spin-btn');
const canvas = document.getElementById('wheel-canvas');
const ctx = canvas.getContext('2d');
const cx = 140, cy = 140, r = 130;
function drawWheel() {
  const sliceAngle = (2 * Math.PI) / NUMBERS.length;
  NUMBERS.forEach((num, i) => {
    const start = i * sliceAngle - Math.PI/2;
    const end = start + sliceAngle;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, r, start, end);
    ctx.closePath();
    if (num === 0) ctx.fillStyle = '#145d2f';
    else if (RED_NUMS.includes(num)) ctx.fillStyle = '#7a1738';
    else ctx.fillStyle = '#1a1a1a';
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.08)';
    ctx.lineWidth = 0.5;
    ctx.stroke();
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(start + sliceAngle/2);
    ctx.fillStyle = '#f5edf6';
    ctx.font = '10px Inter';
    ctx.textAlign = 'center';
    ctx.fillText(num, 0, -r + 18);
    ctx.restore();
  });
  ctx.beginPath();
  ctx.arc(cx, cy, 20, 0, 2*Math.PI);
  ctx.fillStyle = '#09070c';
  ctx.fill();
  ctx.strokeStyle = '#FF007F';
  ctx.lineWidth = 2;
  ctx.stroke();
}
drawWheel();
const betGrid = document.getElementById('bet-grid');
for (let i = 0; i <= 36; i++) {
  const btn = document.createElement('button');
  btn.className = 'bet-num';
  btn.textContent = i;
  btn.dataset.num = i;
  if (i === 0) btn.classList.add('green-num');
  else if (RED_NUMS.includes(i)) btn.classList.add('red-num');
  else btn.classList.add('black-num');
  btn.addEventListener('click', () => placeBet('num_' + i));
  betGrid.appendChild(btn);
}
document.querySelectorAll('.chip').forEach(c => { c.addEventListener('click', () => { document.querySelectorAll('.chip').forEach(x => x.classList.remove('active')); c.classList.add('active'); chipValue = parseInt(c.dataset.val); }); });
document.querySelectorAll('.outside-btn[data-bet]').forEach(btn => { btn.addEventListener('click', () => placeBet(btn.dataset.bet)); });
function placeBet(type) { if (spinning) return; if (balance < chipValue) return; balance -= chipValue; bets[type] = (bets[type] || 0) + chipValue; updateUI(); }
function updateUI() { const total = Object.values(bets).reduce((a,b) => a+b, 0); balanceEl.textContent = balance; totalBetEl.textContent = total; spinBtn.disabled = total === 0; document.querySelectorAll('.bet-num').forEach(btn => { btn.classList.toggle('selected', !!bets['num_' + btn.dataset.num]); }); document.querySelectorAll('.outside-btn[data-bet]').forEach(btn => { btn.classList.toggle('selected', !!bets[btn.dataset.bet]); }); }
document.getElementById('clear-btn').addEventListener('click', () => { if (spinning) return; const total = Object.values(bets).reduce((a,b) => a+b, 0); balance += total; bets = {}; updateUI(); resultEl.innerHTML = ''; });
spinBtn.addEventListener('click', spinWheel);
function spinWheel() { if (spinning) return; spinning = true; spinBtn.disabled = true; resultEl.innerHTML = ''; const resultIndex = Math.floor(Math.random() * NUMBERS.length); const winNumber = NUMBERS[resultIndex]; const sliceAngle = 360 / NUMBERS.length; const targetAngle = 360 - (resultIndex * sliceAngle) - sliceAngle/2; const totalRotation = 360 * 6 + targetAngle; const wheel = document.querySelector('.wheel'); wheel.style.transition = 'none'; wheel.style.transform = 'rotate(0deg)'; requestAnimationFrame(() => { requestAnimationFrame(() => { wheel.style.transition = 'transform 4s cubic-bezier(0.17, 0.67, 0.12, 0.99)'; wheel.style.transform = `rotate(${totalRotation}deg)`; }); }); setTimeout(() => { evaluateBets(winNumber); spinning = false; spinBtn.disabled = Object.values(bets).reduce((a,b)=>a+b,0) === 0; }, 4200); }
function evaluateBets(winNum) { let totalWin = 0; const isRed = RED_NUMS.includes(winNum); const isBlack = BLACK_NUMS.includes(winNum); Object.entries(bets).forEach(([type, amount]) => { let win = 0; if (type.startsWith('num_')) { if (parseInt(type.split('_')[1]) === winNum) win = amount * 36; } else if (type === 'red' && isRed) win = amount * 2; else if (type === 'black' && isBlack) win = amount * 2; else if (type === 'green' && winNum === 0) win = amount * 36; else if (type === 'odd' && winNum > 0 && winNum % 2 === 1) win = amount * 2; else if (type === 'even' && winNum > 0 && winNum % 2 === 0) win = amount * 2; else if (type === 'low' && winNum >= 1 && winNum <= 18) win = amount * 2; else if (type === 'high' && winNum >= 19 && winNum <= 36) win = amount * 2; else if (type === 'col1' && winNum >= 1 && winNum <= 12) win = amount * 3; else if (type === 'col2' && winNum >= 13 && winNum <= 24) win = amount * 3; totalWin += win; }); const color = winNum === 0 ? 'green' : (isRed ? 'red' : 'black'); if (totalWin > 0) { balance += totalWin; balanceEl.textContent = balance; resultEl.innerHTML = `<span class="result-text result-win">${color.toUpperCase()} ${winNum} : +${totalWin} tokens</span>`; } else { resultEl.innerHTML = `<span class="result-text result-lose">${color.toUpperCase()} ${winNum} : no match</span>`; } bets = {}; updateUI(); }
</script>
<script src="/public/js/admin-bar.js"></script>
</body>
</html>
