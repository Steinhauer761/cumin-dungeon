<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sin Roulette | CumIN Dungeon</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,700;1,400;1,700&family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root { --bg: #050304; --surface: #0c0908; --gold: #d59a4b; --gold-light: #f5c77e; --gold-dim: #8b6230; --cream: #f5eee4; --muted: #7a6e64; --red: #9f2330; --red-light: #e63946; --green: #4ade80; --line: rgba(190,137,77,0.18); --serif: 'Cormorant Garamond', Georgia, serif; --sans: 'Inter', system-ui, sans-serif; }
* { box-sizing: border-box; margin: 0; }
body { background: var(--bg); color: var(--cream); font-family: var(--sans); min-height: 100vh; padding: 20px; overflow-x: hidden; }
body::before { content: ''; position: fixed; inset: 0; background: radial-gradient(ellipse at 50% 20%, rgba(159,35,48,0.06), transparent 50%); pointer-events: none; }
button { font: inherit; color: inherit; cursor: pointer; }
.back-btn { position: fixed; top: 12px; left: 12px; padding: 7px 12px; border: 1px solid var(--line); border-radius: 8px; background: rgba(5,3,4,0.9); font-size: 0.65rem; font-weight: 700; color: var(--cream); text-decoration: none; z-index: 50; }
.back-btn:hover { border-color: var(--gold); }
.game-container { max-width: 560px; margin: 0 auto; padding-top: 44px; }
.game-header { text-align: center; margin-bottom: 16px; }
.game-header h1 { font-family: var(--serif); font-size: 2rem; font-style: italic; font-weight: 700; color: var(--gold-light); }
.game-header p { font-size: 0.6rem; color: var(--muted); margin-top: 4px; }
.token-bar { display: flex; justify-content: space-between; padding: 10px 14px; background: rgba(0,0,0,0.3); border-radius: 12px; margin-bottom: 16px; border: 1px solid var(--line); }
.token-bar .balance { font-size: 1.1rem; font-weight: 800; color: var(--gold-light); font-variant-numeric: tabular-nums; }
.token-bar .label { font-size: 0.5rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; }
.wheel-area { position: relative; width: 260px; height: 260px; margin: 0 auto 16px; }
.wheel { width: 100%; height: 100%; border-radius: 50%; position: relative; transition: transform 4s cubic-bezier(0.17, 0.67, 0.12, 0.99); border: 3px solid var(--gold-dim); box-shadow: 0 0 30px rgba(213,154,75,0.1); }
.wheel-pointer { position: absolute; top: -12px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 10px solid transparent; border-right: 10px solid transparent; border-top: 20px solid var(--red); z-index: 10; filter: drop-shadow(0 2px 8px rgba(159,35,48,0.4)); }
.wheel canvas { width: 100%; height: 100%; border-radius: 50%; }
.bet-section { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 14px; }
.bet-section h3 { font-family: var(--serif); font-size: 0.85rem; font-style: italic; color: var(--cream); margin-bottom: 8px; }
.bet-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 3px; margin-bottom: 10px; }
.bet-num { padding: 7px 3px; border: 1px solid var(--line); border-radius: 6px; background: rgba(255,255,255,0.02); font-size: 0.6rem; font-weight: 700; text-align: center; transition: all 0.12s; }
.bet-num:hover { border-color: var(--gold); background: rgba(213,154,75,0.06); }
.bet-num.selected { background: rgba(213,154,75,0.12); color: var(--gold-light); border-color: var(--gold); }
.bet-num.red-num { color: var(--red-light); }
.bet-num.black-num { color: var(--cream); }
.bet-num.green-num { color: var(--green); }
.outside-bets { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; margin-top: 8px; }
.outside-btn { padding: 8px 6px; border: 1px solid var(--line); border-radius: 8px; background: rgba(255,255,255,0.02); font-size: 0.58rem; font-weight: 700; text-align: center; transition: all 0.12s; }
.outside-btn:hover { border-color: var(--gold); }
.outside-btn.selected { background: rgba(213,154,75,0.12); color: var(--gold-light); border-color: var(--gold); }
.controls { display: flex; gap: 10px; align-items: center; justify-content: center; margin-bottom: 14px; }
.chip-select { display: flex; gap: 5px; }
.chip { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); display: grid; place-items: center; font-size: 0.55rem; font-weight: 800; background: rgba(255,255,255,0.02); transition: all 0.12s; }
.chip:hover { border-color: var(--gold); }
.chip.active { border-color: var(--gold); background: rgba(213,154,75,0.12); color: var(--gold-light); }
.spin-btn { padding: 12px 28px; border: none; border-radius: 10px; background: linear-gradient(180deg, var(--gold-light), var(--gold-dim)); color: var(--bg); font-family: var(--serif); font-weight: 700; font-size: 0.9rem; font-style: italic; box-shadow: 0 4px 16px rgba(213,154,75,0.2); transition: transform 0.12s; }
.spin-btn:hover { transform: translateY(-2px); }
.spin-btn:disabled { opacity: 0.3; cursor: not-allowed; transform: none; }
.result { text-align: center; min-height: 44px; display: flex; align-items: center; justify-content: center; }
.result-text { font-size: 0.85rem; font-weight: 700; padding: 8px 16px; border-radius: 10px; animation: fadeIn 0.3s; }
.result-win { background: rgba(74,222,128,0.08); color: var(--green); border: 1px solid rgba(74,222,128,0.2); }
.result-lose { background: rgba(159,35,48,0.08); color: var(--red-light); border: 1px solid rgba(159,35,48,0.2); }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.notice { text-align: center; font-size: 0.5rem; color: var(--muted); margin-top: 12px; opacity: 0.6; }
</style>
</head>
<body>
<a href="/casino.html" class="back-btn">◂ Casino</a>
<div class="game-container">
  <div class="game-header"><h1>Sin Roulette</h1><p>Place your bets. The wheel decides your fate.</p></div>
  <div class="token-bar">
    <div><span class="label">Balance</span><span class="balance" id="balance">0</span></div>
    <div><span class="label">Total Bet</span><span class="balance" id="total-bet">0</span></div>
  </div>
  <div class="wheel-area"><div class="wheel-pointer"></div><div class="wheel"><canvas id="wheel-canvas" width="260" height="260"></canvas></div></div>
  <div class="bet-section">
    <h3>Place Your Bets</h3>
    <div class="bet-grid" id="bet-grid"></div>
    <div class="outside-bets">
      <button class="outside-btn" data-bet="red">Red</button>
      <button class="outside-btn" data-bet="black">Black</button>
      <button class="outside-btn" data-bet="green">0</button>
      <button class="outside-btn" data-bet="odd">Odd</button>
      <button class="outside-btn" data-bet="even">Even</button>
      <button class="outside-btn" data-bet="low">1-18</button>
      <button class="outside-btn" data-bet="high">19-36</button>
      <button class="outside-btn" data-bet="col1">1st 12</button>
      <button class="outside-btn" data-bet="col2">2nd 12</button>
    </div>
  </div>
  <div class="controls">
    <div class="chip-select">
      <button class="chip" data-val="500">500</button>
      <button class="chip active" data-val="1000">1K</button>
      <button class="chip" data-val="2500">2.5K</button>
      <button class="chip" data-val="5000">5K</button>
    </div>
    <button class="spin-btn" id="spin-btn" disabled>Spin</button>
    <button class="outside-btn" id="clear-btn">Clear</button>
  </div>
  <div class="result" id="result"></div>
  <p class="notice">Entertainment tokens only. No cash value.</p>
</div>
<script src="/public/js/balance.js"></script>
<script>
var NUMBERS = [0,32,15,19,4,21,2,25,17,34,6,27,13,36,11,30,8,23,10,5,24,16,33,1,20,14,31,9,22,18,29,7,28,12,35,3,26];
var RED_NUMS = [1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36];
var BLACK_NUMS = [2,4,6,8,10,11,13,15,17,20,22,24,26,28,29,31,33,35];
var chipValue = 1000;
var bets = {};
var spinning = false;
var balanceEl = document.getElementById('balance');
var totalBetEl = document.getElementById('total-bet');
var resultEl = document.getElementById('result');
var spinBtn = document.getElementById('spin-btn');
var canvas = document.getElementById('wheel-canvas');
var ctx = canvas.getContext('2d');
var cx = 130, cy = 130, r = 120;

function refreshBalance() { balanceEl.textContent = TokenBank.fmt(TokenBank.get()); }
refreshBalance();

function drawWheel() {
  var sliceAngle = (2 * Math.PI) / NUMBERS.length;
  NUMBERS.forEach(function(num, i) {
    var start = i * sliceAngle - Math.PI/2;
    var end = start + sliceAngle;
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, r, start, end); ctx.closePath();
    if (num === 0) ctx.fillStyle = '#145d2f';
    else if (RED_NUMS.indexOf(num) >= 0) ctx.fillStyle = '#6a1428';
    else ctx.fillStyle = '#141010';
    ctx.fill(); ctx.strokeStyle = 'rgba(213,154,75,0.12)'; ctx.lineWidth = 0.5; ctx.stroke();
    ctx.save(); ctx.translate(cx, cy); ctx.rotate(start + sliceAngle/2);
    ctx.fillStyle = '#f5eee4'; ctx.font = '9px Inter'; ctx.textAlign = 'center'; ctx.fillText(num, 0, -r + 16);
    ctx.restore();
  });
  ctx.beginPath(); ctx.arc(cx, cy, 18, 0, 2*Math.PI); ctx.fillStyle = '#0c0908'; ctx.fill(); ctx.strokeStyle = '#d59a4b'; ctx.lineWidth = 2; ctx.stroke();
}
drawWheel();

var betGrid = document.getElementById('bet-grid');
for (var i = 0; i <= 36; i++) {
  var btn = document.createElement('button');
  btn.className = 'bet-num';
  btn.textContent = i;
  btn.dataset.num = i;
  if (i === 0) btn.classList.add('green-num');
  else if (RED_NUMS.indexOf(i) >= 0) btn.classList.add('red-num');
  else btn.classList.add('black-num');
  btn.addEventListener('click', (function(n) { return function() { placeBet('num_' + n); }; })(i));
  betGrid.appendChild(btn);
}

document.querySelectorAll('.chip').forEach(function(c) { c.addEventListener('click', function() { document.querySelectorAll('.chip').forEach(function(x) { x.classList.remove('active'); }); c.classList.add('active'); chipValue = parseInt(c.dataset.val); }); });
document.querySelectorAll('.outside-btn[data-bet]').forEach(function(btn) { btn.addEventListener('click', function() { placeBet(btn.dataset.bet); }); });

function placeBet(type) {
  if (spinning) return;
  if (TokenBank.get() < chipValue) return;
  TokenBank.subtract(chipValue);
  bets[type] = (bets[type] || 0) + chipValue;
  updateUI();
}

function updateUI() {
  var total = 0; for (var k in bets) total += bets[k];
  refreshBalance();
  totalBetEl.textContent = TokenBank.fmt(total);
  spinBtn.disabled = total === 0;
  document.querySelectorAll('.bet-num').forEach(function(btn) { btn.classList.toggle('selected', !!bets['num_' + btn.dataset.num]); });
  document.querySelectorAll('.outside-btn[data-bet]').forEach(function(btn) { btn.classList.toggle('selected', !!bets[btn.dataset.bet]); });
}

document.getElementById('clear-btn').addEventListener('click', function() {
  if (spinning) return;
  var total = 0; for (var k in bets) total += bets[k];
  TokenBank.add(total);
  bets = {}; updateUI(); resultEl.innerHTML = '';
});

spinBtn.addEventListener('click', spinWheel);

function spinWheel() {
  if (spinning) return; spinning = true; spinBtn.disabled = true; resultEl.innerHTML = '';
  var resultIndex = Math.floor(Math.random() * NUMBERS.length);
  var winNumber = NUMBERS[resultIndex];
  var sliceAngle = 360 / NUMBERS.length;
  var targetAngle = 360 - (resultIndex * sliceAngle) - sliceAngle/2;
  var totalRotation = 360 * 6 + targetAngle;
  var wheel = document.querySelector('.wheel');
  wheel.style.transition = 'none'; wheel.style.transform = 'rotate(0deg)';
  requestAnimationFrame(function() { requestAnimationFrame(function() {
    wheel.style.transition = 'transform 4s cubic-bezier(0.17, 0.67, 0.12, 0.99)';
    wheel.style.transform = 'rotate(' + totalRotation + 'deg)';
  }); });
  setTimeout(function() { evaluateBets(winNumber); spinning = false; }, 4200);
}

function evaluateBets(winNum) {
  var totalWin = 0;
  var isRed = RED_NUMS.indexOf(winNum) >= 0;
  var isBlack = BLACK_NUMS.indexOf(winNum) >= 0;
  for (var type in bets) {
    var amount = bets[type]; var win = 0;
    if (type.indexOf('num_') === 0) { if (parseInt(type.split('_')[1]) === winNum) win = amount * 36; }
    else if (type === 'red' && isRed) win = amount * 2;
    else if (type === 'black' && isBlack) win = amount * 2;
    else if (type === 'green' && winNum === 0) win = amount * 36;
    else if (type === 'odd' && winNum > 0 && winNum % 2 === 1) win = amount * 2;
    else if (type === 'even' && winNum > 0 && winNum % 2 === 0) win = amount * 2;
    else if (type === 'low' && winNum >= 1 && winNum <= 18) win = amount * 2;
    else if (type === 'high' && winNum >= 19 && winNum <= 36) win = amount * 2;
    else if (type === 'col1' && winNum >= 1 && winNum <= 12) win = amount * 3;
    else if (type === 'col2' && winNum >= 13 && winNum <= 24) win = amount * 3;
    totalWin += win;
  }
  var color = winNum === 0 ? 'green' : (isRed ? 'red' : 'black');
  if (totalWin > 0) { TokenBank.add(totalWin); refreshBalance(); resultEl.innerHTML = '<span class="result-text result-win">' + color.toUpperCase() + ' ' + winNum + ' : +' + TokenBank.fmt(totalWin) + '</span>'; }
  else { resultEl.innerHTML = '<span class="result-text result-lose">' + color.toUpperCase() + ' ' + winNum + ' : no match</span>'; }
  bets = {}; updateUI();
}
</script>
<script src="/public/js/admin-bar.js"></script>
</body>
</html>
