<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kink Wheel | CumIN Dungeon</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root { --bg: #09070c; --surface: #121218; --pink: #FF007F; --purple: #8A2BE2; --green: #39FF14; --gold: #e2b966; --cream: #f5edf6; --muted: #95869f; --line: rgba(255,255,255,0.08); --red: #ff4d7f; --serif: 'Cormorant Garamond', Georgia, serif; --sans: 'Inter', system-ui, sans-serif; }
* { box-sizing: border-box; margin: 0; }
body { background: radial-gradient(circle at top, rgba(138,43,226,0.14), transparent 30%), var(--bg); color: var(--cream); font-family: var(--sans); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
button { font: inherit; color: inherit; cursor: pointer; }
body::before { content: ''; position: fixed; inset: 0; background: radial-gradient(circle at 50% 25%, rgba(255,0,127,0.08), transparent 28%), radial-gradient(circle at 50% 80%, rgba(138,43,226,0.08), transparent 30%); pointer-events: none; }
.back-btn { position: fixed; top: 16px; left: 16px; padding: 8px 14px; border: 1px solid var(--line); border-radius: 10px; background: rgba(9,7,12,0.85); font-size: 0.68rem; font-weight: 700; color: var(--cream); text-decoration: none; z-index: 50; }
.back-btn:hover { border-color: var(--pink); }
.game-box { width: min(460px, 100%); background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.015)); border: 1px solid rgba(255,0,127,0.22); border-radius: 24px; padding: 24px; box-shadow: 0 0 50px rgba(255,0,127,0.08), 0 0 80px rgba(138,43,226,0.08), inset 0 0 30px rgba(0,0,0,0.5); text-align: center; }
.game-header h1 { font-family: var(--serif); font-size: 1.9rem; font-style: italic; color: var(--cream); }
.game-header p { font-size: 0.65rem; color: var(--muted); margin-top: 4px; margin-bottom: 16px; }
.token-bar { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; background: rgba(0,0,0,0.32); border-radius: 12px; margin-bottom: 16px; border: 1px solid var(--line); }
.token-bar .balance { font-size: 1.1rem; font-weight: 800; color: var(--gold); text-shadow: 0 0 10px rgba(255,0,127,0.24), 0 0 20px rgba(138,43,226,0.24); }
.token-bar .label { font-size: 0.6rem; color: var(--muted); }
.wheel-wrapper { position: relative; width: 300px; height: 300px; margin: 0 auto 20px; }
.wheel-pointer { position: absolute; top: -14px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 12px solid transparent; border-right: 12px solid transparent; border-top: 24px solid var(--pink); z-index: 10; filter: drop-shadow(0 2px 10px rgba(255,0,127,0.32)); }
.wheel-canvas { width: 100%; height: 100%; border-radius: 50%; border: 3px solid rgba(255,0,127,0.28); box-shadow: 0 0 36px rgba(255,0,127,0.12), 0 0 42px rgba(138,43,226,0.12); transition: transform 5s cubic-bezier(0.17, 0.67, 0.12, 0.99); }
.win-display { min-height: 60px; margin: 16px 0; display: flex; align-items: center; justify-content: center; }
.win-label { font-family: var(--serif); font-size: 1.5rem; font-style: italic; color: var(--cream); animation: fadeIn 0.4s; }
.win-payout { font-size: 1rem; font-weight: 800; margin-top: 4px; animation: fadeIn 0.4s; }
.win-payout.positive { color: var(--green); }
.win-payout.negative { color: var(--pink); }
.bet-row { display: flex; gap: 8px; justify-content: center; align-items: center; margin-bottom: 16px; }
.amt-btn { width: 32px; height: 32px; border-radius: 50%; border: 1px solid rgba(255,0,127,0.3); background: rgba(255,0,127,0.08); font-weight: 800; font-size: 1rem; display: grid; place-items: center; color: var(--pink); }
.amt-display { font-size: 1.2rem; font-weight: 800; min-width: 40px; text-align: center; color: var(--gold); text-shadow: 0 0 10px rgba(255,0,127,0.24), 0 0 20px rgba(138,43,226,0.24); }
.spin-btn { display: block; width: 100%; padding: 14px; border: none; border-radius: 12px; background: linear-gradient(135deg, var(--purple), var(--pink)); color: #fff; font-weight: 800; font-size: 0.9rem; box-shadow: 0 0 22px rgba(255,0,127,0.2); transition: transform 0.15s; }
.spin-btn:hover { transform: translateY(-2px); }
.spin-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>
<a href="/hall.html" class="back-btn">← Back to Hall</a>
<div class="game-box">
  <div class="game-header">
    <h1>Kink Wheel</h1>
    <p>Spin the wheel. Land on gold and multiply your tokens.</p>
  </div>
  <div class="token-bar">
    <div><span class="label">Balance</span><span class="balance" id="balance">500</span></div>
    <div><span class="label">Bet</span><span class="balance" id="bet-display">10</span></div>
  </div>
  <div class="wheel-wrapper">
    <div class="wheel-pointer"></div>
    <canvas class="wheel-canvas" id="wheel" width="300" height="300"></canvas>
  </div>
  <div class="win-display" id="win-display"></div>
  <div class="bet-row">
    <button class="amt-btn" id="bet-down">−</button>
    <span class="amt-display" id="bet-label">10</span>
    <button class="amt-btn" id="bet-up">+</button>
  </div>
  <button class="spin-btn" id="spin-btn">SPIN THE WHEEL</button>
</div>
<script>
const SEGMENTS = [
  { label: '2x', multiplier: 2, color: '#7a1738' },
  { label: 'Lose', multiplier: 0, color: '#1a1a1a' },
  { label: '3x', multiplier: 3, color: '#124b2a' },
  { label: '1.5x', multiplier: 1.5, color: '#2a1439' },
  { label: 'Lose', multiplier: 0, color: '#1a1a1a' },
  { label: '5x', multiplier: 5, color: '#623d10' },
  { label: '1.5x', multiplier: 1.5, color: '#2a1439' },
  { label: 'Lose', multiplier: 0, color: '#1a1a1a' },
  { label: '2x', multiplier: 2, color: '#7a1738' },
  { label: '10x', multiplier: 10, color: '#c09546' },
  { label: 'Lose', multiplier: 0, color: '#1a1a1a' },
  { label: '1.5x', multiplier: 1.5, color: '#2a1439' },
];
let balance = 500, bet = 10, spinning = false, currentRotation = 0;
const BETS = [5,10,15,20,25,50];
let betIdx = 1;
const canvas = document.getElementById('wheel');
const ctx = canvas.getContext('2d');
const cx = 150, cy = 150, r = 140;
function drawWheel() {
  const sliceAngle = (2 * Math.PI) / SEGMENTS.length;
  SEGMENTS.forEach((seg, i) => {
    const start = i * sliceAngle - Math.PI/2;
    const end = start + sliceAngle;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, r, start, end);
    ctx.closePath();
    ctx.fillStyle = seg.color;
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.08)';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(start + sliceAngle/2);
    ctx.fillStyle = '#f5edf6';
    ctx.font = 'bold 13px Inter';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(seg.label, 0, -r + 30);
    ctx.restore();
  });
  ctx.beginPath();
  ctx.arc(cx, cy, 24, 0, 2*Math.PI);
  ctx.fillStyle = '#09070c';
  ctx.fill();
  ctx.strokeStyle = '#FF007F';
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.fillStyle = '#FF007F';
  ctx.font = 'bold 10px Inter';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('SPIN', cx, cy);
}
drawWheel();
document.getElementById('bet-up').addEventListener('click', () => { if (betIdx < BETS.length-1) betIdx++; bet = BETS[betIdx]; document.getElementById('bet-display').textContent = bet; document.getElementById('bet-label').textContent = bet; });
document.getElementById('bet-down').addEventListener('click', () => { if (betIdx > 0) betIdx--; bet = BETS[betIdx]; document.getElementById('bet-display').textContent = bet; document.getElementById('bet-label').textContent = bet; });
document.getElementById('spin-btn').addEventListener('click', spinWheel);
function spinWheel() { if (spinning || balance < bet) return; spinning = true; document.getElementById('spin-btn').disabled = true; document.getElementById('win-display').innerHTML = ''; balance -= bet; document.getElementById('balance').textContent = balance; const resultIdx = Math.floor(Math.random() * SEGMENTS.length); const seg = SEGMENTS[resultIdx]; const sliceAngle = 360 / SEGMENTS.length; const targetAngle = 360 - (resultIdx * sliceAngle) - sliceAngle/2; const totalRotation = currentRotation + 360 * 5 + targetAngle; currentRotation = totalRotation; canvas.style.transition = 'none'; canvas.offsetHeight; canvas.style.transition = 'transform 5s cubic-bezier(0.17, 0.67, 0.12, 0.99)'; canvas.style.transform = `rotate(${totalRotation}deg)`; setTimeout(() => { const display = document.getElementById('win-display'); if (seg.multiplier > 0) { const payout = Math.floor(bet * seg.multiplier); balance += payout; document.getElementById('balance').textContent = balance; display.innerHTML = `<div><div class="win-label">${seg.label}</div><div class="win-payout positive">+${payout} tokens!</div></div>`; } else { display.innerHTML = `<div><div class="win-label">${seg.label}</div><div class="win-payout negative">-${bet} tokens</div></div>`; } spinning = false; document.getElementById('spin-btn').disabled = false; }, 5200); }
</script>
<script src="/public/js/admin-bar.js"></script>
</body>
</html>
