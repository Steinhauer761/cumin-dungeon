<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>After Dark Wheel | CumIN Dungeon</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,700;1,400;1,700&family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root { --bg: #050304; --surface: #0c0908; --surface-2: #141010; --gold: #d59a4b; --gold-light: #f5c77e; --gold-dim: #8b6230; --cream: #f5eee4; --muted: #7a6e64; --red: #9f2330; --green: #4ade80; --line: rgba(190,137,77,0.18); --serif: 'Cormorant Garamond', Georgia, serif; --sans: 'Inter', system-ui, sans-serif; }
* { box-sizing: border-box; margin: 0; }
body { background: var(--bg); color: var(--cream); font-family: var(--sans); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; position: relative; overflow: hidden; }
body::before { content: ''; position: fixed; inset: 0; background: radial-gradient(ellipse at 50% 20%, rgba(159,35,48,0.08), transparent 50%), radial-gradient(ellipse at 50% 80%, rgba(213,154,75,0.06), transparent 40%); pointer-events: none; }
button { font: inherit; color: inherit; cursor: pointer; }
.back-btn { position: fixed; top: 12px; left: 12px; padding: 7px 12px; border: 1px solid var(--line); border-radius: 8px; background: rgba(5,3,4,0.9); font-size: 0.65rem; font-weight: 700; color: var(--cream); text-decoration: none; z-index: 50; }
.back-btn:hover { border-color: var(--gold); }
.game-box { width: min(460px, 100%); background: linear-gradient(180deg, var(--surface), var(--bg)); border: 1px solid var(--line); border-radius: 24px; padding: 24px; box-shadow: 0 0 60px rgba(159,35,48,0.06), inset 0 0 40px rgba(0,0,0,0.5); text-align: center; }
.game-header h1 { font-family: var(--serif); font-size: 2rem; font-style: italic; font-weight: 700; color: var(--gold-light); }
.game-header p { font-size: 0.65rem; color: var(--muted); margin-top: 4px; margin-bottom: 16px; }
.info-bar { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; background: rgba(0,0,0,0.3); border-radius: 12px; margin-bottom: 16px; border: 1px solid var(--line); }
.info-bar .balance { font-size: 1.1rem; font-weight: 800; color: var(--gold-light); font-variant-numeric: tabular-nums; }
.info-bar .label { font-size: 0.5rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.12em; }
.wheel-wrapper { position: relative; width: 300px; height: 300px; margin: 0 auto 20px; }
.wheel-pointer { position: absolute; top: -14px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 12px solid transparent; border-right: 12px solid transparent; border-top: 24px solid var(--red); z-index: 10; filter: drop-shadow(0 2px 12px rgba(159,35,48,0.5)); }
.wheel-canvas { width: 100%; height: 100%; border-radius: 50%; border: 3px solid var(--gold-dim); box-shadow: 0 0 40px rgba(213,154,75,0.1), inset 0 0 20px rgba(0,0,0,0.3); transition: transform 5s cubic-bezier(0.17, 0.67, 0.12, 0.99); }
.win-display { min-height: 70px; margin: 16px 0; display: flex; align-items: center; justify-content: center; flex-direction: column; }
.win-label { font-family: var(--serif); font-size: 1.4rem; font-style: italic; color: var(--gold-light); animation: fadeIn 0.4s; }
.win-payout { font-size: 0.9rem; font-weight: 800; margin-top: 4px; animation: fadeIn 0.4s; }
.win-payout.positive { color: var(--green); }
.win-payout.negative { color: var(--red); }
.bet-row { display: flex; gap: 8px; justify-content: center; align-items: center; margin-bottom: 16px; }
.amt-btn { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: rgba(213,154,75,0.06); font-weight: 800; font-size: 1rem; display: grid; place-items: center; color: var(--gold); transition: all 0.15s; }
.amt-btn:active { transform: scale(0.9); background: rgba(213,154,75,0.15); }
.amt-display { font-size: 1.2rem; font-weight: 800; min-width: 50px; text-align: center; color: var(--gold-light); }
.spin-btn { display: block; width: 100%; padding: 14px; border: none; border-radius: 12px; background: linear-gradient(180deg, var(--gold-light), var(--gold-dim)); color: var(--bg); font-family: var(--serif); font-weight: 700; font-size: 1rem; font-style: italic; letter-spacing: 0.02em; box-shadow: 0 4px 20px rgba(213,154,75,0.2); transition: transform 0.15s, opacity 0.15s; }
.spin-btn:hover { transform: translateY(-2px); }
.spin-btn:disabled { opacity: 0.3; cursor: not-allowed; transform: none; }
.notice { font-size: 0.5rem; color: var(--muted); margin-top: 12px; opacity: 0.6; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.fx-layer { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 100; }
.coin { position: absolute; top: -20px; width: 12px; height: 12px; border-radius: 50%; background: radial-gradient(circle at 30% 30%, var(--gold-light), var(--gold)); animation: coinFall var(--dur) ease-in forwards; opacity: 0.9; }
@keyframes coinFall { 0% { transform: translateY(0) rotate(0deg); opacity: 1; } 100% { transform: translateY(100vh) rotate(720deg); opacity: 0; } }
</style>
</head>
<body>
<a href="/casino.html" class="back-btn">◂ Casino</a>
<div class="game-box">
  <div class="game-header">
    <h1>After Dark Wheel</h1>
    <p>Spin the wheel. Land on fortune or fate.</p>
  </div>
  <div class="info-bar">
    <div><span class="label">Balance</span><span class="balance" id="balance">0</span></div>
    <div><span class="label">Bet</span><span class="balance" id="bet-display">0</span></div>
  </div>
  <div class="wheel-wrapper">
    <div class="wheel-pointer"></div>
    <canvas class="wheel-canvas" id="wheel" width="300" height="300"></canvas>
  </div>
  <div class="win-display" id="win-display"></div>
  <div class="bet-row">
    <button class="amt-btn" id="bet-down">−</button>
    <span class="amt-display" id="bet-label">1K</span>
    <button class="amt-btn" id="bet-up">+</button>
  </div>
  <button class="spin-btn" id="spin-btn">Spin the Wheel</button>
  <p class="notice">Entertainment tokens only. No cash value.</p>
</div>
<div class="fx-layer" id="fxL"></div>
<script src="/public/js/balance.js"></script>
<script>
var SEGMENTS = [
  { label: 'Velvet Kiss', sub: '2x', multiplier: 2, color: '#3d0a12' },
  { label: 'Shadow\'s Edge', sub: 'Lose', multiplier: 0, color: '#0c0908' },
  { label: 'Chains & Roses', sub: '5x', multiplier: 5, color: '#1a2a14' },
  { label: 'Silk Whisper', sub: '1.5x', multiplier: 1.5, color: '#1a0a20' },
  { label: 'Dungeon Toll', sub: 'Lose', multiplier: 0, color: '#0c0908' },
  { label: 'Dragon\'s Breath', sub: '10x', multiplier: 10, color: '#3d2a08' },
  { label: 'Crimson Tease', sub: '3x', multiplier: 3, color: '#2a0a14' },
  { label: 'Dark Passage', sub: 'Lose', multiplier: 0, color: '#0c0908' },
  { label: 'Golden Shackle', sub: '2x', multiplier: 2, color: '#2a1a08' },
  { label: 'Sinful 50x', sub: '50x', multiplier: 50, color: '#4a1a08' },
  { label: 'Forbidden Peek', sub: '1.5x', multiplier: 1.5, color: '#1a0a20' },
  { label: 'Throne\'s Mercy', sub: 'Lose', multiplier: 0, color: '#0c0908' },
];

var CONFIG = { BETS: [500, 1000, 2500, 5000, 10000, 25000, 50000, 100000] };
var betIdx = 1, bet = CONFIG.BETS[1], spinning = false, currentRotation = 0;

function fmtBet(n) { return n >= 1e6 ? (n/1e6).toFixed(1)+'M' : n >= 1e3 ? (n/1e3)+'K' : ''+n; }
function refreshUI() {
  document.getElementById('balance').textContent = TokenBank.fmt(TokenBank.get());
  document.getElementById('bet-display').textContent = fmtBet(bet);
  document.getElementById('bet-label').textContent = fmtBet(bet);
}

var canvas = document.getElementById('wheel');
var ctx = canvas.getContext('2d');
var cx = 150, cy = 150, r = 140;

function drawWheel() {
  var sliceAngle = (2 * Math.PI) / SEGMENTS.length;
  SEGMENTS.forEach(function(seg, i) {
    var start = i * sliceAngle - Math.PI/2;
    var end = start + sliceAngle;
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, r, start, end); ctx.closePath();
    ctx.fillStyle = seg.color; ctx.fill();
    ctx.strokeStyle = 'rgba(213,154,75,0.15)'; ctx.lineWidth = 1; ctx.stroke();
    ctx.save(); ctx.translate(cx, cy); ctx.rotate(start + sliceAngle/2);
    ctx.fillStyle = seg.multiplier > 0 ? '#f5c77e' : '#7a6e64';
    ctx.font = 'bold 9px Inter'; ctx.textAlign = 'center'; ctx.fillText(seg.label, 0, -r + 28);
    ctx.fillStyle = seg.multiplier >= 10 ? '#4ade80' : seg.multiplier > 0 ? '#f5eee4' : '#9f2330';
    ctx.font = 'bold 11px Inter'; ctx.fillText(seg.sub, 0, -r + 42);
    ctx.restore();
  });
  ctx.beginPath(); ctx.arc(cx, cy, 22, 0, 2*Math.PI); ctx.fillStyle = '#0c0908'; ctx.fill();
  ctx.strokeStyle = '#d59a4b'; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = '#f5c77e'; ctx.font = 'italic bold 9px Georgia'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('SPIN', cx, cy);
}
drawWheel();

document.getElementById('bet-up').addEventListener('click', function() { if (spinning) return; if (betIdx < CONFIG.BETS.length - 1) betIdx++; bet = CONFIG.BETS[betIdx]; refreshUI(); });
document.getElementById('bet-down').addEventListener('click', function() { if (spinning) return; if (betIdx > 0) betIdx--; bet = CONFIG.BETS[betIdx]; refreshUI(); });

function spawnCoins(n) {
  var l = document.getElementById('fxL');
  for (var i = 0; i < n; i++) {
    var c = document.createElement('div'); c.className = 'coin';
    c.style.left = (10 + Math.random() * 80) + '%';
    c.style.setProperty('--dur', (1.5 + Math.random() * 1.5) + 's');
    c.style.animationDelay = (Math.random() * 0.5) + 's';
    l.appendChild(c); setTimeout((function(el) { return function() { el.remove(); }; })(c), 3500);
  }
}

document.getElementById('spin-btn').addEventListener('click', function() {
  if (spinning || TokenBank.get() < bet) return;
  spinning = true; document.getElementById('spin-btn').disabled = true;
  document.getElementById('win-display').innerHTML = '';
  TokenBank.subtract(bet); refreshUI();

  var weights = [20, 18, 6, 16, 14, 2, 10, 14, 12, 1, 10, 12];
  var totalW = weights.reduce(function(a, b) { return a + b; }, 0);
  var roll = Math.random() * totalW; var resultIdx = 0;
  for (var i = 0; i < weights.length; i++) { roll -= weights[i]; if (roll <= 0) { resultIdx = i; break; } }

  var seg = SEGMENTS[resultIdx];
  var sliceAngle = 360 / SEGMENTS.length;
  var targetAngle = 360 - (resultIdx * sliceAngle) - sliceAngle / 2;
  var totalRotation = currentRotation + 360 * 6 + targetAngle;
  currentRotation = totalRotation;

  canvas.style.transition = 'none'; canvas.offsetHeight;
  canvas.style.transition = 'transform 5s cubic-bezier(0.17, 0.67, 0.12, 0.99)';
  canvas.style.transform = 'rotate(' + totalRotation + 'deg)';

  setTimeout(function() {
    var display = document.getElementById('win-display');
    if (seg.multiplier > 0) {
      var payout = Math.floor(bet * seg.multiplier);
      TokenBank.add(payout); refreshUI();
      display.innerHTML = '<div class="win-label">' + seg.label + '</div><div class="win-payout positive">+' + TokenBank.fmt(payout) + ' tokens</div>';
      spawnCoins(Math.min(Math.floor(seg.multiplier * 4), 40));
    } else {
      display.innerHTML = '<div class="win-label">' + seg.label + '</div><div class="win-payout negative">Lost ' + fmtBet(bet) + ' tokens</div>';
    }
    spinning = false; document.getElementById('spin-btn').disabled = false;
  }, 5300);
});

refreshUI();
</script>
<script src="/public/js/admin-bar.js"></script>
</body>
</html>
