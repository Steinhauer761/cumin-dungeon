<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kink Wheel | CumIN Dungeon</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root { --bg: #0a0604; --surface: #141010; --gold: #d59a4b; --gold-light: #f5c77e; --red: #e63946; --green: #4ade80; --cream: #f5eee4; --muted: #a6998b; --line: rgba(190,137,77,0.18); --serif: 'Cormorant Garamond', Georgia, serif; --sans: 'Inter', system-ui, sans-serif; }
* { box-sizing: border-box; margin: 0; }
body { background: var(--bg); color: var(--cream); font-family: var(--sans); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
button { font: inherit; color: inherit; cursor: pointer; }
body::before { content: ''; position: fixed; inset: 0; background: radial-gradient(ellipse at 50% 30%, rgba(213,154,75,0.06), transparent 50%), radial-gradient(ellipse at 50% 80%, rgba(141,29,36,0.08), transparent 40%); pointer-events: none; }
.back-btn { position: fixed; top: 16px; left: 16px; padding: 8px 14px; border: 1px solid var(--line); border-radius: 8px; background: rgba(10,6,4,0.8); font-size: 0.68rem; font-weight: 700; color: var(--cream); text-decoration: none; z-index: 50; }
.back-btn:hover { border-color: var(--gold); }

.game-box { width: min(460px, 100%); background: var(--surface); border: 2px solid var(--gold); border-radius: 24px; padding: 24px; box-shadow: 0 0 60px rgba(213,154,75,0.1), inset 0 0 30px rgba(0,0,0,0.5); text-align: center; }
.game-header h1 { font-family: var(--serif); font-size: 1.8rem; font-style: italic; color: var(--gold-light); }
.game-header p { font-size: 0.65rem; color: var(--muted); margin-top: 4px; margin-bottom: 16px; }
.token-bar { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; background: rgba(0,0,0,0.3); border-radius: 10px; margin-bottom: 16px; border: 1px solid var(--line); }
.token-bar .balance { font-size: 1.1rem; font-weight: 800; color: var(--gold-light); }
.token-bar .label { font-size: 0.6rem; color: var(--muted); }

/* Wheel */
.wheel-wrapper { position: relative; width: 300px; height: 300px; margin: 0 auto 20px; }
.wheel-pointer { position: absolute; top: -14px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 12px solid transparent; border-right: 12px solid transparent; border-top: 24px solid var(--gold); z-index: 10; filter: drop-shadow(0 3px 6px rgba(0,0,0,0.5)); }
.wheel-canvas { width: 100%; height: 100%; border-radius: 50%; border: 4px solid var(--gold); box-shadow: 0 0 40px rgba(213,154,75,0.2); transition: transform 5s cubic-bezier(0.17, 0.67, 0.12, 0.99); }

/* Result */
.win-display { min-height: 60px; margin: 16px 0; display: flex; align-items: center; justify-content: center; }
.win-label { font-family: var(--serif); font-size: 1.4rem; font-style: italic; color: var(--gold-light); animation: fadeIn 0.4s; }
.win-payout { font-size: 1rem; font-weight: 800; margin-top: 4px; animation: fadeIn 0.4s; }
.win-payout.positive { color: var(--green); }
.win-payout.negative { color: var(--red); }

/* Bet controls */
.bet-row { display: flex; gap: 8px; justify-content: center; align-items: center; margin-bottom: 16px; }
.amt-btn { width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--gold); background: rgba(213,154,75,0.1); font-weight: 800; font-size: 1rem; display: grid; place-items: center; color: var(--gold); }
.amt-btn:hover { background: rgba(213,154,75,0.2); }
.amt-display { font-size: 1.2rem; font-weight: 800; min-width: 40px; text-align: center; }

.spin-btn { display: block; width: 100%; padding: 14px; border: none; border-radius: 10px; background: linear-gradient(180deg, var(--gold-light), var(--gold)); color: var(--bg); font-weight: 800; font-size: 0.9rem; box-shadow: 0 4px 20px rgba(213,154,75,0.3); transition: transform 0.15s; }
.spin-btn:hover { transform: translateY(-2px); }
.spin-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>
<a href="/hall.html" class="back-btn">← Back to Hall</a>
<div class="game-box">
  <div class="game-header">
    <h1>Kink Wheel</h1>
    <p>Spin the wheel. Land on gold and multiply your tokens.</p>
  </div>
  <div class="token-bar">
    <div><span class="label">Balance</span><span class="balance" id="balance">500</span></div>
    <div><span class="label">Bet</span><span class="balance" id="bet-display">10</span></div>
  </div>

  <div class="wheel-wrapper">
    <div class="wheel-pointer"></div>
    <canvas class="wheel-canvas" id="wheel" width="300" height="300"></canvas>
  </div>

  <div class="win-display" id="win-display"></div>

  <div class="bet-row">
    <button class="amt-btn" id="bet-down">−</button>
    <span class="amt-display" id="bet-label">10</span>
    <button class="amt-btn" id="bet-up">+</button>
  </div>

  <button class="spin-btn" id="spin-btn">SPIN THE WHEEL</button>
</div>

<script>
const SEGMENTS = [
  { label: '2x', multiplier: 2, color: '#8d1d24' },
  { label: 'Lose', multiplier: 0, color: '#1a1a1a' },
  { label: '3x', multiplier: 3, color: '#1a5a2a' },
  { label: '1.5x', multiplier: 1.5, color: '#2a1a3a' },
  { label: 'Lose', multiplier: 0, color: '#1a1a1a' },
  { label: '5x', multiplier: 5, color: '#4a3010' },
  { label: '1.5x', multiplier: 1.5, color: '#2a1a3a' },
  { label: 'Lose', multiplier: 0, color: '#1a1a1a' },
  { label: '2x', multiplier: 2, color: '#8d1d24' },
  { label: '10x', multiplier: 10, color: '#d59a4b' },
  { label: 'Lose', multiplier: 0, color: '#1a1a1a' },
  { label: '1.5x', multiplier: 1.5, color: '#2a1a3a' },
];

let balance = 500, bet = 10, spinning = false, currentRotation = 0;
const BETS = [5,10,15,20,25,50];
let betIdx = 1;

const canvas = document.getElementById('wheel');
const ctx = canvas.getContext('2d');
const cx = 150, cy = 150, r = 140;

function drawWheel() {
  const sliceAngle = (2 * Math.PI) / SEGMENTS.length;
  SEGMENTS.forEach((seg, i) => {
    const start = i * sliceAngle - Math.PI/2;
    const end = start + sliceAngle;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, r, start, end);
    ctx.closePath();
    ctx.fillStyle = seg.color;
    ctx.fill();
    ctx.strokeStyle = 'rgba(213,154,75,0.4)';
    ctx.lineWidth = 1;
    ctx.stroke();
    // Label
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(start + sliceAngle/2);
    ctx.fillStyle = '#f5eee4';
    ctx.font = 'bold 13px Inter';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(seg.label, 0, -r + 30);
    ctx.restore();
  });
  // Center
  ctx.beginPath();
  ctx.arc(cx, cy, 24, 0, 2*Math.PI);
  ctx.fillStyle = '#0a0604';
  ctx.fill();
  ctx.strokeStyle = '#d59a4b';
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.fillStyle = '#d59a4b';
  ctx.font = 'bold 10px Inter';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('SPIN', cx, cy);
}
drawWheel();

// Bet controls
document.getElementById('bet-up').addEventListener('click', () => {
  if (betIdx < BETS.length-1) betIdx++;
  bet = BETS[betIdx];
  document.getElementById('bet-display').textContent = bet;
  document.getElementById('bet-label').textContent = bet;
});
document.getElementById('bet-down').addEventListener('click', () => {
  if (betIdx > 0) betIdx--;
  bet = BETS[betIdx];
  document.getElementById('bet-display').textContent = bet;
  document.getElementById('bet-label').textContent = bet;
});

// Spin
document.getElementById('spin-btn').addEventListener('click', spinWheel);

function spinWheel() {
  if (spinning || balance < bet) return;
  spinning = true;
  document.getElementById('spin-btn').disabled = true;
  document.getElementById('win-display').innerHTML = '';
  balance -= bet;
  document.getElementById('balance').textContent = balance;

  // Pick result
  const resultIdx = Math.floor(Math.random() * SEGMENTS.length);
  const seg = SEGMENTS[resultIdx];

  // Calculate rotation
  const sliceAngle = 360 / SEGMENTS.length;
  const targetAngle = 360 - (resultIdx * sliceAngle) - sliceAngle/2;
  const totalRotation = currentRotation + 360 * 5 + targetAngle;
  currentRotation = totalRotation;

  canvas.style.transition = 'none';
  canvas.offsetHeight; // reflow
  canvas.style.transition = 'transform 5s cubic-bezier(0.17, 0.67, 0.12, 0.99)';
  canvas.style.transform = `rotate(${totalRotation}deg)`;

  setTimeout(() => {
    const display = document.getElementById('win-display');
    if (seg.multiplier > 0) {
      const payout = Math.floor(bet * seg.multiplier);
      balance += payout;
      document.getElementById('balance').textContent = balance;
      display.innerHTML = `<div><div class="win-label">${seg.label}</div><div class="win-payout positive">+${payout} tokens!</div></div>`;
    } else {
      display.innerHTML = `<div><div class="win-label">${seg.label}</div><div class="win-payout negative">-${bet} tokens</div></div>`;
    }
    spinning = false;
    document.getElementById('spin-btn').disabled = false;
  }, 5200);
}
</script>
<script src="/public/js/admin-bar.js"></script>
</body>
</html>
