<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dungeon Slots | CumIN Dungeon</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root { --bg: #09070c; --surface: #13131a; --panel: #1a1a1a; --pink: #FF007F; --purple: #8A2BE2; --green: #39FF14; --gold: #e2b966; --cream: #f4edf5; --muted: #9888a3; --line: rgba(255,255,255,0.08); --serif: 'Cormorant Garamond', Georgia, serif; --sans: 'Inter', system-ui, sans-serif; }
* { box-sizing: border-box; margin: 0; }
body { background: radial-gradient(circle at top, rgba(138,43,226,0.12), transparent 30%), var(--bg); color: var(--cream); font-family: var(--sans); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; overflow: hidden; }
button { font: inherit; color: inherit; cursor: pointer; }
body::before { content: ''; position: fixed; inset: 0; background: radial-gradient(circle at 50% 25%, rgba(255,0,127,0.10), transparent 24%), radial-gradient(circle at 50% 78%, rgba(138,43,226,0.08), transparent 28%); pointer-events: none; }
.slot-machine { position: relative; width: min(420px, 100%); background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.015)); border: 1px solid rgba(255,0,127,0.22); border-radius: 24px; padding: 24px; box-shadow: 0 0 50px rgba(255,0,127,0.09), 0 0 80px rgba(138,43,226,0.08), inset 0 0 30px rgba(0,0,0,0.5); }
.slot-header { text-align: center; margin-bottom: 20px; }
.slot-header h1 { font-family: var(--serif); font-size: 1.9rem; font-style: italic; color: var(--cream); }
.slot-header p { font-size: 0.65rem; color: var(--muted); margin-top: 4px; }
.token-display { display: flex; justify-content: space-between; align-items: center; padding: 10px 16px; background: rgba(0,0,0,0.26); border-radius: 12px; margin-bottom: 16px; border: 1px solid var(--line); }
.token-display .balance, .token-display .bet-info span { font-size: 1.1rem; font-weight: 800; color: var(--gold); text-shadow: 0 0 8px rgba(255,0,127,0.3), 0 0 16px rgba(138,43,226,0.28); }
.token-display .label { font-size: 0.6rem; color: var(--muted); }
.token-display .bet-info { text-align: right; }
.reels-container { background: #09090d; border-radius: 14px; padding: 16px 12px; border: 1px solid rgba(138,43,226,0.24); position: relative; overflow: hidden; }
.reels-container::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 30px; background: linear-gradient(to bottom, #09090d, transparent); z-index: 5; pointer-events: none; }
.reels-container::after { content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 30px; background: linear-gradient(to top, #09090d, transparent); z-index: 5; pointer-events: none; }
.reels { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.reel { height: 240px; overflow: hidden; position: relative; border-radius: 10px; background: rgba(26,26,26,0.88); border: 1px solid rgba(255,0,127,0.14); }
.reel-strip { display: flex; flex-direction: column; align-items: center; transition: none; }
.symbol { width: 100%; height: 80px; display: flex; align-items: center; justify-content: center; font-size: 2.5rem; flex-shrink: 0; filter: drop-shadow(0 0 8px #FF007F) drop-shadow(0 0 12px rgba(138,43,226,0.45)); }
.win-line { position: absolute; top: 50%; left: 0; right: 0; height: 2px; background: var(--pink); transform: translateY(-50%); z-index: 10; opacity: 0.8; box-shadow: 0 0 10px var(--pink); }
.payline-left, .payline-right { position: absolute; top: 50%; transform: translateY(-50%); width: 12px; height: 12px; background: var(--purple); border-radius: 50%; z-index: 10; box-shadow: 0 0 10px var(--purple); }
.payline-left { left: -6px; }
.payline-right { right: -6px; }
.controls { margin-top: 16px; display: grid; grid-template-columns: 1fr 1fr auto; gap: 8px; align-items: center; }
.bet-controls { display: flex; align-items: center; gap: 6px; }
.bet-btn { width: 32px; height: 32px; border-radius: 50%; border: 1px solid rgba(255,0,127,0.3); background: rgba(255,0,127,0.08); font-weight: 800; font-size: 1rem; display: grid; place-items: center; color: var(--pink); }
.bet-amount { font-size: 1rem; font-weight: 800; min-width: 30px; text-align: center; color: var(--cream); text-shadow: 0 0 10px rgba(255,0,127,0.18); }
.max-btn { padding: 8px 14px; border: 1px solid rgba(138,43,226,0.3); border-radius: 10px; background: rgba(138,43,226,0.1); font-size: 0.65rem; font-weight: 800; color: var(--purple); }
.spin-btn { width: 64px; height: 64px; border-radius: 50%; border: 2px solid rgba(255,0,127,0.4); background: linear-gradient(180deg, var(--pink), var(--purple)); color: #fff; font-weight: 800; font-size: 0.7rem; letter-spacing: 0.05em; box-shadow: 0 0 24px rgba(255,0,127,0.22); transition: transform 0.15s, box-shadow 0.15s; }
.spin-btn:hover { transform: scale(1.05); box-shadow: 0 0 34px rgba(255,0,127,0.34); }
.spin-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
.result { text-align: center; margin-top: 16px; min-height: 40px; display: flex; align-items: center; justify-content: center; }
.result-text { font-size: 0.85rem; font-weight: 700; padding: 8px 16px; border-radius: 10px; animation: fadeIn 0.3s; }
.result-win { background: rgba(57,255,20,0.08); color: var(--green); border: 1px solid rgba(57,255,20,0.25); }
.result-lose { background: rgba(255,0,127,0.08); color: var(--pink); border: 1px solid rgba(255,0,127,0.18); }
.result-jackpot { background: rgba(138,43,226,0.12); color: var(--gold); border: 1px solid rgba(255,0,127,0.22); font-size: 1.1rem; animation: jackpot 0.5s ease-out; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
@keyframes jackpot { 0% { transform: scale(0.8); opacity: 0; } 50% { transform: scale(1.1); } 100% { transform: scale(1); opacity: 1; } }
.paytable { margin-top: 16px; padding: 12px; background: rgba(0,0,0,0.24); border-radius: 12px; border: 1px solid var(--line); }
.paytable h3 { font-family: var(--serif); font-size: 0.9rem; font-style: italic; color: var(--cream); margin-bottom: 8px; }
.paytable-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
.pay-row { display: flex; justify-content: space-between; align-items: center; padding: 4px 8px; border-radius: 6px; font-size: 0.62rem; }
.pay-row:nth-child(odd) { background: rgba(255,255,255,0.02); }
.pay-symbols { letter-spacing: 2px; font-size: 0.9rem; filter: drop-shadow(0 0 8px #FF007F); }
.pay-value { color: var(--gold); font-weight: 700; }
.win-overlay { display: none; position: absolute; inset: 0; background: rgba(0,0,0,0.68); border-radius: 24px; z-index: 20; place-items: center; }
.win-overlay.active { display: grid; animation: fadeIn 0.3s; }
.win-overlay-content { text-align: center; }
.win-overlay-content .big-text { font-family: var(--serif); font-size: 2.6rem; font-style: italic; color: var(--cream); text-shadow: 0 0 14px rgba(255,0,127,0.22); }
.win-overlay-content .win-amount { font-size: 1.5rem; font-weight: 800; color: var(--green); margin-top: 8px; text-shadow: 0 0 12px rgba(57,255,20,0.28); }
.coin { position: absolute; font-size: 1.2rem; animation: coinFall 1.5s ease-in forwards; pointer-events: none; z-index: 25; }
@keyframes coinFall { 0% { opacity: 1; transform: translateY(0) rotate(0deg); } 100% { opacity: 0; transform: translateY(200px) rotate(720deg); } }
.back-btn { position: fixed; top: 16px; left: 16px; padding: 8px 14px; border: 1px solid var(--line); border-radius: 10px; background: rgba(9,7,12,0.85); font-size: 0.68rem; font-weight: 700; color: var(--cream); text-decoration: none; z-index: 50; }
.back-btn:hover { border-color: var(--pink); }
</style>
</head>
<body>
<a href="/hall.html" class="back-btn">← Back to Hall</a>
<div class="slot-machine">
  <div class="slot-header">
    <h1>Dungeon Slots</h1>
    <p>Match 3 to win big. Match 2 for a small payout.</p>
  </div>
  <div class="token-display">
    <div><span class="label">Balance</span><span class="balance" id="balance">500</span></div>
    <div class="bet-info"><span class="label">Bet</span><span id="bet-display">10</span></div>
  </div>
  <div class="reels-container">
    <div class="win-line"></div>
    <div class="payline-left"></div>
    <div class="payline-right"></div>
    <div class="reels">
      <div class="reel" id="reel-0"><div class="reel-strip" id="strip-0"></div></div>
      <div class="reel" id="reel-1"><div class="reel-strip" id="strip-1"></div></div>
      <div class="reel" id="reel-2"><div class="reel-strip" id="strip-2"></div></div>
    </div>
  </div>
  <div class="controls">
    <div class="bet-controls">
      <button class="bet-btn" id="bet-down">−</button>
      <span class="bet-amount" id="bet-label">10</span>
      <button class="bet-btn" id="bet-up">+</button>
    </div>
    <button class="max-btn" id="max-bet">MAX</button>
    <button class="spin-btn" id="spin-btn">SPIN</button>
  </div>
  <div class="result" id="result"></div>
  <div class="paytable">
    <h3>Paytable</h3>
    <div class="paytable-grid">
      <div class="pay-row"><span class="pay-symbols">💋💋💋</span><span class="pay-value">50x</span></div>
      <div class="pay-row"><span class="pay-symbols">⛓️⛓️⛓️</span><span class="pay-value">25x</span></div>
      <div class="pay-row"><span class="pay-symbols">🔥🔥🔥</span><span class="pay-value">15x</span></div>
      <div class="pay-row"><span class="pay-symbols">👠👠👠</span><span class="pay-value">10x</span></div>
      <div class="pay-row"><span class="pay-symbols">🍒🍒🍒</span><span class="pay-value">8x</span></div>
      <div class="pay-row"><span class="pay-symbols">🖤🖤🖤</span><span class="pay-value">5x</span></div>
      <div class="pay-row"><span class="pay-symbols">Any 2 match</span><span class="pay-value">2x</span></div>
      <div class="pay-row"><span class="pay-symbols">💋 on any reel</span><span class="pay-value">Wild</span></div>
    </div>
  </div>
  <div class="win-overlay" id="win-overlay">
    <div class="win-overlay-content">
      <div class="big-text" id="win-text">BIG WIN!</div>
      <div class="win-amount" id="win-amount">+500</div>
    </div>
  </div>
</div>
<script>
const SYMBOLS = ['👠', '🍒', '🖤', '🔥', '⛓️', '💋'];
const WEIGHTS = [25, 20, 20, 15, 12, 8];
const PAYOUTS = { '💋': 50, '⛓️': 25, '🔥': 15, '👠': 10, '🍒': 8, '🖤': 5 };
let balance = 500;
let bet = 10;
let spinning = false;
const BET_STEPS = [5, 10, 15, 20, 25, 50];
let betIndex = 1;
const balanceEl = document.getElementById('balance');
const betDisplay = document.getElementById('bet-display');
const betLabel = document.getElementById('bet-label');
const spinBtn = document.getElementById('spin-btn');
const resultEl = document.getElementById('result');
function getWeightedSymbol() {
  const total = WEIGHTS.reduce((a, b) => a + b, 0);
  let r = Math.random() * total;
  for (let i = 0; i < SYMBOLS.length; i++) {
    r -= WEIGHTS[i];
    if (r <= 0) return SYMBOLS[i];
  }
  return SYMBOLS[0];
}
function fillReel(stripEl, count = 20) {
  stripEl.innerHTML = '';
  for (let i = 0; i < count; i++) {
    const div = document.createElement('div');
    div.className = 'symbol';
    div.textContent = getWeightedSymbol();
    stripEl.appendChild(div);
  }
}
function initReels() {
  for (let i = 0; i < 3; i++) {
    fillReel(document.getElementById(`strip-${i}`));
    document.getElementById(`strip-${i}`).style.transform = 'translateY(-80px)';
  }
}
async function spin() {
  if (spinning || balance < bet) return;
  spinning = true;
  spinBtn.disabled = true;
  resultEl.innerHTML = '';
  balance -= bet;
  balanceEl.textContent = balance;
  const results = [getWeightedSymbol(), getWeightedSymbol(), getWeightedSymbol()];
  for (let i = 0; i < 3; i++) {
    const strip = document.getElementById(`strip-${i}`);
    const spinCount = 15 + i * 5;
    strip.innerHTML = '';
    for (let j = 0; j < spinCount; j++) {
      const div = document.createElement('div');
      div.className = 'symbol';
      div.textContent = getWeightedSymbol();
      strip.appendChild(div);
    }
    const before = document.createElement('div'); before.className = 'symbol'; before.textContent = getWeightedSymbol(); strip.appendChild(before);
    const final = document.createElement('div'); final.className = 'symbol'; final.textContent = results[i]; strip.appendChild(final);
    const after = document.createElement('div'); after.className = 'symbol'; after.textContent = getWeightedSymbol(); strip.appendChild(after);
    strip.style.transition = 'none';
    strip.style.transform = 'translateY(0)';
    await sleep(50);
    const finalPos = -(spinCount * 80);
    strip.style.transition = `transform ${1.2 + i * 0.4}s cubic-bezier(0.15, 0.85, 0.25, 1)`;
    strip.style.transform = `translateY(${finalPos}px)`;
  }
  await sleep(2400);
  checkWin(results);
  spinning = false;
  spinBtn.disabled = false;
}
function checkWin(results) {
  const [a, b, c] = results;
  if (a === b && b === c) {
    const multiplier = PAYOUTS[a] || 10;
    const winAmount = bet * multiplier;
    balance += winAmount;
    balanceEl.textContent = balance;
    if (multiplier >= 25) showBigWin(winAmount, a === '💋' ? 'JACKPOT!' : 'BIG WIN!');
    else resultEl.innerHTML = `<span class="result-text result-win">${a}${a}${a} : ${multiplier}x, +${winAmount} tokens</span>`;
    spawnCoins();
  } else if (a === b || b === c || a === c) {
    const winAmount = bet * 2;
    balance += winAmount;
    balanceEl.textContent = balance;
    resultEl.innerHTML = `<span class="result-text result-win">Two match! +${winAmount} tokens</span>`;
  } else {
    resultEl.innerHTML = `<span class="result-text result-lose">No match. -${bet} tokens</span>`;
  }
}
function showBigWin(amount, text) {
  const overlay = document.getElementById('win-overlay');
  document.getElementById('win-text').textContent = text;
  document.getElementById('win-amount').textContent = `+${amount} tokens`;
  overlay.classList.add('active');
  setTimeout(() => overlay.classList.remove('active'), 3000);
}
function spawnCoins() {
  const machine = document.querySelector('.slot-machine');
  for (let i = 0; i < 12; i++) {
    const coin = document.createElement('div');
    coin.className = 'coin';
    coin.textContent = '🪙';
    coin.style.left = Math.random() * 80 + 10 + '%';
    coin.style.top = Math.random() * 30 + '%';
    coin.style.animationDelay = Math.random() * 0.5 + 's';
    machine.appendChild(coin);
    setTimeout(() => coin.remove(), 2000);
  }
}
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
document.getElementById('bet-up').addEventListener('click', () => { if (betIndex < BET_STEPS.length - 1) betIndex++; bet = BET_STEPS[betIndex]; betDisplay.textContent = bet; betLabel.textContent = bet; });
document.getElementById('bet-down').addEventListener('click', () => { if (betIndex > 0) betIndex--; bet = BET_STEPS[betIndex]; betDisplay.textContent = bet; betLabel.textContent = bet; });
document.getElementById('max-bet').addEventListener('click', () => { betIndex = BET_STEPS.length - 1; bet = BET_STEPS[betIndex]; betDisplay.textContent = bet; betLabel.textContent = bet; });
spinBtn.addEventListener('click', spin);
document.addEventListener('keydown', (e) => { if (e.code === 'Space' && !spinning) { e.preventDefault(); spin(); } });
initReels();
</script>
<script src="/public/js/admin-bar.js"></script>
</body>
</html>
