<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0a0604"><title>CumIN Dungeon | After Dark</title><link rel="stylesheet" href="/public/css/brand.css"><style>html,body{overflow:hidden}#stage{position:fixed;inset:0;overflow:hidden;background:var(--bg)}#art{position:absolute;inset:-4%;background:var(--bg) center/cover no-repeat;opacity:0;transform:scale(1.015);transition:opacity 1.35s cubic-bezier(.22,1,.36,1),transform 5.8s cubic-bezier(.22,1,.36,1),filter 1.35s ease;filter:saturate(.92) contrast(1.06) brightness(.78)}#art:before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 42%,transparent 15%,rgba(0,0,0,.18) 55%,rgba(0,0,0,.72) 100%)}#art:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.2),transparent 35%,rgba(0,0,0,.78)),radial-gradient(ellipse at 50% 45%,transparent 40%,rgba(0,0,0,.28) 100%)}#veil{position:absolute;inset:0;background:#050302;opacity:1;transition:opacity 1.5s cubic-bezier(.22,1,.36,1);z-index:2;pointer-events:none}#copy{position:absolute;left:50%;bottom:12%;transform:translate(-50%,18px);opacity:0;z-index:3;text-align:center;width:min(90%,900px);text-shadow:0 5px 28px #000;transition:opacity 1s ease .25s,transform 1.2s cubic-bezier(.22,1,.36,1) .25s}#copy.visible{opacity:1;transform:translate(-50%,0)}#copy h1{font-family:var(--serif);font-size:clamp(2rem,5vw,4.4rem);margin:0 0 10px;color:var(--gold-light);letter-spacing:.09em;text-transform:uppercase}#copy p{color:#dcc7ad;margin:0;font-size:clamp(.75rem,1.5vw,1rem);letter-spacing:.22em;text-transform:uppercase}.controls{position:fixed;right:20px;bottom:20px;display:flex;gap:8px;z-index:5}button{border:1px solid rgba(213,154,75,.55);background:rgba(10,6,4,.82);color:var(--cream);border-radius:8px;padding:10px 14px;font-weight:700;cursor:pointer;backdrop-filter:blur(10px)}#progress{position:fixed;left:0;top:0;height:2px;width:0;background:linear-gradient(90deg,#8a5e2a,#f5c77e,#d59a4b);z-index:6}@media(max-width:700px){#copy{bottom:14%}#copy h1{font-size:clamp(1.8rem,9vw,3rem)}#copy p{font-size:.62rem;letter-spacing:.16em}}</style></head><body><div id="stage"><div id="art"></div><div id="veil"></div><div id="copy"><h1 id="title">Welcome to CumIN Dungeon</h1><p id="subtitle">The Grand Hall awaits</p></div></div><div id="progress"></div><div class="controls"><button id="skip">Enter the Grand Hall</button></div><script>const sequences=[{art:'/public/assets/art/96cef52b-2d51-485b-addc-afeac1029c2d~2.jpg',title:'Welcome to CumIN Dungeon',text:'The Grand Hall awaits'},{art:'/public/assets/art/b3239591-8c30-4dae-b261-7c42ab8022f1~3.jpg',title:'The Velvet Rooms',text:'Private rooms \u00b7 Live performers \u00b7 After Dark'},{art:'/public/assets/art/1_16adc8b3-9070-4b50-8233-5fbd18ca1106.png',title:'After Dark Casino',text:'Premium token games \u00b7 Instant results'}];const art=document.getElementById('art'),veil=document.getElementById('veil'),copy=document.getElementById('copy'),title=document.getElementById('title'),subtitle=document.getElementById('subtitle'),progress=document.getElementById('progress');let index=0,start=0,duration=4200,timer;function go(){window.location.href='/castle-lobby.html'}function show(item){clearTimeout(timer);copy.classList.remove('visible');art.style.opacity='0';art.style.transform='scale(1.015)';setTimeout(()=>{art.style.backgroundImage=`url('${item.art}')`;title.textContent=item.title;subtitle.textContent=item.text;requestAnimationFrame(()=>{veil.style.opacity='0';art.style.opacity='1';art.style.transform='scale(1.075)'});requestAnimationFrame(()=>copy.classList.add('visible'));start=performance.now();tick()},420);timer=setTimeout(next,duration)}function tick(){const p=Math.min(100,((performance.now()-start)/duration)*100);progress.style.width=p+'%';if(p<100)requestAnimationFrame(tick)}function next(){if(index>=sequences.length){go();return}show(sequences[index++])}document.getElementById('skip').addEventListener('click',go);setTimeout(next,700)</script></body></html>
