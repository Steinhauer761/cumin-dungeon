<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Welcome to CumIN Dungeon</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030202;color:#f5eee4;font-family:Inter,system-ui,sans-serif}
#stage{position:fixed;inset:0;overflow:hidden;background:#030202}
#art{position:absolute;inset:-4%;background:#030202 center/cover no-repeat;opacity:0;transform:scale(1.015);transition:opacity 1.35s cubic-bezier(.22,1,.36,1),transform 5.8s cubic-bezier(.22,1,.36,1),filter 1.35s ease;filter:saturate(.92) contrast(1.06) brightness(.78);will-change:opacity,transform,filter}
#art::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 42%,transparent 15%,rgba(0,0,0,.18) 55%,rgba(0,0,0,.72) 100%)}
#art::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.2),transparent 35%,rgba(0,0,0,.78)),radial-gradient(ellipse at 50% 45%,transparent 40%,rgba(0,0,0,.28) 100%)}
#veil{position:absolute;inset:0;background:#050302;opacity:1;transition:opacity 1.5s cubic-bezier(.22,1,.36,1);z-index:2;pointer-events:none}
#copy{position:absolute;left:50%;bottom:12%;transform:translate(-50%,18px);opacity:0;z-index:3;text-align:center;width:min(90%,900px);text-shadow:0 5px 28px #000;transition:opacity 1s ease .25s,transform 1.2s cubic-bezier(.22,1,.36,1) .25s}
#copy.visible{opacity:1;transform:translate(-50%,0)}
#copy h1{font-family:Georgia,serif;font-size:clamp(2rem,5vw,4.4rem);margin:0 0 10px;color:#f0c87b;letter-spacing:.09em;text-transform:uppercase}
#copy p{color:#dcc7ad;margin:0;font-size:clamp(.75rem,1.5vw,1rem);letter-spacing:.22em;text-transform:uppercase}
.controls{position:fixed;right:20px;bottom:20px;display:flex;gap:8px;z-index:5}
button{border:1px solid rgba(213,154,75,.55);background:rgba(10,6,4,.82);color:#f5eee4;border-radius:8px;padding:10px 14px;font-weight:700;cursor:pointer;backdrop-filter:blur(10px);transition:background .2s,border-color .2s,transform .2s}
button:hover{border-color:#f5c77e;background:rgba(20,10,5,.9);transform:translateY(-1px)}
#progress{position:fixed;left:0;top:0;height:2px;width:0;background:linear-gradient(90deg,#8a5e2a,#f5c77e,#d59a4b);z-index:6;box-shadow:0 0 12px rgba(245,199,126,.35);transition:width .12s linear}
@media(max-width:700px){#copy{bottom:14%}#copy h1{font-size:clamp(1.8rem,9vw,3rem)}#copy p{font-size:.62rem;letter-spacing:.16em}}
</style>
</head>
<body>
<div id="stage"><div id="art"></div><div id="veil"></div><div id="copy"><h1 id="title">Welcome to the Dungeon</h1><p id="subtitle">The Grand Hall awaits</p></div></div>
<div id="progress"></div>
<div class="controls"><button id="skip">Enter now</button></div>

<!-- NEW: The Video Transition Overlay -->
<div id="video-overlay" style="display: none; position: fixed; inset: 0; background: black; z-index: 9999;">
  <video id="transition-video" style="width: 100%; height: 100%; object-fit: cover;" playsinline>
    <!-- IMPORTANT: Change "YOUR_VIDEO_NAME.mp4" to your actual video file path below -->
    <source src="YOUR_VIDEO_NAME.mp4" type="video/mp4">
  </video>
</div>

<script>
const sequences=[
 {art:'https://app-attachments-public.clickup.com/07b7448f-853c-48e6-82e8-435de3962bb1.png',title:'Welcome to the Dungeon',text:'The Grand Hall awaits'},
 {art:'https://app-attachments-public.clickup.com/88dc235b-b9f9-45e9-b104-1040db693e44.png',title:'The Velvet Room',text:'Step beyond the velvet doors'},
 {art:'https://app-attachments-public.clickup.com/c073943a-ddcc-4150-a58c-46b4dc0c514b.png',title:'The Dungeon',text:'Private rooms • Live performers • After Dark'}
];
const art=document.getElementById('art'),veil=document.getElementById('veil'),copy=document.getElementById('copy'),title=document.getElementById('title'),subtitle=document.getElementById('subtitle'),progress=document.getElementById('progress');
let index=0,start=0,duration=4200,timer;

// NEW: Updated go() function to play the video transition before redirecting
function go() {
  const overlay = document.getElementById('video-overlay');
  const video = document.getElementById('transition-video');
  
  overlay.style.display = 'block';
  
  // Try to play the video. If the browser blocks it, redirect immediately so the user isn't stuck.
  let playPromise = video.play();
  if (playPromise !== undefined) {
    playPromise.catch(error => {
      window.location.href = '/hall.html';
    });
  }

  video.onended = function() {
    window.location.href = '/hall.html';
  };
  
  video.onerror = function() {
    window.location.href = '/hall.html';
  };
}

function show(item){
 clearTimeout(timer);copy.classList.remove('visible');art.style.opacity='0';art.style.transform='scale(1.015)';art.style.filter='saturate(.75) contrast(1.08) brightness(.55)';
 setTimeout(()=>{art.style.backgroundImage=`url('${item.art}')`;title.textContent=item.title;subtitle.textContent=item.text;requestAnimationFrame(()=>{veil.style.opacity='0';art.style.opacity='1';art.style.transform='scale(1.075)';art.style.filter='saturate(.92) contrast(1.06) brightness(.78)';copy.classList.add('visible')});start=performance.now();tick()},420);
 timer=setTimeout(next,duration);
}
function tick(){const p=Math.min(100,((performance.now()-start)/duration)*100);progress.style.width=p+'%';if(p<100)requestAnimationFrame(tick)}
function next(){if(index>=sequences.length){go();return}show(sequences[index++])}
document.getElementById('skip').addEventListener('click',go);
setTimeout(next,700);
</script>
</body>
</html>
