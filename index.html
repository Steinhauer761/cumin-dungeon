<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Operations</title><script src="https://tailwindcss.com"></script><link href="https://googleapis.com" rel="stylesheet"><style>body{font-family:'Plus Jakarta Sans',sans-serif;background-color:#0b0f19;}::-webkit-scrollbar{display:none;}</style></head><body class="text-gray-100 min-h-screen flex flex-col antialiased bg-[#0b0f19]"><div class="w-full flex-1 flex justify-center items-stretch bg-[#060814]"><div class="w-full max-w-md bg-[#0b0f19] flex flex-col relative border-x border-gray-800 shadow-2xl min-h-screen"><header class="bg-[#111827] p-4 border-b border-gray-800 sticky top-0 z-50"><div class="flex justify-between items-center"><div><h1 class="text-base font-extrabold tracking-tight text-white uppercase">HUSTLE OPERATIONS</h1><p class="text-[10px] font-bold text-blue-500 tracking-widest uppercase">Pipeline</p></div><span class="text-xs bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-2.5 py-1 rounded-full font-black">LIVE</span></div></header><div class="p-4 grid grid-cols-2 gap-2 text-center text-[10px] font-bold"><div class="bg-gradient-to-br from-slate-900 to-[#111827] border border-gray-800 rounded-xl p-3 shadow-xl"><div id="total-revenue" class="text-blue-400 font-black text-sm">$0.00</div><p class="text-gray-500 text-[9px] uppercase tracking-wider mt-0.5">Gross Revenue</p></div><div class="bg-gradient-to-br from-slate-900 to-[#111827] border border-gray-800 rounded-xl p-3 shadow-xl"><div id="active-accounts" class="text-emerald-400 font-black text-sm">0 Active</div><p class="text-gray-500 text-[9px] uppercase tracking-wider mt-0.5">Vetted Clients</p></div></div><main class="p-4 flex-1 space-y-4"><div class="bg-[#111827] border border-gray-800 p-4 rounded-2xl shadow-xl space-y-3"><h3 class="text-xs font-black text-gray-300 uppercase tracking-widest border-b border-gray-800 pb-2">📋 Client Vetting Onboarding</h3><div class="space-y-2 pt-1 text-xs"><div><label class="block text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-1">Corporate / Client Handle</label><input id="client-handle" type="text" placeholder="@EnterpriseVIP" class="w-full bg-[#060814] border border-gray-800 rounded-xl px-3 py-2.5 text-white focus:outline-none focus:border-blue-500 font-mono"></div><div><label class="block text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-1">Security Authentication Serial</label><input id="client-serial" type="text" placeholder="SERIAL-0000-XXXX" class="w-full bg-[#060814] border border-gray-800 rounded-xl px-3 py-2.5 text-white focus:outline-none focus:border-blue-500 font-mono uppercase"></div><button onclick="onboardClient()" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-extrabold py-3 rounded-xl text-xs uppercase tracking-wider shadow-lg">Process Account Admission</button></div></div><div class="bg-[#111827] border border-gray-800 p-4 rounded-2xl shadow-xl space-y-3"><h3 class="text-xs font-black text-amber-400 uppercase tracking-widest border-b border-gray-800 pb-2">📦 Premium Packaging Logistics</h3><div class="grid grid-cols-2 gap-2 text-center text-white"><button onclick="logAssetOrder('Elite Matte Card',10)" class="bg-[#060814] hover:bg-slate-900 p-3 rounded-xl border border-gray-800 transition"><div class="text-xl">💳</div><div class="text-[9px] text-gray-400 font-bold mt-1 uppercase tracking-wide">Elite Member Card</div></button><button onclick="logAssetOrder('Discreet Stealth Box',30)" class="bg-[#060814] hover:bg-slate-900 p-3 rounded-xl border border-gray-800 transition"><div class="text-xl">📦</div><div class="text-[9px] text-gray-400 font-bold mt-1 uppercase tracking-wide">Stealth Envelope</div></button></div></div><div class="bg-[#111827] border border-gray-800 p-4 rounded-2xl shadow-xl flex flex-col h-48"><h3 class="text-xs font-black text-gray-300 uppercase tracking-widest border-b border-gray-800 pb-2 mb-2">⚡ Real-Time Operational Activity</h3><div id="activity-stream" class="flex-1 overflow-y-auto space-y-1.5 p-2 bg-[#060814] rounded-xl text-[11px] font-mono text-gray-400"><div class="text-blue-400">[SYSTEM] Operations console initialized. Waiting for pipeline entry data...</div></div></div></main><footer class="p-4 bg-[#111827] border-t border-gray-800 text-center text-[9px] text-gray-500 uppercase tracking-widest">Secure Distribution Framework</footer></div></div><script>let revenueCount=0.00;let accountsCount=0;function onboardClient(){const handle=document.getElementById('client-handle').value.trim();const serial=document.getElementById('client-serial').value.trim().toUpperCase();if(handle===""||serial===""){alert("❌ Input fields cannot be empty.");return;}accountsCount++;document.getElementById('active-accounts').innerText=`\${accountsCount} Active`;const stream=document.getElementById('activity-stream');const log=document.createElement('div');log.className="text-emerald-400";log.innerText=`[🟢 VETTED] Client \${handle} initialized under Serial Key: \${serial}`;stream.appendChild(log);document.getElementById('client-handle').value='';document.getElementById('client-serial').value='';stream.scrollTop=stream.scrollHeight;}function logAssetOrder(assetName,assetCost){revenueCount+=assetCost;document.getElementById('total-revenue').innerText=`$\${revenueCount.toFixed(2)}`;const stream=document.getElementById('activity-stream');const log=document.createElement('div');log.className="text-amber-400";log.innerText=`[📦 LOGISTICS] Premium Order Added: \${assetName} (+\$\${assetCost}.00)`;stream.appendChild(log);stream.scrollTop=stream.scrollHeight;}</script></body></html>
