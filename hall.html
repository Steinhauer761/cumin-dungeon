<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grand Hall | CumIN Dungeon</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,700&family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root { --bg: #09070c; --surface: #111117; --surface-2: #171722; --pink: #ff007f; --purple: #8a2be2; --green: #39ff14; --gold: #d7b15f; --cream: #f2e9f2; --muted: #8f8199; --line: rgba(255,255,255,0.08); --serif: 'Cormorant Garamond', Georgia, serif; --sans: 'Inter', system-ui, sans-serif; --ease: cubic-bezier(0.22,1,0.36,1); }
* { box-sizing: border-box; margin: 0; }
body { background: radial-gradient(circle at top, rgba(138,43,226,0.12), transparent 28%), var(--bg); color: var(--cream); font-family: var(--sans); font-size: 15px; line-height: 1.5; }
button { font: inherit; color: inherit; cursor: pointer; }
.hall-layout { display: grid; grid-template-columns: 1fr 340px; min-height: 100vh; }
.hall-main { padding: 24px; overflow-y: auto; }
.hall-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
.hall-header h1 { font-family: var(--serif); font-size: 1.95rem; font-style: italic; }
.btn-back { padding: 7px 14px; border: 1px solid var(--line); border-radius: 10px; background: rgba(255,255,255,0.03); font-size: 0.7rem; font-weight: 700; text-decoration: none; color: var(--cream); }
.btn-back:hover { border-color: var(--pink); }
.token-bar { display: flex; align-items: center; gap: 16px; padding: 12px 16px; border: 1px solid var(--line); border-radius: 14px; background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01)); margin-bottom: 24px; }
.token-bar .balance { font-size: 1.15rem; font-weight: 800; color: var(--gold); text-shadow: 0 0 10px rgba(255,0,127,0.25), 0 0 20px rgba(138,43,226,0.25); }
.token-bar .label { font-size: 0.65rem; color: var(--muted); }
.tabs { display: flex; gap: 6px; margin-bottom: 20px; }
.tab { padding: 8px 16px; border: 1px solid var(--line); border-radius: 10px; background: rgba(255,255,255,0.02); font-size: 0.72rem; font-weight: 700; transition: all 0.15s; }
.tab:hover { border-color: var(--pink); }
.tab.active { background: linear-gradient(135deg, rgba(255,0,127,0.18), rgba(138,43,226,0.18)); color: var(--cream); border-color: rgba(255,0,127,0.35); box-shadow: 0 0 18px rgba(255,0,127,0.12); }
.games-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
.game-card { padding: 14px; border: 1px solid var(--line); border-radius: 18px; background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.015)); cursor: pointer; transition: transform 0.18s, border-color 0.18s, box-shadow 0.18s; text-decoration: none; color: inherit; display: block; overflow: hidden; }
.game-card:hover { transform: translateY(-3px); border-color: rgba(255,0,127,0.35); box-shadow: 0 18px 34px rgba(0,0,0,0.28), 0 0 24px rgba(138,43,226,0.14); }
.game-card h3 { font-family: var(--serif); font-size: 1.05rem; margin-bottom: 4px; font-style: italic; }
.game-card p { font-size: 0.68rem; color: var(--muted); line-height: 1.45; margin-bottom: 8px; }
.game-card .reward { font-size: 0.6rem; color: var(--green); font-weight: 700; }
.game-card .cost { font-size: 0.6rem; color: var(--pink); font-weight: 700; margin-left: 8px; }
.game-card .bet-range { font-size: 0.58rem; color: var(--gold); font-weight: 700; }
.game-card .max-win { font-size: 0.58rem; color: var(--green); margin-left: 8px; }
.game-card-media { position: relative; width: 100%; height: 126px; border-radius: 12px; margin-bottom: 12px; overflow: hidden; background: #0f0f15; }
.game-card-media img, .game-card-media video { width: 100%; height: 100%; object-fit: cover; display: block; }
.room-card-title { display:flex; align-items:center; justify-content:space-between; gap:8px; }
.room-status { font-size: 0.55rem; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--green); }
.room-status.open { color: var(--gold); }
.media-fallback { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; background: radial-gradient(circle at 30% 30%, rgba(255,0,127,0.18), transparent 30%), radial-gradient(circle at 70% 70%, rgba(138,43,226,0.18), transparent 32%), linear-gradient(135deg, #12121a, #0c0c12); }
.media-fallback.active { display: flex; }
.media-fallback svg { width: 64px; height: 64px; filter: drop-shadow(0 0 14px rgba(255,0,127,0.55)); animation: neonPulse 2.3s ease-in-out infinite; }
@keyframes neonPulse { 0%,100% { opacity: .75; transform: scale(1); } 50% { opacity: 1; transform: scale(1.06); } }
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.82); backdrop-filter: blur(14px); z-index: 100; place-items: center; }
.modal-overlay.active { display: grid; }
.modal { width: min(460px, 90%); padding: 26px; border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; background: rgba(10,10,14,0.8); backdrop-filter: blur(16px); text-align: center; box-shadow: 0 24px 60px rgba(0,0,0,0.45), 0 0 30px rgba(138,43,226,0.12); }
.modal h2 { font-family: var(--serif); font-size: 1.6rem; margin-bottom: 8px; font-style: italic; }
.modal .challenge { font-family: var(--serif); font-size: 1rem; letter-spacing: 0.01em; color: var(--cream); margin: 16px 0; padding: 18px; border: 1px solid rgba(255,255,255,0.08); border-radius: 14px; background: rgba(0,0,0,0.28); line-height: 1.55; }
.modal .actions { display: flex; gap: 10px; justify-content: center; margin-top: 16px; flex-wrap: wrap; }
.modal .btn { padding: 11px 20px; border-radius: 10px; font-weight: 800; font-size: 0.75rem; border: none; }
.btn-gold { background: linear-gradient(135deg, var(--purple), var(--pink)); color: #fff; animation: urgencyPulse 1.8s ease-in-out infinite; }
.btn-red { background: rgba(255,0,127,0.12); color: var(--pink); border: 1px solid rgba(255,0,127,0.4); animation: urgencyPulse 1.8s ease-in-out infinite; }
.btn-outline { background: transparent; border: 1px solid var(--line); color: var(--cream); }
@keyframes urgencyPulse { 0%,100% { transform: scale(1); box-shadow: 0 0 0 rgba(255,0,127,0); } 50% { transform: scale(1.03); box-shadow: 0 0 18px rgba(255,0,127,0.2); } }
.modal .result { font-size: 1rem; font-weight: 800; margin: 12px 0; }
.result-win { color: var(--green); }
.result-lose { color: var(--pink); }
.hall-chat { display: grid; grid-template-rows: auto 1fr auto; border-left: 1px solid var(--line); background: var(--surface); }
.hall-chat-header { padding: 14px 16px; border-bottom: 1px solid var(--line); }
.hall-chat-header h3 { font-size: 0.82rem; font-weight: 700; }
.hall-chat-header p { font-size: 0.6rem; color: var(--muted); margin-top: 2px; }
.hall-messages { padding: 12px 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
.chat-msg { display: grid; grid-template-columns: 24px 1fr; gap: 8px; }
.chat-avatar { width: 24px; height: 24px; border-radius: 50%; background: rgba(255,0,127,0.15); display: grid; place-items: center; font-size: 0.55rem; font-weight: 800; color: var(--pink); }
.chat-msg p { font-size: 0.72rem; color: #b8ada3; line-height: 1.4; }
.chat-msg strong { color: var(--cream); }
.hall-chat-input { display: grid; grid-template-columns: 1fr auto; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); }
.hall-chat-input input { padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: #0d0d12; color: var(--cream); font-size: 0.75rem; }
.hall-chat-input button { padding: 10px 16px; border: none; border-radius: 10px; background: linear-gradient(135deg, var(--purple), var(--pink)); color: #fff; font-weight: 800; font-size: 0.72rem; }
@media (max-width: 768px) { .hall-layout { grid-template-columns: 1fr; } .hall-chat { height: 300px; } }
</style>
</head>
<body>
<div class="hall-layout">
  <div class="hall-main">
    <div class="hall-header">
      <h1>The Grand Hall</h1>
      <a href="/" class="btn-back">Back to Rooms</a>
    </div>

    <div class="token-bar">
      <div><span class="balance" id="token-balance">50</span><span class="label"> tokens</span></div>
      <div style="font-size:0.65rem;color:var(--muted)">Earn from games, spend in rooms, flex in public</div>
    </div>

    <div class="tabs">
      <button class="tab active" data-tab="games">Social Games</button>
      <button class="tab" data-tab="casino">Casino</button>
      <button class="tab" data-tab="rooms">Rooms</button>
    </div>

    <div id="games-section">
      <div class="games-grid" id="games-grid"></div>
    </div>

    <div id="casino-section" style="display:none">
      <div class="games-grid" id="casino-grid"></div>
    </div>

    <div id="rooms-section" style="display:none">
      <div class="games-grid" id="rooms-grid"></div>
    </div>
  </div>

  <aside class="hall-chat">
    <div class="hall-chat-header">
      <h3>Grand Hall Chat</h3>
      <p>Everyone's welcome. Consent required for DMs.</p>
    </div>
    <div class="hall-messages" id="hall-messages"></div>
    <form class="hall-chat-input" id="hall-chat-form">
      <input id="hall-chat-input" maxlength="200" placeholder="Say something..." autocomplete="off">
      <button type="submit">Send</button>
    </form>
  </aside>
</div>

<div class="modal-overlay" id="modal">
  <div class="modal">
    <h2 id="modal-title">Game</h2>
    <div class="challenge" id="modal-challenge">Loading...</div>
    <div class="result" id="modal-result"></div>
    <div class="actions" id="modal-actions"></div>
  </div>
</div>

<script src="https://cdn.ably.com/lib/ably.min-1.js"></script>
<script src="/public/js/chat.js"></script>
<script>
const guestId = 'Guest_' + Math.random().toString(36).slice(2,7);
let tokenBalance = 50;
let currentGame = null;
const CASINO_PAGES = {
  'dungeon-slots': '/games/slots.html',
  'sin-roulette': '/games/roulette.html',
  'strip-blackjack': '/games/blackjack.html',
  'devils-dice': '/games/dice.html',
  'high-or-low': '/games/highlow.html',
  'kink-wheel': '/games/kinkwheel.html',
};

function fallbackMarkup() {
  return `<div class="media-fallback active"><svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M14 48L28 34L38 42L50 26" stroke="#FF007F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M18 18H46C48.2091 18 50 19.7909 50 22V42C50 44.2091 48.2091 46 46 46H18C15.7909 46 14 44.2091 14 42V22C14 19.7909 15.7909 18 18 18Z" stroke="#8A2BE2" stroke-width="3"/><circle cx="24" cy="26" r="3" fill="#39FF14"/></svg></div>`;
}

function createMediaNode({ image, video, alt }) {
  const wrap = document.createElement('div');
  wrap.className = 'game-card-media';
  wrap.innerHTML = fallbackMarkup();
  const fallback = wrap.querySelector('.media-fallback');

  if (video) {
    const vid = document.createElement('video');
    vid.src = video;
    vid.muted = true;
    vid.loop = true;
    vid.playsInline = true;
    vid.autoplay = true;
    vid.addEventListener('loadeddata', () => fallback.classList.remove('active'));
    vid.addEventListener('error', () => fallback.classList.add('active'));
    wrap.prepend(vid);
    return wrap;
  }

  if (image) {
    const img = document.createElement('img');
    img.src = image;
    img.alt = alt || '';
    img.addEventListener('load', () => fallback.classList.remove('active'));
    img.addEventListener('error', () => { img.remove(); fallback.classList.add('active'); });
    wrap.prepend(img);
  }

  return wrap;
}

async function loadGames() {
  const res = await fetch('/api/games');
  const data = await res.json();
  const grid = document.getElementById('games-grid');
  grid.innerHTML = '';
  data.games.forEach(game => {
    const card = document.createElement('div');
    card.className = 'game-card';
    card.innerHTML = `<h3>${game.name}</h3><p>${game.description}</p><span class="reward">↑ ${game.tokenReward.min}-${game.tokenReward.max} tokens</span>${game.skipCost ? `<span class="cost">Skip: -${game.skipCost}</span>` : ''}`;
    card.addEventListener('click', () => playSocialGame(game));
    grid.appendChild(card);
  });
}

async function loadCasino() {
  const grid = document.getElementById('casino-grid');
  grid.innerHTML = '';
  const games = [
    { id: 'dungeon-slots', name: 'Dungeon Slots', desc: 'Spin the reels. Match symbols. Win big.', bet: '5-50', max: '50x' },
    { id: 'sin-roulette', name: 'Sin Roulette', desc: 'Pick your number or color. The wheel decides.', bet: '5-50', max: '36x' },
    { id: 'strip-blackjack', name: 'Strip Blackjack', desc: 'Beat the dealer to 21. Double down if you dare.', bet: '10-100', max: '2.5x' },
    { id: 'devils-dice', name: "Devil's Dice", desc: 'Predict the roll. Over, under, or exact.', bet: '5-50', max: '30x' },
    { id: 'high-or-low', name: 'High or Low', desc: 'Guess the next card. Build your streak.', bet: '10-50', max: 'Streak' },
    { id: 'kink-wheel', name: 'Kink Wheel', desc: 'Spin the wheel. Land on a multiplier.', bet: '5-50', max: '10x' },
  ];
  games.forEach(game => {
    const link = document.createElement('a');
    link.className = 'game-card';
    link.href = CASINO_PAGES[game.id] || '#';
    link.innerHTML = `<h3>${game.name}</h3><p>${game.desc}</p><span class="bet-range">Bet: ${game.bet}</span><span class="max-win">Max: ${game.max}</span>`;
    grid.appendChild(link);
  });
}

async function loadRooms() {
  const res = await fetch('/api/rooms');
  const data = await res.json();
  const grid = document.getElementById('rooms-grid');
  grid.innerHTML = '';
  (data.rooms || []).forEach(room => {
    const link = document.createElement('a');
    link.className = 'game-card';
    link.href = `/room.html?id=${encodeURIComponent(room.id)}`;
    const media = createMediaNode({ image: room.thumbnail, video: room.previewVideo, alt: room.name });
    const statusClass = room.status === 'open' ? 'open' : '';
    const content = document.createElement('div');
    content.innerHTML = `<div class="room-card-title"><h3>${room.name}</h3><span class="room-status ${statusClass}">${room.status}</span></div><p>${room.description || ''}</p><span class="reward">${room.viewers || 0} watching</span>`;
    link.appendChild(media);
    link.appendChild(content);
    grid.appendChild(link);
  });
}

async function playSocialGame(game) {
  currentGame = game;
  const res = await fetch('/api/games/play', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({userId: guestId, gameId: game.id, action: 'spin'}) });
  const data = await res.json();
  showModal(game.name, data.challenge, [
    { text: 'Complete (+tokens)', class: 'btn-gold', action: () => completeSocialGame(game) },
    { text: `Skip (-${game.skipCost})`, class: 'btn-red', action: () => skipSocialGame(game) },
    { text: 'Close', class: 'btn-outline', action: closeModal },
  ]);
}

async function completeSocialGame(game) {
  const res = await fetch('/api/games/play', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({userId: guestId, gameId: game.id, action: 'complete'}) });
  const data = await res.json();
  tokenBalance += data.tokensEarned;
  updateBalance();
  document.getElementById('modal-result').className = 'result result-win';
  document.getElementById('modal-result').textContent = `+${data.tokensEarned} tokens!`;
  document.getElementById('modal-actions').innerHTML = '<button class="btn btn-outline" onclick="closeModal()">Nice</button>';
}

async function skipSocialGame(game) {
  tokenBalance -= game.skipCost;
  updateBalance();
  document.getElementById('modal-result').className = 'result result-lose';
  document.getElementById('modal-result').textContent = `-${game.skipCost} tokens`;
  document.getElementById('modal-actions').innerHTML = '<button class="btn btn-outline" onclick="closeModal()">OK</button>';
}

function showModal(title, content, buttons) {
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-challenge').innerHTML = content;
  document.getElementById('modal-result').textContent = '';
  const actions = document.getElementById('modal-actions');
  actions.innerHTML = '';
  buttons.forEach(b => {
    const btn = document.createElement('button');
    btn.className = 'btn ' + b.class;
    btn.textContent = b.text;
    btn.addEventListener('click', b.action);
    actions.appendChild(btn);
  });
  document.getElementById('modal').classList.add('active');
}
function closeModal() { document.getElementById('modal').classList.remove('active'); }
function updateBalance() { document.getElementById('token-balance').textContent = tokenBalance; }

document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('games-section').style.display = tab.dataset.tab === 'games' ? '' : 'none';
    document.getElementById('casino-section').style.display = tab.dataset.tab === 'casino' ? '' : 'none';
    document.getElementById('rooms-section').style.display = tab.dataset.tab === 'rooms' ? '' : 'none';
  });
});

if (window.DungeonChat && window.Ably) {
  DungeonChat.init('grand-hall', guestId, document.getElementById('hall-messages'), null);
}
document.getElementById('hall-chat-form').addEventListener('submit', (e) => {
  e.preventDefault();
  const input = document.getElementById('hall-chat-input');
  const msg = input.value.trim();
  if (!msg) return;
  if (window.DungeonChat && DungeonChat.channel) { DungeonChat.send(msg); }
  else {
    const div = document.createElement('div');
    div.className = 'chat-msg';
    div.innerHTML = `<span class="chat-avatar">${guestId[0].toUpperCase()}</span><p><strong>${guestId}:</strong> ${msg}</p>`;
    document.getElementById('hall-messages').appendChild(div);
  }
  input.value = '';
});

loadGames();
loadCasino();
loadRooms();
</script>
<script src="/public/js/admin-bar.js"></script>
</body>
</html>
