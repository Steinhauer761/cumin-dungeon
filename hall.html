<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grand Hall | CumIN Dungeon</title><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600;1,700&family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet"><style>:root{--bg:#0a0604;--surface:#141010;--gold:#d59a4b;--light:#f5c77e;--cream:#f5eee4;--muted:#a6998b;--line:rgba(190,137,77,.18);--serif:'Cormorant Garamond',Georgia,serif;--sans:Inter,system-ui,sans-serif}*{box-sizing:border-box;margin:0}body{background:var(--bg);color:var(--cream);font:15px/1.5 var(--sans)}a{color:inherit}.hero{height:280px;position:relative;overflow:hidden}.hero img{width:100%;height:100%;object-fit:cover}.hero:after{content:'';position:absolute;inset:0;background:linear-gradient(transparent,rgba(10,6,4,.96))}.hero h1{position:absolute;z-index:1;bottom:25px;left:32px;font:italic 700 2.3rem var(--serif)}.wrap{padding:24px;max-width:1200px;margin:auto}.back{display:inline-block;padding:9px 13px;border:1px solid var(--line);border-radius:8px;text-decoration:none;font-size:12px;margin-bottom:20px}.tokens{padding:12px 16px;border:1px solid var(--line);border-radius:12px;background:var(--surface);margin-bottom:24px}.tokens b{color:var(--light);font-size:18px}.note{color:var(--muted);font-size:12px}.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:13px}.card{position:relative;min-height:175px;overflow:hidden;border:1px solid var(--line);border-radius:15px;background:var(--surface);text-decoration:none}.card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.25;transition:.3s}.card:hover img{opacity:.45;transform:scale(1.05)}.copy{position:relative;min-height:175px;padding:18px;display:flex;flex-direction:column}.copy h2{font:italic 700 1.3rem var(--serif)}.copy p{color:var(--muted);font-size:11px;margin-top:5px}.meta{margin-top:auto;color:var(--light);font-size:10px;font-weight:800}.tag{display:inline-block;margin-top:7px;color:#70ef8b;font-size:10px;font-weight:800}.chat{margin-top:24px;padding:15px;border:1px solid var(--line);background:var(--surface);border-radius:12px}.chat h3{font-size:13px}.chat p{color:var(--muted);font-size:10px}@media(max-width:700px){.hero{height:200px}.hero h1{left:18px}.wrap{padding:18px}.games{grid-template-columns:1fr 1fr}}@media(max-width:430px){.games{grid-template-columns:1fr}}</style></head><body><section class="hero"><img src="/public/assets/art/6766.png" alt="The Grand Hall"><h1>The Grand Hall</h1></section><main class="wrap"><a class="back" href="/">← Back to Lobby</a><div class="tokens"><b id="balance">500</b> tokens <span class="note"> · Entertainment tokens · Casino play only</span></div><h2 style="font:italic 700 1.6rem var(--serif);margin-bottom:15px">Casino</h2><div class="games" id="games"></div><div class="chat"><h3>Grand Hall Chat</h3><p>Everyone's welcome. Consent required for DMs.</p></div></main><script>const games=[
['Dungeon Slots','Upgraded five-reel machine with Fireball bonuses.','5-100','/public/games/slots.html','/public/assets/art/b3239591-8c30-4dae-b261-7c42ab8022f1.png','NEW'],
['Fireball Keno','Pick numbers, catch fireballs and unlock 20 free spins.','5-100','/public/games/fireball-keno.html','/public/assets/art/e6c0d2d7-f4e2-40bb-b34c-13b84d7b7fe1.png','BONUS'],
['Sin Roulette','Pick your number or color. The wheel decides.','5-50','/games/roulette.html','/public/assets/art/cd1f1eae-f7ce-4c72-85b1-457d8bf4f3c1.png','36x'],
['Strip Blackjack','Beat the dealer to 21. Double down if you dare.','10-100','/games/blackjack.html','/public/assets/art/d8541cfb-406f-46c1-8ec3-39af3b570035.png','3:2'],
["Devil's Dice",'Predict the roll. Over, under, or exact.','5-50','/games/dice.html','/public/assets/art/e6c0d2d7-f4e2-40bb-b34c-13b84d7b7fe1.png','32x'],
['High or Low','Guess the next card and build your streak.','10-50','/games/highlow.html','/public/assets/art/f7ce0ef5-b1c5-4ea5-8488-d5bb36035de3.png','10x'],
['Kink Wheel','Spin the wheel and land on a multiplier.','5-50','/games/kinkwheel.html','/public/assets/art/file_00000000b6c081fdaa791db34c771c9e.png','2x'],
['Velvet Reels','Classic five-reel room for a second slot experience.','5-100','/public/games/slots.html','/public/assets/art/b3239591-8c30-4dae-b261-7c42ab8022f1.png','FIRE']
];const el=document.getElementById('games');games.forEach(g=>el.innerHTML+=`<a class="card" href="${g[3]}"><img src="${g[4]}" alt=""><div class="copy"><h2>${g[0]}</h2><p>${g[1]}</p><span class="meta">BET: ${g[2]}</span><span class="tag">${g[5]}</span></div></a>`);</script></body></html>
