<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Room | CumIN Dungeon</title><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet"><style>:root{--bg:#0a0604;--surface:#110d0a;--gold:#d59a4b;--gold-light:#f5c77e;--red:#e63946;--cream:#f5eee4;--muted:#a6998b;--line:rgba(190,137,77,.18);--serif:'Cormorant Garamond',Georgia,serif;--sans:'Inter',system-ui,sans-serif}*{box-sizing:border-box;margin:0}body{background:var(--bg);color:var(--cream);font-family:var(--sans);font-size:14px;line-height:1.5;overflow-x:hidden}button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}.room-page{height:100vh;height:100dvh;display:flex;flex-direction:column;position:relative}.video-area{flex:1;position:relative;background:#000;display:grid;place-items:center;overflow:hidden}.room-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.45;animation:pan 30s ease-in-out infinite alternate}@keyframes pan{to{transform:scale(1.08) translate(-1%,-1%)}}.video-placeholder{position:relative;z-index:2;text-align:center;color:var(--muted)}.video-placeholder .icon{font-size:3rem;opacity:.25;display:block}.top-bar,.bottom-bar{position:absolute;left:0;right:0;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:16px}.top-bar{top:0;background:linear-gradient(rgba(0,0,0,.75),transparent)}.bottom-bar{bottom:0;align-items:flex-end;background:linear-gradient(transparent,rgba(0,0,0,.85))}.live-badge{padding:5px 10px;border-radius:99px;background:var(--red);font-size:.55rem;font-weight:800}.top-right{display:flex;gap:8px;align-items:center}.viewers-pill,.btn-nav{padding:7px 12px;border-radius:8px;background:rgba(0,0,0,.62);border:1px solid var(--line);font-size:.65rem}.room-info h2{font:italic 600 1.35rem var(--serif)}.room-info p{font-size:.65rem;color:var(--muted)}.actions{display:flex;gap:8px}.casino-btn,.vip-btn{padding:10px 16px;border-radius:10px;font-size:.7rem;font-weight:800;text-decoration:none}.casino-btn{background:#17100b;border:1px solid var(--gold);color:var(--gold-light)}.vip-btn{background:#9d2530;color:white}.chat{height:48px;background:var(--surface);border-top:1px solid var(--line);display:grid;place-items:center;color:var(--muted);font-size:.7rem}@media(min-width:900px){.room-page{flex-direction:row}.chat{height:auto;width:320px;border-top:0;border-left:1px solid var(--line)}}</style></head><body><div class="room-page"><div class="video-area" id="video-area"><img class="room-bg" id="room-bg" alt=""><div class="video-placeholder"><span class="icon">✧</span>Performer stream appears here when live</div><div class="top-bar"><span class="live-badge">Live</span><div class="top-right"><span class="viewers-pill" id="viewer-count">● 0</span><button class="btn-nav" onclick="location.href='/'">Back</button></div></div><div class="bottom-bar"><div class="room-info"><h2 id="room-title">Loading...</h2><p id="room-desc"></p></div><div class="actions"><a class="casino-btn" href="/casino.html" data-from="room" data-to="casino">♦ Casino</a><button class="vip-btn" id="vip-btn">✧ Go Private</button></div></div></div><aside class="chat">Room chat</aside></div><script src="/public/js/transitions.js"></script><script>
const roomId=new URLSearchParams(location.search).get('id')||'velvet-room';
const ART={
'velvet-room':'/public/assets/art/b3239591-8c30-4dae-b261-7c42ab8022f1~3.jpg',
'tangled-throne':'/public/assets/art/cd1f1eae-f7ce-4c72-85b1-457d8bf4f3c1~2.jpg',
'pink-silk':'/public/assets/art/d8541cfb-406f-46c1-8ec3-39af3b570035~2.jpg',
'devils-playground':'/public/assets/art/3af61642-13f2-481f-b7d3-2b2dc3fbd6bb~2.jpg',
'back-room':'/public/assets/art/20ba6b23-151d-414c-a0cb-db37a45c64ca~2.jpg',
'the-dungeon':'/public/assets/art/file_00000000b6c081fdaa791db34c771c9e.png',
'haleys-halo':'/public/assets/art/1_b5972f3b-52bb-4d4e-8eb2-059583b51bbc~2.jpg',
'trans-kinks':'/public/assets/art/7a1332f7-9c1a-4ed3-9f66-1805d93a7e2c~2.jpg'};
document.getElementById('room-bg').src=ART[roomId]||ART['velvet-room'];
fetch('/api/rooms/'+roomId).then(r=>r.json()).then(room=>{document.getElementById('room-title').textContent=room.name||'Room';document.getElementById('room-desc').textContent=room.description||'';document.getElementById('viewer-count').textContent='● '+(room.viewers||0)+' watching';document.title=(room.name||'Room')+' | CumIN Dungeon'});
document.getElementById('vip-btn').onclick=()=>location.href='/private-show.html?performer='+encodeURIComponent(document.getElementById('room-title').textContent)+'&rate=5';
</script></body></html>
