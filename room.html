<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0a0604"><title>Room | CumIN Dungeon</title><link rel="stylesheet" href="/public/css/brand.css"><style>.page{height:100dvh;display:grid;grid-template-columns:1fr 320px}.video{position:relative;overflow:hidden;background:#000}.room-bg,mux-player{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.room-bg{opacity:.5}.bar{position:absolute;z-index:5;left:0;right:0;padding:16px;display:flex;justify-content:space-between;align-items:center}.top{top:0;background:linear-gradient(#000b,transparent)}.bottom{bottom:0;align-items:end;background:linear-gradient(transparent,#000d)}h1{font:italic 700 1.5rem var(--serif)}.actions{display:flex;gap:8px}.btn{padding:10px 15px;border-radius:9px;text-decoration:none;border:1px solid var(--line);background:#100b08;color:var(--cream);font-size:.75rem;font-weight:700}.vip{background:var(--red);border-color:var(--red)}.chat{background:var(--surface);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}.messages{flex:1;overflow:auto;padding:16px}.chat-msg{padding:6px 0;color:#c8bbb0;font-size:.75rem}.chat form{display:flex;gap:7px;padding:12px;border-top:1px solid var(--line)}.chat input{flex:1;padding:10px;background:var(--bg);border:1px solid var(--line);border-radius:7px;color:var(--cream);font-size:.75rem}.chat button{padding:10px;background:var(--gold);border:0;border-radius:7px;color:#160d06;font-weight:800}.offline{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);z-index:2}.giftbar{position:absolute;z-index:6;bottom:75px;left:16px;display:flex;gap:6px;flex-wrap:wrap}.giftbar button{padding:7px 10px;background:#100b08;border:1px solid var(--line);border-radius:99px;color:var(--gold);font-size:.7rem}@media(max-width:850px){.page{grid-template-columns:1fr;grid-template-rows:1fr 180px}.chat{border-left:0;border-top:1px solid var(--line)}}</style></head><body><div class="page"><main class="video" id="video"><img class="room-bg" id="bg" alt=""><div class="offline" id="offline">Performer stream appears here when live</div><div class="bar top"><span id="live">Offline</span><div><span id="viewers">● 0</span> <a class="btn" href="/">Back</a></div></div><div class="giftbar" id="gifts"></div><div class="bar bottom"><div><h1 id="title">Loading...</h1><p id="desc"></p></div><div class="actions"><a class="btn" href="/casino.html" data-from="room" data-to="casino">♦ Casino</a><a class="btn vip" id="vip" href="#">✧ Go Private</a></div></div></main><aside class="chat"><div class="messages" id="messages"><p>Sign in to join room chat.</p></div><form id="chatForm"><input id="chatInput" maxlength="200" placeholder="Say something"><button>Send</button></form></aside></div><script src="https://cdn.jsdelivr.net/npm/@mux/mux-player@latest"></script><script src="https://cdn.ably.com/lib/ably.min-1.js"></script><script src="/public/js/auth-fetch.js"></script><script src="/public/js/chat.js"></script><script src="/public/js/transitions.js"></script><script>
const id=new URLSearchParams(location.search).get('id')||'velvet-room';let performerId=null;const ART={'velvet-room':'/public/assets/art/b3239591-8c30-4dae-b261-7c42ab8022f1~3.jpg','tangled-throne':'/public/assets/art/cd1f1eae-f7ce-4c72-85b1-457d8bf4f3c1~2.jpg','pink-silk':'/public/assets/art/d8541cfb-406f-46c1-8ec3-39af3b570035~2.jpg','devils-playground':'/public/assets/art/3af61642-13f2-481f-b7d3-2b2dc3fbd6bb~2.jpg','back-room':'/public/assets/art/20ba6b23-151d-414c-a0cb-db37a45c64ca~2.jpg','the-dungeon':'/public/assets/art/file_00000000b6c081fdaa791db34c771c9e.png','haleys-halo':'/public/assets/art/1_b5972f3b-52bb-4d4e-8eb2-059583b51bbc~2.jpg','trans-kinks':'/public/assets/art/7a1332f7-9c1a-4ed3-9f66-1805d93a7e2c~2.jpg'};bg.src=ART[id]||ART['velvet-room'];
fetch('/api/rooms/'+id).then(r=>r.json()).then(x=>{title.textContent=x.name||'Room';desc.textContent=x.description||'';document.title=(x.name||'Room')+' | CumIN Dungeon';vip.href='/private-show.html?performer='+encodeURIComponent(x.performer?.stageName||x.name)});
async function loadStream(){if(!DungeonAuth.token())return;const r=await DungeonAuth.fetch('/api/stream/playback?roomId='+encodeURIComponent(id));if(!r.ok)return;const x=await r.json();performerId=x.performerId||null;if(x.live&&!document.querySelector('mux-player')){const p=document.createElement('mux-player');p.setAttribute('playback-id',x.playbackId);p.setAttribute('stream-type','live');p.setAttribute('autoplay','');p.setAttribute('muted','');p.style.setProperty('--media-accent-color','#d59a4b');video.prepend(p);offline.style.display='none';live.textContent='● LIVE'}}loadStream();setInterval(loadStream,5000);
if(DungeonAuth.token()){messages.innerHTML='';DungeonChat.init(id,messages,viewers).catch(e=>messages.textContent=e.message)}chatForm.onsubmit=e=>{e.preventDefault();if(!DungeonAuth.token())return DungeonAuth.require();DungeonChat.send(chatInput.value);chatInput.value=''};
fetch('/api/tokens/redeem').then(r=>r.json()).then(x=>x.gifts.slice(0,6).forEach(g=>{const b=document.createElement('button');b.textContent=g.emoji+' '+g.cost;b.onclick=async()=>{if(!performerId)return alert('No performer is live');const r=await DungeonAuth.fetch('/api/tokens/redeem',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type:'gift',giftId:g.id,recipientId:performerId})});const d=await r.json();alert(r.ok?'Gift sent':d.error)};gifts.appendChild(b)}));
</script><script src="/public/js/admin-bar.js"></script></body></html>
